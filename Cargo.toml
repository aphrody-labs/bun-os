[workspace.package]
version = "1.4.7"
edition = "2024"
license = "MIT"
repository = "https://github.com/aphrody-labs/bun-distribution"
rust-version = "1.97"
authors = ["aphrody-dev <contact@aphrody.com>"]
homepage = "https://aphrody.app"
keywords = ["aphrody", "bun", "runtime", "protocol", "workspace"]
categories = ["development-tools", "api-bindings", "web-programming"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "warn"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

