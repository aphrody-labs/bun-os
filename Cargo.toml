# PyO3: aphrody-labs fork, pinned.
pyo3 = { git = "https://github.com/aphrody-labs/pyo3", rev = "451d99fdcdcddf159e8e0a1186960b332cdb5d7c" }
pyo3-build-config = { git = "https://github.com/aphrody-labs/pyo3", rev = "451d99fdcdcddf159e8e0a1186960b332cdb5d7c" }
pyo3-ffi = { git = "https://github.com/aphrody-labs/pyo3", rev = "451d99fdcdcddf159e8e0a1186960b332cdb5d7c" }
pyo3-macros = { git = "https://github.com/aphrody-labs/pyo3", rev = "451d99fdcdcddf159e8e0a1186960b332cdb5d7c" }
pyo3-macros-backend = { git = "https://github.com/aphrody-labs/pyo3", rev = "451d99fdcdcddf159e8e0a1186960b332cdb5d7c" }
zip2 = { package = "zip", git = "https://github.com/zip-rs/zip2", tag = "v2.6.1" }
zip = { git = "https://github.com/zip-rs/zip2", tag = "v8.6.0" }
bun-re = { path = "crates/re" }
simdutf = { path = "crates/simdutf" }
rfb-encodings = { path = "crates/rfb-encodings" }
aphrody-m3-tokens = { path = "crates/aphrody-m3-tokens" }
hayro = { path = "apps/pdfcraft/vendor/hayro" }
hayro-interpret = { path = "apps/pdfcraft/vendor/hayro-interpret" }
hayro-syntax = { path = "apps/pdfcraft/vendor/hayro-syntax" }
hayro-jbig2 = { path = "apps/pdfcraft/vendor/hayro-jbig2" }
lopdf = { path = "apps/pdfcraft/vendor/lopdf" }
winit = { path = "apps/pdfcraft/vendor/winit" }
egui-wgpu = { path = "apps/pdfcraft/vendor/egui-wgpu" }

# Zakuro's hot crates are unusable without optimisation, as in its own workspace.
[profile.dev.package.zakuro-cpu]
opt-level = 3
[profile.dev.package.zakuro-gpu]
opt-level = 3
[profile.dev.package.zakuro-core]
opt-level = 2

# Browser emulation builds (packages/bun-engine/web-emulation): whole-program optimisation for
# wasm32-unknown-unknown; wasm-bindgen and wasm-opt -O3 run afterwards.
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
incremental = false

# Bevy (crates/bevy): stress tests and the mobile example, as upstream.
# Craft browser apps (apps/webos/build-craft.ts): smallest download; wasm-bindgen and wasm-opt -Oz run afterwards.
[profile.web-craft]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
incremental = false

[profile.stress-test]
inherits = "release"
lto = "fat"
panic = "abort"
[profile.dev.package.bevy_mobile_example]
strip = true
