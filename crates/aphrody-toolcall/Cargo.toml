# SPDX-License-Identifier: Apache-2.0
[package]
workspace = "../.."
name = "aphrody-toolcall"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/bun-os/tree/main/crates/aphrody-toolcall"
license = "Apache-2.0"
description            = "Tool catalogue model for the aphrody agent engine: ToolDefinition (name / description / JSON-schema input & output), the async ToolExecutor trait, ToolExposure (Direct / Deferred / DirectModelOnly / Hidden), and a JsonSchema type with prompt-budget compaction passes. Inspired by OpenAI Codex tools (Apache-2.0)."

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
async-trait = { workspace = true }
thiserror   = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
