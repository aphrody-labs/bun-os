# SPDX-License-Identifier: Apache-2.0
[package]
workspace = "../.."
name = "aphrody-translate-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/bun-os/tree/main/crates/aphrody-translate-core"
license = "Apache-2.0"
description            = "Pure stages of the aphrody comment rewriter: comment extraction, AI-marker scrubbing, Aphrody style, language detection. No network, no runtime; wasm32-safe."

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[dependencies]
regex = { workspace = true }
