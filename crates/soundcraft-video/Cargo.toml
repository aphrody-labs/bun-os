[package]
name = "soundcraft-video"
description = "SoundCraft video: MP4/MOV demux, H.264 / ProRes / Motion JPEG decoding to RGBA, timeline thumbnails"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/storytold/soundcraft"

[features]
default = []
# Frame-parallel H.264 and slice-parallel ProRes decoding (rayon). Off by default: SoundCraft
# decodes on its own background thread and only needs one picture at a time.
threads = ["filmcraft-h264/threads", "filmcraft-prores/threads"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
filmcraft-bitstream = { path = "../filmcraft-bitstream", version = "0.9.0" }
filmcraft-h264 = { path = "../filmcraft-h264", version = "0.9.0", default-features = false }
filmcraft-isobmff = { path = "../filmcraft-isobmff", version = "0.9.0" }
filmcraft-prores = { path = "../filmcraft-prores", version = "0.9.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
