[package]
name = "photocraft-compose"
version = "0.8.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Photocraft CPU reference compositor: flattens a document layer tree into straight-alpha RGBA."
repository = "https://github.com/aphrody-labs/bun-os"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
photocraft-geom = { path = "../photocraft-geom", version = "0.8.2" }
photocraft-color = { path = "../photocraft-color", version = "0.8.2" }
photocraft-raster = { path = "../photocraft-raster", version = "0.8.2" }
photocraft-doc = { path = "../photocraft-doc", version = "0.8.2" }
photocraft-vector = { path = "../photocraft-vector", version = "0.8.2" }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false }
photocraft-paint = { path = "../photocraft-paint" }

[[bench]]
name = "compose"
harness = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }
