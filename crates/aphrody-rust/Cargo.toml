# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license = "Apache-2.0"
description = "PyO3 extension module aphrody.aphrody_rust of the aphrody Python SDK (abi3-py311)"

[lib]
name = "aphrody_rust"
crate-type = ["cdylib"]

[dependencies]
# The kernels need no JS/TS chunker: the oxc parser stays out of the wheel.
aphrody-rag-core = { path = "../aphrody-rag-core", version = "1.4.7", default-features = false }
pyo3 = { workspace = true, features = ["abi3-py311", "extension-module"] }

[lints]
workspace = true
