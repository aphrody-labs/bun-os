[package]
name = "aphrody-nie-ffi"
description = "Frontière FFI C-ABI: expose la logique nie (CRC32 RDBN, PRNG CRand MT19937, décodage formats, VFS) à Bun et autres runtimes"
version.workspace = true
edition.workspace = true
license-file = "../../docs/licenses/iecode/nie/LICENSE"
publish = false
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]
name = "iecode"
# Le package reste `aphrody-nie-ffi` pour préserver le graphe Cargo ; l'artefact partagé
# commun porte désormais le nom produit `iecode`.

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
# `serde` : sérialise `TeamSetup` / `MatchResult`, requis par `nie_match_simulate_json_out`.
aphrody-nie-core = { workspace = true, features = ["serde"] }
aphrody-nie-data = { workspace = true, features = ["serde"] }
# serde feature : active serde::Serialize sur G4tx, CfgBinFile, RdbnData, G4pkmLayout,
# G4md, LipSync, MevbinDocument, MenuObject, CpkHeader, G4pk — requis par nie_decode_json.
# Feature `textures` = décodeur G4TX/DDS → RGBA8/PNG partagé (`aphrody_nie_formats::g4tx_decode`),
# utilisé par nie_g4tx_to_png (le DDS/BCn vit désormais dans aphrody-nie-formats).
aphrody-nie-formats = { workspace = true, features = ["serde", "textures", "remote-vfs"], default-features = true }
serde_json = { workspace = true }
# `image` : encodage PNG des atlas de glyphes (make_glyph_png) + décodage dans les tests.
image = { workspace = true, features = ["png"] }
# `aphrody-nie-runtime` : le moteur de match jouable (World/step/kickoff), exposé au bloc `nie_world_*`.
# C'est ce qui permet à un runtime extérieur — la lib Python `niepy`, donc Ren'Py — de faire
# TOURNER la simulation, et pas seulement de lire des assets.
aphrody-nie-runtime.workspace = true
aphrody-nie-app.workspace = true
# Rust-owned wiki queries exposed to Bun through the native boundary.
aphrody-nie-wiki.workspace = true
# The single in-process console/backend contract exposed to Bun and other hosts.
bun-engine.workspace = true
# Save game encryption/decryption, checksums and blob extraction
aphrody-nie-save = { workspace = true, features = ["serde"] }
