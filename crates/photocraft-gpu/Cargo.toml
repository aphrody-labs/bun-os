[package]
name = "photocraft-gpu"
version = "0.8.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Photocraft GPU compositor on wgpu, matching the CPU reference composite."
repository = "https://github.com/aphrody-labs/bun-os"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
half = "2"
photocraft-geom = { path = "../photocraft-geom", version = "0.8.2" }
photocraft-color = { path = "../photocraft-color", version = "0.8.2" }
photocraft-raster = { path = "../photocraft-raster", version = "0.8.2" }
photocraft-doc = { path = "../photocraft-doc", version = "0.8.2" }
photocraft-compose = { path = "../photocraft-compose", version = "0.8.2" }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
log = "0.4"

[dev-dependencies]
wgpu = "30"
pollster = "1"
photocraft-vector = { path = "../photocraft-vector" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Effect distance fields are computed in parallel bands.
rayon = { workspace = true }
