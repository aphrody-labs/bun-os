[package]
name = "designcraft-render"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "DesignCraft renderer: spreads, pages, frames, composed text and images to pixels (vello_cpu)"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
designcraft-geom = { path = "../designcraft-geom", version = "0.7.1" }
designcraft-color = { path = "../designcraft-color", version = "0.7.1" }
designcraft-doc = { path = "../designcraft-doc", version = "0.7.1" }
designcraft-fonts = { path = "../designcraft-fonts", version = "0.7.1" }
designcraft-compose = { path = "../designcraft-compose", version = "0.7.1" }
vello_cpu = "0.2"
vello_common = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
hayro = { package = "aphrody-hayro", path = "../../apps/pdfcraft/vendor/hayro", version = "0.7.1" }
designcraft-images = { path = "../designcraft-images", version = "0.7.1" }
log = "0.4"
serde = { version = "1", features = ["derive", "rc"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { version = "0.2", features = ["multithreading"] }
