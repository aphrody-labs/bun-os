[package]
name = "cadcraft-ui-egui"
description = "CADCraft user interface (egui): the swappable front end"
workspace = "../.."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-labs/bun-os/tree/main/crates/cadcraft-ui-egui"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
craft-ui = { workspace = true, features = ["serde"] }
cadcraft-geom = { workspace = true }
cadcraft-color = { workspace = true }
cadcraft-doc = { workspace = true }
cadcraft-render = { workspace = true }
cadcraft-engine = { workspace = true }
egui = { workspace = true, features = ["default_fonts"] }
# GPU canvas paint callback (same egui-wgpu/wgpu eframe uses with its "wgpu" feature).
egui-wgpu = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
log = { workspace = true }
image = { workspace = true, features = ["png", "jpeg"] }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
# Validates the canvas WGSL and its GLSL ES 3.0 (WebGL2) translation in tests (same naga wgpu uses).
naga = { workspace = true, features = ["wgsl-in", "glsl-out"] }

[build-dependencies]
serde_json = { workspace = true }
toml = { workspace = true, features = ["display", "parse", "serde", "std"] }
