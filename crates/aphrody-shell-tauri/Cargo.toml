# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-shell-tauri"
description = "Tauri 3 plugin exposing native PTY shell sessions to the aphrody-shell-web webview client."
version = "1.4.7"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/aphrody"
links = "aphrody-shell-tauri"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dependencies]
aphrody-terminal-backend = { path = "../aphrody-terminal-backend", version = "1.4.7", features = [] }
tauri = { workspace = true, features = ["compression"] }
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full"] }
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full"] }
serde_json = "1.0.151"
