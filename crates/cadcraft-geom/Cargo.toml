[package]
name = "cadcraft-geom"
description = "CADCraft geometry: f64 vectors, curves, arcs, splines, intersections, offsets, snaps"
workspace = "../.."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-labs/bun-os/tree/main/crates/cadcraft-geom"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
serde = { workspace = true, features = ["rc"] }
