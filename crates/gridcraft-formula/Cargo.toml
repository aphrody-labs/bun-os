[package]
name = "gridcraft-formula"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-labs/bun-os"
description = "GridCraft formula language: lexer, parser, printer and reference adjustment"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
gridcraft-core = { path = "../gridcraft-core", version = "0.6.1" }
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"
