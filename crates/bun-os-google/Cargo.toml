# SPDX-License-Identifier: Apache-2.0
[package]
name = "bun-os-google"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license = "Apache-2.0"
description = "Google SDK for Bun OS: public search (SERP, discovery, cache), language detection atlas and the Google project contract."

[lib]
name = "bun_google"
path = "src/lib.rs"

[features]
default = []
search = ["dep:tokio", "dep:rustls", "dep:bun_browser_dom", "dep:regex", "dep:reqwest", "dep:url", "dep:chrono"]
search-cache = ["search", "dep:rusqlite"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, optional = true, features = ["macros", "rt-multi-thread", "time"] }
rustls = { workspace = true, optional = true }
bun_browser_dom = { version = "1.4.7", optional = true }
regex = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
url = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
