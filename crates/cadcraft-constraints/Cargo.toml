[package]
name = "cadcraft-constraints"
description = "CADCraft parametric solver: geometric and dimensional constraints (own damped Gauss-Newton solver), expressions"
workspace = "../.."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-labs/bun-os/tree/main/crates/cadcraft-constraints"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
cadcraft-geom = { workspace = true }
cadcraft-doc = { workspace = true }
serde = { workspace = true, features = ["rc"] }
thiserror = { workspace = true }
