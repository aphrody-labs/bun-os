# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-m3"
version = "1.4.7"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/material"
license = "Apache-2.0"
description = "Rust Material 3 component and layout contracts for native and web hosts."

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[features]
default = ["native-render"]
native-render = ["dep:aphrody-render", "aphrody-render/cpu"]
wasm = []

[dependencies]
aphrody-m3-tokens = { workspace = true, features = ["serde"] }
aphrody-identity = { workspace = true, default-features = false }
taffy = { workspace = true }
aphrody-render = { workspace = true, optional = true }
serde = { workspace = true }
