# SPDX-License-Identifier: FSL-1.1-ALv2
#
# aphrody-drive: Aphrody Drive, the file explorer of Aphrody OS, as a Tauri 3 plugin hosted by
# the desktop (crates/ui/app). Derived from the Spacedrive desktop app (drive/apps/tauri).
# The explorer core runs out of process (`sd-daemon`, built from the drive/ workspace) and is
# reached over its local newline-delimited JSON socket, so this crate never links the core.

[package]
name = "aphrody-drive"
description = "Aphrody Drive, the Aphrody OS file explorer: Tauri 3 plugin that supervises the sd-daemon core and bridges it to the explorer webview."
version = "1.4.7"
edition = "2024"
rust-version = "1.97"
# Derived from the FSL-licensed Spacedrive source in `drive/`. This is deliberately not inherited
# from the Apache-2.0 root workspace.
license = "FSL-1.1-ALv2"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/aphrody"
# Tauri plugin convention: `links` names the plugin, tauri-build reads its permission files
# through `DEP_APHRODY_DRIVE_PERMISSION_FILES_PATH`.
links = "aphrody-drive"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dependencies]
aphrody-proc = { path = "../aphrody-proc", version = "1.4.7", features = [] }
aphrody-kernel = { path = "../aphrody-kernel", version = "1.4.7", default-features = false, features = [] }
aphrody-subsystem = { path = "../aphrody-subsystem", version = "1.4.7" }
tauri = { workspace = true }
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1", "http2"] }
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
log = "0.4.34"
dirs = "7.0.0"
parking_lot = "0.12.5"
uuid = { version = "1.26.0", features = ["v4", "v7", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
swift-rs = { version = "1.0", features = ["serde"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { version = "1.0", features = ["build"] }

[target.'cfg(target_os = "linux")'.dependencies]
open = { version = "5.4.3" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation","Globalization","Graphics_Imaging","Media_Ocr","Media_SpeechSynthesis","Media_Core","Storage_Streams","Win32_Foundation","Win32_Media_Audio","Win32_Security","Win32_Graphics_Dwm","Win32_Graphics_Gdi","Win32_Storage_IndexServer","Win32_System_Com","Win32_System_Ole","Win32_System_Search","Win32_System_Threading","Win32_System_IO","Win32_System_Diagnostics_Debug","Win32_System_Memory","Win32_System_SystemInformation","Win32_System_Diagnostics_ToolHelp","Win32_System_Variant","Win32_UI_WindowsAndMessaging","Win32","Win32_System","Win32_System_Console","Win32_UI_Shell","Win32_UI_Shell_Common"] }
