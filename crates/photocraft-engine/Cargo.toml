[package]
name = "photocraft-engine"
version = "0.8.2"
edition = "2024"
license = "MIT OR Apache-2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []

[dependencies]
photocraft-geom = { path = "../photocraft-geom", version = "0.8.2" }
photocraft-color = { path = "../photocraft-color", version = "0.8.2" }
photocraft-cms = { path = "../photocraft-cms", version = "0.8.2" }
photocraft-raster = { path = "../photocraft-raster", version = "0.8.2" }
photocraft-doc = { path = "../photocraft-doc", version = "0.8.2" }
photocraft-compose = { path = "../photocraft-compose", version = "0.8.2" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
photocraft-paint = { path = "../photocraft-paint", version = "0.8.2" }
photocraft-algo = { path = "../photocraft-algo", version = "0.8.2" }
photocraft-text = { path = "../photocraft-text", version = "0.8.2" }
photocraft-vector = { path = "../photocraft-vector", version = "0.8.2" }
photocraft-io = { path = "../photocraft-io", version = "0.8.2" }
photocraft-psd = { path = "../photocraft-psd", version = "0.8.2" }
photocraft-format = { path = "../photocraft-format", version = "0.8.2" }
photocraft-plugins = { path = "../photocraft-plugins", version = "0.8.2" }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
photocraft-codecs = { path = "../photocraft-codecs", version = "0.8.2" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
craft-print = { workspace = true }
roxmltree = "0.20"

[dev-dependencies]
photocraft-affinity = { path = "../photocraft-affinity", features = ["synth"] }
photocraft-raw = { path = "../photocraft-raw", features = ["testgen"] }
wat = "1.228"
exr = { version = "1.73", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"
