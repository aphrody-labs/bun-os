[package]
name = "aphrody"
version = "1.4.7"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-code"]
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/aphrody"
description           = "Aphrody — cross-platform Rust CLI (Linux / Windows / macOS / WebAssembly)."

# The general CLI lives under crates/infra/aphrody; package and binary identities
# remain `aphrody` for consumer compatibility.

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[features]
default = []
native = ["aphrody-command/native"]
rag = ["aphrody-command/rag"]
train = ["aphrody-command/train"]
magika = ["aphrody-command/magika"]
mcp-toolbox = ["aphrody-command/mcp-toolbox"]
mcp-jobs = ["aphrody-command/mcp-jobs"]
forensics = ["aphrody-command/forensics"]
index = ["aphrody-command/index"]
infer = ["aphrody-command/infer"]
ocr = ["aphrody-command/ocr"]
jobs = ["aphrody-command/jobs"]
yara = ["aphrody-command/yara"]

[dependencies]
aphrody-command = { path = "../aphrody-command", version = "1.4.7", features = [] }

[dev-dependencies]
serde_json = "1.0.151"

[[bench]]
name    = "cold_start"
harness = false

[package.metadata.cargo-machete]
ignored = ["ort"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = [] }
aphrody-guard = { path = "../aphrody-guard", version = "1.4.7", features = [] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
assert_cmd = { version = "2", features = [] }
predicates = { version = "3", features = [] }
serde_json = { version = "1.0.151" }
tempfile = { version = "3.27.0" }
tokio = { version = "1.53.1", features = ["process","rt-multi-thread","macros","time","signal","sync","fs","io-util","full","rt"] }
criterion = { version = "0.8.2", features = ["html_reports"] }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libm = { version = "0.2.16" }
