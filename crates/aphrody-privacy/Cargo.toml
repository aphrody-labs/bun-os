[package]
name = "aphrody-privacy"
version.workspace = true
edition.workspace = true
publish = false
description = "Privacy-preserving cryptography behind bun:privacy (@aphrody/chromium): STAR, PPOPRF randomness, Privacy Pass and OPAQUE"
license = "MIT AND MPL-2.0 AND (MIT OR Apache-2.0)"

[lib]
path = "lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
# Shared with the rest of the workspace (curve25519-dalek 4.1.3, rand 0.8,
# zeroize, subtle, bitvec): no new curve or RNG implementation.
curve25519-dalek = { version = "4.1", default-features = false, features = ["alloc", "digest", "precomputed-tables", "rand_core", "zeroize"] }
rand = "0.8.5"
rand_core = "0.6.4"
rand_chacha = "0.3"
zeroize = { version = "1.5.5", features = ["derive"] }
subtle = "2.6"
bitvec = "1.0.1"
digest = "0.10"
hmac = "0.12"
sha2 = "0.10"
# STAR / PPOPRF transcript hash and the 2^128 + 12451 field of star-sharks.
strobe-rs = "0.10.0"
ff = { version = "0.13", features = ["derive"] }
# OPAQUE (RFC 9807) with the Brave Account cipher suite.
opaque-ke = { version = "3.0.0", default-features = false, features = ["argon2", "ristretto255-voprf"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }

[dev-dependencies]
base64 = "0.22"
