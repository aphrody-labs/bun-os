[package]
name = "photocraft-ui-egui"
version = "0.8.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Photocraft desktop UI shell built on egui and eframe."
repository = "https://github.com/aphrody-labs/bun-os"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
craft-ui = { path = "../craft-ui", version = "1.4.7", features = ["serde"] }
photocraft-geom = { path = "../photocraft-geom", version = "0.8.2" }
photocraft-color = { path = "../photocraft-color", version = "0.8.2" }
photocraft-cms = { path = "../photocraft-cms", version = "0.8.2" }
photocraft-raster = { path = "../photocraft-raster", version = "0.8.2" }
photocraft-doc = { path = "../photocraft-doc", version = "0.8.2" }
photocraft-compose = { path = "../photocraft-compose", version = "0.8.2" }
photocraft-gpu = { path = "../photocraft-gpu", version = "0.8.2" }
photocraft-engine = { path = "../photocraft-engine", version = "0.8.2" }
photocraft-io = { path = "../photocraft-io", version = "0.8.2" }
photocraft-plugins = { path = "../photocraft-plugins", version = "0.8.2" }
photocraft-algo = { path = "../photocraft-algo", version = "0.8.2" }
photocraft-text = { path = "../photocraft-text", version = "0.8.2" }
photocraft-vector = { path = "../photocraft-vector", version = "0.8.2" }
photocraft-paint = { path = "../photocraft-paint", version = "0.8.2" }
photocraft-format = { path = "../photocraft-format", version = "0.8.2" }
photocraft-codecs = { path = "../photocraft-codecs", version = "0.8.2" }
egui = { version = "0.36", default-features = false }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "accesskit"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
photocraft-raw = { path = "../photocraft-raw", features = ["testgen"] }
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
photocraft-testkit = { path = "../photocraft-testkit" }
photocraft-psd = { path = "../photocraft-psd" }

[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
epaint_default_fonts = "0.36"
serde_json = "1"
toml = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }
# Safe native UI-language APIs (Windows/macOS); no subprocess or web dependency.
sys-locale = "=0.3.2"

# Installed RAM for the GPU memory budget (`gpu_canvas::physical_memory`): the safe binding the
# desktop app already uses, pinned to the same version.

[target.'cfg(target_os = "windows")'.dependencies]
winsafe = { version = "=0.0.29", default-features = false, features = ["kernel"] }
