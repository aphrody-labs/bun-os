[package]
name = "filmcraft-export"
description = "Export pipeline: parallel render → encode → mux, presets, progress/cancel"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"


[dependencies]
filmcraft-time = { path = "../filmcraft-time", version = "0.9.0" }
filmcraft-frame = { path = "../filmcraft-frame", version = "0.9.0" }
filmcraft-color = { path = "../filmcraft-color", version = "0.9.0" }
filmcraft-media = { path = "../filmcraft-media", version = "0.9.0" }
filmcraft-project = { path = "../filmcraft-project", version = "0.9.0" }
filmcraft-render = { path = "../filmcraft-render", version = "0.9.0" }
filmcraft-audio-dsp = { path = "../filmcraft-audio-dsp", version = "0.9.0" }
filmcraft-geom = { path = "../filmcraft-geom", version = "0.9.0" }
filmcraft-text = { path = "../filmcraft-text", version = "0.9.0" }
filmcraft-isobmff = { path = "../filmcraft-isobmff", version = "0.9.0" }
filmcraft-prores = { path = "../filmcraft-prores", version = "0.9.0" }
filmcraft-dnx = { path = "../filmcraft-dnx", version = "0.9.0" }
filmcraft-apv = { path = "../filmcraft-apv", version = "0.9.0" }
filmcraft-mxf = { path = "../filmcraft-mxf", version = "0.9.0" }
filmcraft-aac = { path = "../filmcraft-aac", version = "0.9.0" }
filmcraft-flac = { path = "../filmcraft-flac", version = "0.9.0" }
filmcraft-h264enc = { path = "../filmcraft-h264enc", version = "0.9.0" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
rayon = { version = "1" }
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp"] }

[dev-dependencies]
filmcraft-testkit = { path = "../filmcraft-testkit" }
filmcraft-codecs = { path = "../filmcraft-codecs", version = "0.9.0" }
