[package]
name = "pdfcraft-preflight"
description = "Standards: verify PDF/A (ISO 19005) conformance and convert documents to PDF/A-2b or 3b"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/aphrody-labs/bun-os"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
pdfcraft-cos = { path = "../pdfcraft-cos", version = "0.7.1" }
pdfcraft-model = { path = "../pdfcraft-model", version = "0.7.1" }
