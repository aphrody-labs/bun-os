[package]
name = "gridcraft-model"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-labs/bun-os"
description = "GridCraft document model: workbooks, sheets, cells, styles, tables, charts"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
gridcraft-core = { path = "../gridcraft-core", version = "0.6.1" }
sha2 = { version = "0.11", default-features = false }
gridcraft-formula = { path = "../gridcraft-formula", version = "0.6.1" }
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
