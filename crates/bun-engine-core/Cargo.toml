[package]
name = "bun-engine"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Unified Rust engine and emulator kernel on Bevy 0.20: machine plugins over one Machine trait, one App, window, input, audio and render graph on wgpu 30, binary inspection and one CLI over every in-tree core"
repository = "https://github.com/aphrody-labs/bun-engine"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

# Every consumer selects what it shares; nothing is duplicated in another crate.
[features]
default = ["window", "audio", "gamepad", "nds", "nes", "gba", "psx", "host", "arm", "x86", "wii", "cartridge", "stream", "display-filter", "shell", "home"]
# Nintendo DS on Dust through aphrody-nds-sdk (software 2D/3D rendering, saves, saved states).
nds = ["dep:aphrody-nds-sdk", "aphrody-nds-sdk/nds"]
# Dust 2D/3D on the host's existing WGPU 30 device; CPU mode remains available.
nds-gpu = ["nds", "render", "aphrody-nds-sdk/nds-gpu"]
# Bevy scheduling of the DS core (wasm and desktop hosts).
host = ["nds", "runtime"]
bevy-web = ["host", "bevy/web"]
# AArch64 firmware machine on the rdynarmic JIT.
arm = ["dep:rdynarmic"]
# Game Boy Advance on RustBoyAdvance-NG with its free BIOS.
gba = ["dep:rustboyadvance-core"]
# PlayStation on StarPSX.
psx = ["dep:starpsx-core"]
# NES on TetaNES.
nes = ["dep:tetanes-core"]
# Nintendo 3DS on Zakuro through aphrody-nds-sdk (software PICA renderer); boots CXI/CCI/CIA and converted 3DSX.
ctr = ["dep:aphrody-nds-sdk", "aphrody-nds-sdk/ctr"]
# Nintendo Switch on Ruzu (rdynarmic JIT, null renderer with CPU framebuffer readback).
switch = ["dep:ruzu-core", "dep:ruzu-common", "dep:video_core", "dep:hid_core", "dep:log"]
# GameCube and Wii on the Gekko/Broadway interpreter.
wii = ["dep:aphrody-wii-runtime", "dep:aphrody-wii-image"]
# x86 guests on the Windows Hypervisor Platform.
x86 = ["dep:windows"]
# C++ cores (melonDS, Dolphin, Azahar, Kyty) loaded from packages/bun-emu-host plugins.
cpp-host = ["dep:bun-emu-host"]
# Bevy runtime (`bun_engine::runtime`, `bun_engine::bevy`): BunEnginePlugin, MachinePlugin and the
# per-machine plugins, headless runner on MinimalPlugins. No GPU, no system libraries.
runtime = ["dep:bevy", "bevy/std", "bevy/async_executor"]
# Target-neutral Bevy rendering: winit window, render schedules on wgpu 30, sprites, UI, text,
# keyboard and mouse, the FSR1 post-process.
render = [
    "runtime",
    "dep:wgpu",
    "bevy/bevy_log",
    "bevy/bevy_asset",
    "bevy/bevy_winit",
    "bevy/bevy_window",
    "bevy/bevy_render",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_camera",
    "bevy/bevy_image",
    "bevy/bevy_sprite",
    "bevy/bevy_sprite_render",
    "bevy/bevy_ui",
    "bevy/bevy_ui_render",
    "bevy/bevy_text",
    "bevy/default_font",
    "bevy/keyboard",
    "bevy/mouse",
]
# Display filters for the machine picture (scanlines, CRT, LCD grid, sharp bilinear, integer
# scaling) on a Material2d quad: `runtime::display_filter`.
display-filter = ["render"]
# Shell UI: app states (bevy_state), quick menu (Resume/Save/Load/Screenshot/Stop) and the
# performance overlay in bevy_ui: `runtime::shell`.
# `png` writes the composed-window Screenshot.
shell = ["render", "bevy/bevy_state", "bevy/png", "dep:serde_json"]
# Native home: tiles, hero, system shelf, directional focus navigation (bevy_input_focus) and a
# library trait with a mock and a read-only SQLite source (the library.db of packages/bun-engine):
# `runtime::home`.
home = ["shell", "bevy/bevy_input_focus", "dep:rusqlite"]
# Bevy Remote Protocol on loopback (127.0.0.1) so `bun` can drive the filter, pause and capture:
# `runtime::remote`. Native only (the HTTP server does not exist on wasm); not in `default`.
remote = ["shell", "bevy/bevy_remote", "dep:serde_json"]
# The desktop window (Bevy DefaultPlugins, multi-threaded, X11/Wayland on Linux).
window = ["render", "dep:aphrody-gpu-backend", "bevy/multi_threaded", "bevy/x11", "bevy/wayland"]
# Machine audio on a bevy_audio sink (ALSA on Linux).
audio = ["render", "bevy/bevy_audio"]
# Gamepads through bevy_gilrs (libudev on Linux).
gamepad = ["render", "bevy/bevy_gilrs", "bevy/gamepad"]
# Bevy on WebGPU in the browser (wasm32-unknown-unknown): examples/bevy_web.rs.
runtime-web = ["render", "bevy/web", "bevy/webgpu"]
# Native game-stream client in the window: Moonlight/GameStream protocol (pairing, RTSP, ENet
# control, RTP + FEC video), zero-copy Media Foundation decode into wgpu, FSR1 upscale, HUD.
stream = ["window", "dep:windows", "dep:rusty_enet", "dep:aes", "dep:aes-gcm", "dep:ring", "dep:rcgen", "dep:rsa", "dep:rustls"]
# Open-source BIOS/firmware loader: registry digests, streamed gzip/zstd decoding.
firmware = ["dep:sha2", "dep:miniz_oxide", "dep:ruzstd", "dep:serde_json"]
# Browser facade for play.aphrody.app (wasm32-unknown-unknown): the Bevy runtime on WebGPU
# (`runtime-web`, bevy_audio, gamepads) behind the wasm-bindgen `start`/`set_input`/`set_touch`
# contract, plus the open-source firmware loader. Build: packages/bun-engine/web-emulation.
web = [
    "firmware",
    "runtime-web",
    "audio",
    "gamepad",
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:web-sys",
]
# Steamworks SDK (steamworks-rs, bundled redistributable steam_api): init, Steam Input, overlay-safe
# present, Rich Presence, screenshots, Steam Cloud saves (ISteamRemoteStorage), stats stub.
# `steam::SteamPlugin` is the Bevy plugin over the same core (`crate::bevy`).
steam = ["window", "dep:steamworks", "dep:sha2", "dep:serde_json"]
# Nintendo DS cartridge inspection (`bun-engine info`).
cartridge = ["aphrody-dust-core/nds-complete", "dep:serde_json"]

[dependencies]
aphrody-dust-core = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
aphrody-nds-sdk = { path = "../aphrody-nds-sdk", version = "1.4.7", default-features = false, optional = true }
# Bevy 0.20 (wgpu 30, crates.io bevy 0.20.1), re-exported as `bun_engine::bevy`. The key must
# stay `bevy`: Bevy's derive macros resolve `bevy::ecs` through the dependency named `bevy`.
bevy = { workspace = true, optional = true }
rdynarmic = { path = "../rdynarmic", version = "0.1.0", optional = true }
tetanes-core = { path = "../../vendor/tetanes/tetanes-core", optional = true }
starpsx-core = { path = "../../vendor/starpsx/core", optional = true }
ruzu-core = { package = "core", path = "../ruzu-core", version = "1.4.7", default-features = false, optional = true }
ruzu-common = { package = "common", path = "../ruzu-common", version = "1.4.7", optional = true }
video_core = { path = "../ruzu-video-core", version = "1.4.7", default-features = false, optional = true }
hid_core = { path = "../ruzu-hid-core", version = "1.4.7", optional = true }
log = { workspace = true, optional = true }
rustboyadvance-core = { path = "../../vendor/rustboyadvance-ng/core", default-features = false, optional = true }
aphrody-wii-runtime = { path = "../aphrody-wii-runtime", version = "0.1.1", optional = true }
aphrody-wii-image = { path = "../aphrody-wii-image", version = "0.1.1", default-features = false, optional = true }
wgpu = { workspace = true, optional = true }
aphrody-gpu-backend = { path = "../aphrody-gpu-backend", version = "1.4.7", optional = true }
serde_json = { workspace = true, optional = true }
bun-emu-host = { path = "../bun-emu-host", version = "0.1.0", optional = true }
sha2 = { workspace = true, features = ["alloc"], optional = true }
miniz_oxide = { workspace = true, optional = true }
ruzstd = { version = "0.9.1", default-features = false, features = ["std"], optional = true }
wasm-bindgen = { workspace = true, features = ["std"], optional = true }
js-sys = { workspace = true, features = ["std"], optional = true }
web-sys = { workspace = true, features = ["std", "Document", "Element", "HtmlCanvasElement", "Window"], optional = true }
rusty_enet = { workspace = true, optional = true }
aes = { workspace = true, optional = true }
aes-gcm = { workspace = true, optional = true }
ring = { version = "0.17", optional = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"], optional = true }
rsa = { version = "0.9", optional = true }
rustls = { workspace = true, features = ["std", "ring", "tls12"], optional = true }
rusqlite = { workspace = true, features = ["bundled"], optional = true }
steamworks = { version = "0.13.1", features = ["raw-bindings"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_System_Hypervisor",
  "Win32_System_Memory",
  "Win32_UI_Input_XboxController",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
], optional = true }

[dev-dependencies]
aphrody-dust-soft-2d = { path = "../aphrody-dust-soft-2d", version = "0.0.1" }
aphrody-dust-soft-3d = { path = "../aphrody-dust-soft-3d", version = "0.0.1" }
serde_json = { workspace = true }

[[bin]]
name = "bun-engine"
path = "src/bin/bun-engine.rs"
required-features = ["window", "nds", "nes", "gba", "psx", "arm", "wii", "cartridge"]

[[example]]
name = "bevy_web"
required-features = ["runtime-web", "nes"]
