aphrody-embed = { path = "../aphrody-embed", version = "1.4.7", default-features = false, features = ["server"] }
aphrody-oxc-bridge = { version = "0.2.0" }
aphrody-voice = { path = "../aphrody-voice", version = "1.4.7", features = [] }
walkdir = { version = "2.5.0" }
ignore = { version = "0.4", features = [] }
rayon = { version = "1.12.0" }
aphrody-gemini-runtime = { path = "../aphrody-gemini-runtime", version = "1.4.7", features = [] }
aphrody-re = { package = "bun-re", version = "1.4.7", features = [] }
ort = { version = "2.0.0-rc.12", optional = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
aphrody-fsindex = { path = "../aphrody-fsindex", version = "1.4.7", features = [], optional = true }
sha2 = { version = "0.11.0" }
hex = { version = "0.4", features = [], optional = true }
aphrody-identity = { path = "../aphrody-identity", version = "1.4.7", features = ["net"] }
aphrody-m3-tokens = { path = "../aphrody-m3-tokens", version = "1.4.7", features = ["serde"] }
aphrody-memory = { path = "../aphrody-memory", version = "1.4.7", features = [] }
aphrody-models = { path = "../aphrody-models", version = "1.4.7", features = [] }
aphrody-secrets = { path = "../aphrody-secrets", version = "1.4.7", features = [] }
aphrody-infer = { path = "../aphrody-infer", version = "1.4.7", features = ["onnx"], optional = true }
aphrody-ocr = { path = "../aphrody-ocr", version = "1.4.7", features = [], optional = true }
aphrody-jobs = { path = "../aphrody-jobs", version = "1.4.7", features = [], optional = true }
dirs = { version = "7.0.0" }
aphrody-antigravity = { path = "../aphrody-antigravity", version = "1.4.7", features = [] }
aphrody-google = { path = "../aphrody-google", version = "1.4.7", features = [] }
aphrody-agent-home = { path = "../aphrody-agent-home", version = "1.4.7", features = ["git"] }
aphrody-agent-runtime = { path = "../aphrody-agent-runtime", version = "1.4.7", features = [] }
aphrody-config = { path = "../aphrody-config", version = "1.4.7", features = [] }
aphrody-diagnostics = { path = "../aphrody-diagnostics", version = "1.4.7" }
aphrody-toolcall = { path = "../aphrody-toolcall", version = "1.4.7", features = [] }
toml = { version = "1.1.5" }
aphrody-rag = { path = "../aphrody-rag", version = "1.4.7", features = [] }
aphrody-code-graph = { path = "../aphrody-code-graph", version = "1.4.7", features = [] }
aphrody-llama-server = { path = "../aphrody-llama-server", version = "1.4.7", features = [] }
aphrody-train = { path = "../aphrody-train", version = "1.4.7", features = [] }
