[package]
name = "media-core"
publish = false
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Shared media core: content-addressed assets, non-destructive edit stack, project/handoff format"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
blake3 = "1"
lightcraft-raster = { path = "../lightcraft-raster", version = "0.7.1" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
kamadak-exif = "0.6"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["rayon", "cargo_bench_support"] }
fast_image_resize = { version = "6", features = ["rayon"] }

[[bench]]
name = "resize_blur"
harness = false
