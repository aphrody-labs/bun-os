[package]
name = "wordcraft-layout"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-labs/bun-os"
description = "WordCraft layout: shaping, line breaking, tabs, lists, tables, pagination, headers/footers, hit testing"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
wordcraft-geom = { path = "../wordcraft-geom", version = "0.6.1" }
wordcraft-doc = { path = "../wordcraft-doc", version = "0.6.1" }
wordcraft-fonts = { path = "../wordcraft-fonts", version = "0.6.1" }
wordcraft-proof = { path = "../wordcraft-proof", version = "0.6.1" }
kurbo = { version = "0.13", features = ["serde"] }
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock (`SystemTime::now()`/`Instant::now()` panic on wasm32).
js-sys = "0.3"
