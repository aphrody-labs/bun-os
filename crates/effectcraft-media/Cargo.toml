[package]
name = "effectcraft-media"
description = "Footage import: probing, stills, image sequences, video and audio via FilmCraft's pure-Rust codecs, memory-budgeted frame cache"
version = "0.9.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
effectcraft-time = { path = "../effectcraft-time", version = "0.9.2" }
effectcraft-project = { path = "../effectcraft-project", version = "0.9.2" }
effectcraft-raster = { path = "../effectcraft-raster", version = "0.9.2" }
effectcraft-render = { path = "../effectcraft-render", version = "0.9.2" }
effectcraft-psd = { path = "../effectcraft-psd", version = "0.9.2" }
effectcraft-svg = { path = "../effectcraft-svg", version = "0.9.2" }
effectcraft-pdf = { path = "../effectcraft-pdf", version = "0.9.2" }
effectcraft-model = { path = "../effectcraft-model", version = "0.9.2" }
filmcraft-codecs = { path = "../filmcraft-codecs", version = "0.9.0" }
filmcraft-media = { path = "../filmcraft-media", version = "0.9.0" }
filmcraft-isobmff = { path = "../filmcraft-isobmff", version = "0.9.0" }
filmcraft-frame = { path = "../filmcraft-frame", version = "0.9.0" }
filmcraft-color = { path = "../filmcraft-color", version = "0.9.0" }
filmcraft-time = { path = "../filmcraft-time", version = "0.9.0" }
exr = "1.74"
gif = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp", "exr", "tga", "hdr"] }
rayon = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
log = "0.4"
