# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-rag-core"
version = "1.4.7"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/aphrody"
license = "Apache-2.0"
description            = "Pure, wasm32-safe core of the aphrody RAG layer: source-aware chunkers (Rust/JS-TS/Markdown/structural/prose), reciprocal-rank-fusion + MMR + vector helpers, and a bit-for-bit port of a TypeScript retrieval eval harness."

[features]
default = ["oxc"]
# The JS/TS chunker depends on the oxc parser toolchain, which is not verified
# to build for wasm32-unknown-unknown. Every other chunker (Rust/Markdown/
# structural/prose) and the fusion/eval modules are pure and wasm-safe with
# `--no-default-features`.
oxc = ["dep:oxc_allocator", "dep:oxc_ast", "dep:oxc_parser", "dep:oxc_span"]

[dependencies]
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
thiserror = "2.0.20"
blake3 = "1.8.7"
syn = { version = "3.0.5", features = ["full", "extra-traits"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
regex = { version = "1.11", features = [] }
ndarray = "0.17.2"
oxc_allocator = { version = "0.153.0", optional = true }
oxc_ast = { version = "0.153.0", optional = true }
oxc_parser = { version = "0.153.0", optional = true }
oxc_span = { version = "0.153.0", optional = true }

[dev-dependencies]
pretty_assertions = { version = "1", features = [] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[package.metadata.cargo-machete]
# `proc-macro2` is never named in a `use` here: it is declared only to force
# Cargo's feature unification to turn on `span-locations` for the copy `syn`
# itself depends on, which is what makes `syn::spanned::Spanned::span()`
# return real line/column data (`rust_chunker.rs`) instead of a dummy
# call-site span. Removing the dependency silently breaks line numbers
# without a compile error, so it stays explicit and machete-ignored.
ignored = ["proc-macro2"]
