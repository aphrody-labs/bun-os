[package]
name = "effectcraft-interchange"
description = "Premiere Pro interop through timeline interchange: Final Cut Pro 7 XML (xmeml), FCPXML, OpenTimelineIO and CMX 3600 EDL sequences to and from compositions (via filmcraft-interchange)"
version = "0.9.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
effectcraft-time = { path = "../effectcraft-time", version = "0.9.2" }
effectcraft-color = { path = "../effectcraft-color", version = "0.9.2" }
effectcraft-keyframe = { path = "../effectcraft-keyframe", version = "0.9.2" }
effectcraft-project = { path = "../effectcraft-project", version = "0.9.2" }
filmcraft-interchange = { path = "../filmcraft-interchange", version = "0.9.0" }
filmcraft-project = { path = "../filmcraft-project", version = "0.9.0" }
filmcraft-media = { path = "../filmcraft-media", version = "0.9.0" }
filmcraft-time = { path = "../filmcraft-time", version = "0.9.0" }
filmcraft-geom = { path = "../filmcraft-geom", version = "0.9.0" }
filmcraft-color = { path = "../filmcraft-color", version = "0.9.0" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
