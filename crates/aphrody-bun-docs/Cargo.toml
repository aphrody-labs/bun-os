[package]
name = "aphrody-bun-docs"
description = "Offline Bun documentation (docs/ of oven-sh/bun) and n2b Node-to-Bun equivalents as an Aphrody OS MCP subsystem."
version = "1.4.7"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/aphrody"
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[dependencies]
aphrody-proc = { path = "../aphrody-proc", version = "1.4.7", features = [] }
aphrody-n2b-registry = { version = "0.7.0", features = [] }
aphrody-subsystem = { path = "../aphrody-subsystem", version = "1.4.7" }
async-trait = "0.1.92"
serde_json = "1.0.151"

[dev-dependencies]
regex = { version = "1.11", features = [] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full"] }
