[package]
name = "filmcraft-golden"
description = "Golden-image tests for the CPU renderer/compositor and GPU-vs-CPU parity (test-only crate)"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"


# Test-only: the library is empty and everything is a dev-dependency, so the crate adds no edges
# to the layer graph. Goldens live in `goldens/` (see docs/testing.md §3).
[dependencies]

[dev-dependencies]
filmcraft-testkit = { path = "../filmcraft-testkit" }
filmcraft-color = { path = "../filmcraft-color" }
filmcraft-frame = { path = "../filmcraft-frame" }
filmcraft-time = { path = "../filmcraft-time" }
filmcraft-geom = { path = "../filmcraft-geom" }
filmcraft-media = { path = "../filmcraft-media" }
filmcraft-project = { path = "../filmcraft-project" }
filmcraft-render = { path = "../filmcraft-render" }
filmcraft-gpu = { path = "../filmcraft-gpu" }
pollster = "0.4"
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
