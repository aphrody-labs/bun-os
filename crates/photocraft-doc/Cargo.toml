[package]
name = "photocraft-doc"
version = "0.8.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The Photocraft document model: layers, groups, masks and adjustments as pure data, no rendering, no UI."
repository = "https://github.com/aphrody-labs/bun-os"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
photocraft-geom = { path = "../photocraft-geom", version = "0.8.2" }
photocraft-color = { path = "../photocraft-color", version = "0.8.2" }
photocraft-raster = { path = "../photocraft-raster", version = "0.8.2" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
