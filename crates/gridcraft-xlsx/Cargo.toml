[package]
name = "gridcraft-xlsx"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-labs/bun-os"
description = "GridCraft file formats: XLSX (SpreadsheetML) and CSV import/export"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[features]
# Builds password-encrypted workbooks in code for other crates' tests (a dev-dependency feature;
# never enabled in a shipped build).
test-support = []

[dependencies]
gridcraft-core = { path = "../gridcraft-core", version = "0.6.1" }
gridcraft-formula = { path = "../gridcraft-formula", version = "0.6.1" }
gridcraft-model = { path = "../gridcraft-model", version = "0.6.1" }
thiserror = "2"
quick-xml = "0.41"
zip = { workspace = true }
aes = { version = "0.9", default-features = false }
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
