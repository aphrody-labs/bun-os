[package]
name = "aphrody-yolo"
description = "Sovereign autonomous runtime core for Aphrody ecosystem."
version = "1.4.7"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/aphrody"

[lib]
name = "aphrody_yolo"
path = "src/lib.rs"

[dependencies]
aphrody-proc = { path = "../aphrody-proc", version = "1.4.7", features = [] }
yolo-core = { version = "1.0.0", features = ["repository-tools"] }
anyhow = "1.0.104"
aphrody-fsindex = { path = "../aphrody-fsindex", version = "1.4.7", features = [] }
aphrody-git = { package = "bun_git", path = "../bun-os-git", version = "1.4.7" }
aphrody-kernel-client = { path = "../aphrody-kernel-client", version = "1.4.7" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env", "color"] }
ignore = { version = "0.4", features = [] }
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full"] }
which = { version = "8", features = [] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
