[package]
workspace = "../.."
name = "aphrody-a2a"
publish = true
version.workspace = true
description = "A2A v1 protocol types and core definitions"
readme = "README.md"
edition.workspace       = true
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/bun-os/tree/main/crates/aphrody-a2a"
rust-version.workspace  = true
authors = ["aphrody-code"]
keywords = ["cli", "cross-platform", "rust", "wasm"]
categories = ["command-line-utilities", "development-tools", "web-programming"]

[lib]
name = "aphrody_a2a"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock"] }
base64 = { workspace = true, features = ["alloc"] }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde", "std"] }

# On wasm32 targets (browser or WASI), uuid v4/v7 require a JS entropy source.
# The `js` feature delegates to `getrandom/js` which uses `Math.random` / CSPRNG
# available in all browser environments and Node-on-wasm runtimes.
[target.'cfg(target_family = "wasm")'.dependencies]
uuid = { workspace = true, features = ["v7", "serde", "js", "std"] }
