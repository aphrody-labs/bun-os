# SPDX-License-Identifier: Apache-2.0
[package]
name = "yolo-runtime"
version = "1.4.7"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-code"]
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/aphrody"
description = "Bun OS build of the YOLO runtime ABI with the GPU provider"

[lib]
name = "yolo_runtime"
# The dynamic library is the single `aphrody_ffi` cdylib, which re-exports the yolo_* ABI.
crate-type = ["rlib"]

[features]
default = []
# Process-wide GPU hub (wgpu) shared with Tauri hosts in the same process.
gpu = ["dep:aphrody-gpu-backend", "aphrody-gpu-backend/hub", "dep:base64"]
# NVIDIA CUDA through the official driver, loaded at run time.
cuda = ["gpu", "aphrody-gpu-backend/cuda"]

[dependencies]
aphrody-gpu-backend = { path = "../aphrody-gpu-backend", version = "1.4.7", optional = true }
base64 = { version = "0.23.1", optional = true }
yolo-core = "1.0.0"
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.189" }
