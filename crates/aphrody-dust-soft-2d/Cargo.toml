[package]
description = "Nintendo DS software 2D rendering adapter."
license-file = "../../docs/licenses/iecode/licenses/dust/LICENSE"
name = "aphrody-dust-soft-2d"
version = "0.0.1"
edition = "2021"
publish = false
[features]
threaded = ["crossbeam-channel"]

[dependencies]
aphrody-dust-core = { path = "../aphrody-dust-core", version = "0.0.1" }
aphrody-dust-soft-2d-base = { path = "../aphrody-dust-soft-2d-base", version = "0.0.1" }
crossbeam-channel = { workspace = true, optional = true }
