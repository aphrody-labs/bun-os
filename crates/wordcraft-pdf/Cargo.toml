[package]
name = "wordcraft-pdf"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-labs/bun-os"
description = "WordCraft PDF export (krilla): embedded font subsets with selectable text, links, outline, tagging"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
wordcraft-doc = { path = "../wordcraft-doc", version = "0.6.1" }
wordcraft-geom = { path = "../wordcraft-geom", version = "0.6.1" }
wordcraft-fonts = { path = "../wordcraft-fonts", version = "0.6.1" }
wordcraft-layout = { path = "../wordcraft-layout", version = "0.6.1" }
craft-metafile = { path = "../craft-metafile", version = "0.6.1" }
krilla = { version = "0.8", features = ["pdf"] }
kurbo = { version = "0.13", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
thiserror = "2"
log = "0.4"

[dev-dependencies]
hayro-syntax = { package = "aphrody-hayro-syntax", path = "../../apps/pdfcraft/vendor/hayro-syntax", version = "0.7.2" }
hayro-interpret = { package = "aphrody-hayro-interpret", path = "../../apps/pdfcraft/vendor/hayro-interpret", version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock (`SystemTime::now()` panics on wasm32).
js-sys = "0.3"
