[package]
name = "designcraft-engine"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "DesignCraft engine: session, documents, history, selection, command registry, tool hosting"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
tempfile = "3"
craft-print = { workspace = true }
designcraft-images = { path = "../designcraft-images", version = "0.7.1" }
designcraft-geom = { path = "../designcraft-geom", version = "0.7.1" }
designcraft-color = { path = "../designcraft-color", version = "0.7.1" }
designcraft-doc = { path = "../designcraft-doc", version = "0.7.1" }
designcraft-fonts = { path = "../designcraft-fonts", version = "0.7.1" }
designcraft-compose = { path = "../designcraft-compose", version = "0.7.1" }
designcraft-render = { path = "../designcraft-render", version = "0.7.1" }
designcraft-textimport = { path = "../designcraft-textimport", version = "0.7.1" }
designcraft-pdf = { path = "../designcraft-pdf", version = "0.7.1" }
designcraft-tools = { path = "../designcraft-tools", version = "0.7.1" }
designcraft-idml = { path = "../designcraft-idml", version = "0.7.1" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = "2"
log = "0.4"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
quick-xml = "0.38"
caseless = "0.2"
zip = { workspace = true }

[dev-dependencies]
designcraft-fonts = { path = "../designcraft-fonts", features = ["testing"] }
hayro-syntax = "0.7.2"
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
kurbo = { version = "0.13", features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
