# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-remote-desktop"
version = "1.4.7"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/aphrody"
description = "Cross-platform remote-desktop server (JPEG over WebSocket, embedded browser viewer) for `aphrody infra remote serve`."

[lib]
name = "aphrody_remote_desktop"

[[bin]]
name = "aphrody-remote-desktop"
path = "src/bin/aphrody-remote-desktop.rs"
required-features = ["wayland"]

[features]
default = []
# Pure-Rust Wayland capture/input backend (wlr-screencopy, virtual pointer/keyboard).
wayland = ["dep:wayland-client", "dep:wayland-protocols-misc", "dep:wayland-protocols-wlr"]
# Android sessions: scrcpy H.264 passthrough to WebCodecs, aphrody-webos-protocol input (`/api/android/*`).
android = ["dep:aphrody-webos-protocol"]
# RFB server fed by the capture backend (`aphrody infra remote serve --vnc`).
vnc-server = ["dep:rustvncserver"]
# RFB client (`aphrody infra remote connect vnc://`, VNC computer-use backend).
vnc-client = ["dep:vnc-rs"]
vnc = ["vnc-server", "vnc-client"]

[dependencies]
anyhow = "1.0.104"
aphrody-capture = { path = "../aphrody-capture", version = "1.4.7", features = [] }
aphrody-webos-protocol = { path = "../aphrody-webos-protocol", version = "1.4.7", optional = true }
aphrody-secrets = { path = "../aphrody-secrets", version = "1.4.7", features = [] }
aphrody-wireguard = { path = "../aphrody-wireguard", version = "1.4.7", features = [] }
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1", "http2", "ws"] }
getrandom = "0.4"
ipnet = "2.12"
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
rustvncserver = { version = "2.2.1", default-features = false, optional = true }
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full"] }
vnc-rs = { version = "0.6", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false, features = ["xtest"] }
wayland-client = { version = "0.31", optional = true }
wayland-protocols-misc = { version = "0.3", features = ["client"], optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
