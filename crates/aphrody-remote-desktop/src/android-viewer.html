<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Android</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#ddd;font:14px system-ui,sans-serif;overflow:hidden}
#c{display:block;margin:auto;max-width:100vw;max-height:100vh;touch-action:none;outline:none}
#bar{position:fixed;left:8px;bottom:8px;opacity:.7;font-size:12px;pointer-events:none}
form{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:8px}
input{width:24em;padding:6px;background:#111;color:#eee;border:1px solid #444}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="bar"></div>
<script>
"use strict";
const canvas = document.getElementById("c"), bar = document.getElementById("bar");
const ctx = canvas.getContext("2d");
const KEY = "aphrody.android.token";
function token() {
  const h = new URLSearchParams(location.hash.slice(1)).get("token");
  if (h) { localStorage.setItem(KEY, h); history.replaceState(null, "", location.pathname); }
  return localStorage.getItem(KEY);
}
function ask() {
  const f = document.createElement("form");
  f.innerHTML = '<input type="password" placeholder="Session token" autocomplete="off"><button>Connect</button>';
  f.onsubmit = (e) => { e.preventDefault(); localStorage.setItem(KEY, f.querySelector("input").value.trim()); f.remove(); start(); };
  document.body.append(f);
}
let ws, decoder, codec, frames = 0, fps = 0, lastInput = 0, latency = 0, buttons = 0;
setInterval(() => { fps = frames; frames = 0; bar.textContent = `${canvas.width}x${canvas.height} ${fps} fps, input-to-frame ${latency} ms`; }, 1000);
const send = (m) => ws && ws.readyState === 1 && ws.send(JSON.stringify(m));
function configure(c) {
  if (decoder) try { decoder.close(); } catch {}
  codec = c;
  decoder = new VideoDecoder({
    output: (frame) => {
      if (canvas.width !== frame.displayWidth || canvas.height !== frame.displayHeight) { canvas.width = frame.displayWidth; canvas.height = frame.displayHeight; }
      ctx.drawImage(frame, 0, 0); frame.close(); frames++;
      if (lastInput) { latency = Math.round(performance.now() - lastInput); lastInput = 0; }
    },
    error: (e) => { bar.textContent = "decoder: " + e.message; },
  });
  decoder.configure({ codec: c, optimizeForLatency: true, hardwareAcceleration: "prefer-hardware" });
}
let pendingConfig = null;
function start() {
  const t = token();
  if (!t) return ask();
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}${location.pathname.replace(/\/$/, "")}/stream`, ["bearer." + t]);
  ws.binaryType = "arraybuffer";
  ws.onmessage = (ev) => {
    if (typeof ev.data === "string") {
      const m = JSON.parse(ev.data);
      if (m.t === "video" && m.codec && m.codec !== codec) configure(m.codec);
      else if (m.t === "clipboard" && m.text) navigator.clipboard?.writeText(m.text).catch(() => {});
      else if (m.t === "error") bar.textContent = m.message;
      return;
    }
    const b = new Uint8Array(ev.data), kind = b[0];
    const pts = Number(new DataView(ev.data).getBigUint64(1));
    const data = b.subarray(9);
    if (kind === 1) { pendingConfig = data.slice(); return; }
    if (!decoder || decoder.state !== "configured") return;
    let chunk = data;
    if (kind === 2 && pendingConfig) { chunk = new Uint8Array(pendingConfig.length + data.length); chunk.set(pendingConfig); chunk.set(data, pendingConfig.length); pendingConfig = null; }
    decoder.decode(new EncodedVideoChunk({ type: kind === 2 ? "key" : "delta", timestamp: pts, data: chunk }));
  };
  ws.onclose = (e) => { if (e.code === 1006 || e.code === 1000) setTimeout(start, 1500); };
}
function pos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * canvas.width, y: (e.clientY - r.top) / r.height * canvas.height };
}
function pointer(e) { lastInput = performance.now(); send({ t: "pointer", ...pos(e), buttons }); }
canvas.addEventListener("pointerdown", (e) => { canvas.focus(); canvas.setPointerCapture(e.pointerId); buttons |= e.button === 2 ? 2 : 1; pointer(e); });
canvas.addEventListener("pointermove", (e) => { if (buttons) pointer(e); });
canvas.addEventListener("pointerup", (e) => { buttons &= ~(e.button === 2 ? 2 : 1); pointer(e); });
canvas.addEventListener("contextmenu", (e) => e.preventDefault());
canvas.addEventListener("wheel", (e) => { e.preventDefault(); send({ t: "wheel", dx: e.deltaX, dy: e.deltaY }); }, { passive: false });
const key = (down) => (e) => { if (e.key === "v" && (e.ctrlKey || e.metaKey)) return; e.preventDefault(); lastInput = performance.now(); send({ t: "key", code: e.code, key: e.key, down }); };
canvas.addEventListener("keydown", key(true));
canvas.addEventListener("keyup", key(false));
document.addEventListener("paste", (e) => { const text = e.clipboardData?.getData("text/plain"); if (text) send({ t: "clipboard", text }); });
if (!("VideoDecoder" in window)) bar.textContent = "This browser has no WebCodecs VideoDecoder.";
start();
</script>
</body>
</html>
