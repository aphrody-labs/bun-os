[package]
name = "android-native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[[bin]]
# Kotlin binding generator (library mode): `uniffi-bindgen generate --library libandroid_native.so --language kotlin`.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi-cli"]

[features]
default = []
# Bun -> JVM: host-only JNI invocation API (creates a JVM from libjvm) behind a C ABI for bun:ffi.
invocation = ["jni/invocation"]
# Kotlin bindings generated by uniffi (consumed by apps/bun-android through JNA).
uniffi = ["dep:uniffi"]
uniffi-cli = ["uniffi", "uniffi/cli"]

[dependencies]
jni = { version = "0.22.4", default-features = false }
uniffi = { version = "0.32.2", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9.0", default-features = false }
android_logger = { version = "0.15.1", default-features = false }
log = "0.4.34"
