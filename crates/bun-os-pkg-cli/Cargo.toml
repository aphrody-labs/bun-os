[package]
name = "bun_pkg_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false
description = "Package store and remote metadata command interface"

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
bun_pkg_store = { workspace = true }
bun_pkg_core = { workspace = true }
bun_pkg_net = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
reqwest = { workspace = true, features = ["rustls-no-provider"] }
tokio = { workspace = true, features = ["fs", "io-util", "rt", "rt-multi-thread", "macros", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
rustls = { workspace = true, features = ["ring", "std"] }
rustls-native-certs = "0.8"
