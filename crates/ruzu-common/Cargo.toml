[package]
name = "common"
publish = false
version.workspace = true
edition = "2021"

[dependencies]
log = { workspace = true }
thiserror = { workspace = true }
bitflags.workspace = true
bytemuck.workspace = true
lz4_flex.workspace = true
zstd = { workspace = true }
libc = { workspace = true }
parking_lot.workspace = true
context.workspace = true
toml = { version = "0.9.8" }
fastrand.workspace = true
env_filter = { workspace = true }

[build-dependencies]
cc = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
# tests/build_script.rs compiles build.rs to exercise version detection.
cc = { workspace = true }

[target.'cfg(windows)'.dependencies]
winapi = { workspace = true, features = ["libloaderapi"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
