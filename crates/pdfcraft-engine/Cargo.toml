[package]
name = "pdfcraft-engine"
description = "PdfCraft engine façade: session, documents, command/tool catalogue"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

# `"*"` matches every non-workspace package: crates.io dependencies and the
# vendored crates under `vendor/` (excluded from the workspace). Our own crates
# keep full debug info. Dependencies keep only line tables, so backtraces still
# show file and line, but debug info for the whole dependency graph stays out of
# every test binary (each UI test binary had a 500-600 MB PDB on Windows, #454).

[dependencies]
pdfcraft-measure = { path = "../pdfcraft-measure", version = "0.7.1" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
pdfcraft-render = { path = "../pdfcraft-render", version = "0.7.1" }
pdfcraft-cos = { path = "../pdfcraft-cos", version = "0.7.1" }
pdfcraft-organize = { path = "../pdfcraft-organize", version = "0.7.1" }
pdfcraft-annot = { path = "../pdfcraft-annot", version = "0.7.1" }
pdfcraft-forms = { package = "aphrody-pdfcraft-forms", path = "../pdfcraft-forms", version = "0.7.1" }
pdfcraft-xfa = { path = "../pdfcraft-xfa", version = "0.7.1" }
pdfcraft-edit = { path = "../pdfcraft-edit", version = "0.7.1" }
pdfcraft-redact = { path = "../pdfcraft-redact", version = "0.7.1" }
pdfcraft-print = { path = "../pdfcraft-print", version = "0.7.1" }
pdfcraft-xfdf = { path = "../pdfcraft-xfdf", version = "0.7.1" }
pdfcraft-sign = { path = "../pdfcraft-sign", version = "0.7.1" }
pdfcraft-optimize = { path = "../pdfcraft-optimize", version = "0.7.1" }
pdfcraft-a11y = { path = "../pdfcraft-a11y", version = "0.7.1" }
pdfcraft-js = { path = "../pdfcraft-js", version = "0.7.1" }
pdfcraft-export = { path = "../pdfcraft-export", version = "0.7.1" }
pdfcraft-fonts = { path = "../pdfcraft-fonts", version = "0.7.1" }
pdfcraft-create = { path = "../pdfcraft-create", version = "0.7.1" }
pdfcraft-model = { path = "../pdfcraft-model", version = "0.7.1" }
pdfcraft-content = { path = "../pdfcraft-content", version = "0.7.1" }
ocrs = { version = "0.13.1", default-features = false, features = ["rten"] }
rten = { version = "0.26.0", default-features = false, features = ["rten_format"] }
thiserror = "2"
png = "0.18"
url = "2.5"
idna = "1.1"
icu_properties = "2.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Already in the graph through lopdf; used only for the local UTC offset ("today").
chrono = { version = "0.4", default-features = false, features = ["clock"] }
