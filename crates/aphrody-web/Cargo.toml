[package]
name = "aphrody-web"
version = "1.4.7"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-dev <contact@aphrody.com>"]
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/bun-os"
description = "Reusable Rust crawl and browser-rendering API for Aphrody Web."
readme = "README.md"

[dependencies]
bun_browser_crawl = { version = "1.4.7" }
bun_browser_net = { version = "1.4.7" }
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls-no-provider",
  "json",
  "http2",
] }
serde = { version = "1.0.228", features = ["derive"] }

[package.metadata.docs.rs]
all-features = true

