[package]
name = "aphrody-web"
version = "1.4.7"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-dev <contact@aphrody.com>"]
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/bun-os"
description = "Reusable Rust crawl and browser-rendering API for Aphrody Web."
readme = "README.md"

[dependencies]
obscura-crawl = { workspace = true }
obscura-net = { workspace = true }
reqwest = { workspace = true, features = ["rustls-no-provider", "json", "http2"] }
serde = { workspace = true }

[package.metadata.docs.rs]
all-features = true

