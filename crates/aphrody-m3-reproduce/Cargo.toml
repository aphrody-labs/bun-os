# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-m3-reproduce"
version = "1.4.7"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/aphrody"
license = "Apache-2.0"
description = "Reproduce a site in Material 3: seed colors, fonts, shapes and a component tree from a screenshot or a crawl, emitted as an @aphrody/m3 app scaffold."

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[features]
# Image-seeded themes (`sourceColorFromImage`-equivalent): PNG/JPEG capture bytes to a theme.
default = ["image"]
image   = ["aphrody-m3-tokens/image", "dep:image"]
# HTML-heuristic extraction (colors, fonts, radii, layout landmarks) — no network required, takes
# an already-fetched HTML string. Light: `regex` only, no DOM/CSS engine.
crawl   = ["dep:regex"]
# Fetches a URL's HTML over the network before crawling it.
network = ["crawl", "dep:reqwest"]
# The `cli_main` entry point (`aphrody m3-reproduce`).
cli     = ["image", "crawl", "network", "dep:clap"]

[dependencies]
aphrody-m3-tokens = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
regex = { version = "1.11", features = [], optional = true }
reqwest = { version = "0.13.5", features = ["rustls-no-provider", "json", "stream", "form", "query", "charset", "http2", "system-proxy", "blocking", "cookies", "gzip", "brotli", "deflate", "socks", "multipart"], default-features = false, optional = true }
clap = { version = "4.6.6", features = ["derive", "env", "color"], optional = true }
image = { workspace = true, optional = true }

[dev-dependencies]
