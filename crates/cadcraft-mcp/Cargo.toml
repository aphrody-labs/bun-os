[package]
name = "cadcraft-mcp"
description = "CADCraft MCP server: JSON-RPC 2.0 over stdio, driving a running app or a headless session"
workspace = "../.."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-labs/bun-os/tree/main/crates/cadcraft-mcp"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
cadcraft-engine = { workspace = true }
cadcraft-render = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
log = { workspace = true }
