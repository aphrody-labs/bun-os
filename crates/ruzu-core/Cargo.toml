[package]
name = "core"
publish = false
version.workspace = true
edition = "2021"

# Faithful port of the zuyu core: the deny-by-default correctness lints flag its upstream
# control flow (single-iteration range scans, raw-pointer service APIs) and stay warnings here,
# as in the workspace lint policy.
[lints.clippy]
correctness = { level = "warn", priority = -1 }

[features]
default = ["openssl"]
# The OpenSSL backend of the ssl service; without it the service reports upstream's
# "no SSL backend" error (ssl_backend_none), which hosts without OpenSSL use.
openssl = ["dep:openssl"]
debug-logs = []
step_tracer = []

[dependencies]
common = { path = "../ruzu-common", version = "1.4.7" }
hid_core = { path = "../ruzu-hid-core", version = "1.4.7" }
network = { path = "../ruzu-network", version = "1.4.7" }
aes.workspace = true
bitflags.workspace = true
cipher.workspace = true
ctr.workspace = true
hmac.workspace = true
hex.workspace = true
flate2 = { workspace = true }
image = { workspace = true, features = ["png", "jpeg"] }
libc = { workspace = true }
log = { workspace = true }
lz4_flex.workspace = true
rdynarmic = { workspace = true }
memmap2.workspace = true
parking_lot.workspace = true
thiserror = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
sha1 = { workspace = true }
sha2 = { version = "0.10" }
md-5.workspace = true

[target.'cfg(not(target_os = "openbsd"))'.dependencies]
openssl = { workspace = true, optional = true }

[target.'cfg(target_os = "openbsd")'.dependencies]
# OpenBSD 7.9 ships LibreSSL 4.3, newer than openssl-sys currently accepts.
openssl = { workspace = true, features = ["vendored"], optional = true }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "ifdef",
    "inaddr",
    "iphlpapi",
    "ipifcons",
    "iptypes",
    "libloaderapi",
    "memoryapi",
    "netioapi",
    "winerror",
    "winnt",
    "winsock2",
    "ws2def",
] }
