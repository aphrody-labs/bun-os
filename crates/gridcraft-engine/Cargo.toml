[package]
name = "gridcraft-engine"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "GridCraft engine: sessions, commands, history, clipboard, fill, sort, filter"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
gridcraft-core = { path = "../gridcraft-core", version = "0.6.1" }
gridcraft-numfmt = { path = "../gridcraft-numfmt", version = "0.6.1" }
gridcraft-formula = { path = "../gridcraft-formula", version = "0.6.1" }
gridcraft-functions = { path = "../gridcraft-functions", version = "0.6.1" }
gridcraft-model = { path = "../gridcraft-model", version = "0.6.1" }
gridcraft-calc = { path = "../gridcraft-calc", version = "0.6.1" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
log = "0.4"
gridcraft-xlsx = { path = "../gridcraft-xlsx", version = "0.6.1" }
gridcraft-chart = { path = "../gridcraft-chart", version = "0.6.1" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
gridcraft-xlsx = { path = "../gridcraft-xlsx", features = ["test-support"] }
zip = { workspace = true }
