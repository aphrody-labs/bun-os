[package]
name = "bunos-utils"
description = "Bun OS multicall system utilities: uutils coreutils, findutils, diffutils, procps and util-linux, plus binutils on object/gimli."
version.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "bunos-utils"
path = "src/main.rs"

[features]
default = ["binutils", "procps", "diffutils"]
binutils = ["dep:object", "dep:addr2line", "dep:rustc-demangle", "dep:ar"]
# uutils procps on Linux; `sysinfo` applets (ps, free, pidof, pgrep, pkill) elsewhere.
procps = ["dep:sysinfo", "dep:uucore_procps", "dep:uu_free", "dep:uu_hugetop", "dep:uu_pgrep", "dep:uu_pidof", "dep:uu_pidwait", "dep:uu_pkill", "dep:uu_pmap", "dep:uu_ps", "dep:uu_pwdx", "dep:uu_skill", "dep:uu_slabtop", "dep:uu_snice", "dep:uu_sysctl", "dep:uu_tload", "dep:uu_top", "dep:uu_vmstat", "dep:uu_w", "dep:uu_watch"]
util-linux = ["dep:uucore_util_linux", "dep:uu_blockdev", "dep:uu_cal", "dep:uu_chcpu", "dep:uu_ctrlaltdel", "dep:uu_dmesg", "dep:uu_fsfreeze", "dep:uu_hexdump", "dep:uu_lscpu", "dep:uu_lsipc", "dep:uu_lslocks", "dep:uu_lsmem", "dep:uu_lsns", "dep:uu_mcookie", "dep:uu_mesg", "dep:uu_mountpoint", "dep:uu_nologin", "dep:uu_rename", "dep:uu_renice", "dep:uu_rev", "dep:uu_setpgid", "dep:uu_setsid", "dep:uu_uuidgen"]
diffutils = ["dep:diffutilslib"]
findutils = ["dep:findutils"]
# vendor/uutils/coreutils: aphrody-labs/uutils-coreutils branch `aphrody`.
coreutils = ["dep:uucore", "dep:uu_arch", "dep:uu_b2sum", "dep:uu_base32", "dep:uu_base64", "dep:uu_basename", "dep:uu_basenc", "dep:uu_cat", "dep:uu_cksum", "dep:uu_comm", "dep:uu_cp", "dep:uu_csplit", "dep:uu_cut", "dep:uu_date", "dep:uu_dd", "dep:uu_df", "dep:uu_dir", "dep:uu_dircolors", "dep:uu_dirname", "dep:uu_du", "dep:uu_echo", "dep:uu_env", "dep:uu_expand", "dep:uu_expr", "dep:uu_factor", "dep:uu_false", "dep:uu_fmt", "dep:uu_fold", "dep:uu_head", "dep:uu_hostname", "dep:uu_join", "dep:uu_link", "dep:uu_ln", "dep:uu_ls", "dep:uu_md5sum", "dep:uu_mkdir", "dep:uu_mktemp", "dep:uu_more", "dep:uu_mv", "dep:uu_nl", "dep:uu_nproc", "dep:uu_numfmt", "dep:uu_od", "dep:uu_paste", "dep:uu_pr", "dep:uu_printenv", "dep:uu_printf", "dep:uu_ptx", "dep:uu_pwd", "dep:uu_readlink", "dep:uu_realpath", "dep:uu_rm", "dep:uu_rmdir", "dep:uu_seq", "dep:uu_sha1sum", "dep:uu_sha224sum", "dep:uu_sha256sum", "dep:uu_sha384sum", "dep:uu_sha512sum", "dep:uu_shred", "dep:uu_shuf", "dep:uu_sleep", "dep:uu_sort", "dep:uu_split", "dep:uu_sum", "dep:uu_tac", "dep:uu_tail", "dep:uu_tee", "dep:uu_test", "dep:uu_touch", "dep:uu_tr", "dep:uu_true", "dep:uu_truncate", "dep:uu_tsort", "dep:uu_uname", "dep:uu_unexpand", "dep:uu_uniq", "dep:uu_unlink", "dep:uu_vdir", "dep:uu_wc", "dep:uu_whoami", "dep:uu_yes", "dep:uu_chgrp", "dep:uu_chmod", "dep:uu_chown", "dep:uu_chroot", "dep:uu_groups", "dep:uu_hostid", "dep:uu_id", "dep:uu_install", "dep:uu_kill", "dep:uu_logname", "dep:uu_mkfifo", "dep:uu_mknod", "dep:uu_nice", "dep:uu_nohup", "dep:uu_pathchk", "dep:uu_pinky", "dep:uu_stat", "dep:uu_stty", "dep:uu_sync", "dep:uu_timeout", "dep:uu_tty", "dep:uu_uptime", "dep:uu_users", "dep:uu_who"]

[dependencies]
