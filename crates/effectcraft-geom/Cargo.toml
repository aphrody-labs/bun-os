[package]
name = "effectcraft-geom"
version = "0.9.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Geometry for EffectCraft: 2D/3D vectors, 3x3 and 4x4 matrices, rectangles and the layer-transform composition used by the compositor."
repository = "https://github.com/aphrody-labs/bun-os"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }

[dev-dependencies]
proptest = "1"
