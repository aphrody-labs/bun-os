[package]
name = "audio_core"
publish = false
version.workspace = true
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
pkg-config = { workspace = true }

[dependencies]
common = { path = "../ruzu-common", version = "1.4.7" }
ruzu_core = { package = "core", path = "../ruzu-core", version = "1.4.7" }
cubeb.workspace = true
log = { workspace = true }
parking_lot.workspace = true
sdl3.workspace = true

[target.'cfg(windows)'.dependencies]
winapi = { workspace = true, features = ["combaseapi", "objbase"] }

# cubeb-sys 0.34 asks Cargo to link the optional Rust PulseAudio archive on
# FreeBSD and NetBSD, although its nested CMake build does not place that
# archive in the target-specific directory expected by build.rs. Keep the
# portable C backends workaround limited to the affected targets.
[target.'cfg(any(target_os = "freebsd", target_os = "netbsd"))'.dependencies]
cubeb-sys = { workspace = true, features = ["unittest-build"] }
