[package]
name = "pdfcraft-render"
description = "Page rendering (bootstrap: hayro) and document inspection for PdfCraft"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-labs/bun-os"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

# `"*"` matches every non-workspace package: crates.io dependencies and the
# vendored crates under `vendor/` (excluded from the workspace). Our own crates
# keep full debug info. Dependencies keep only line tables, so backtraces still
# show file and line, but debug info for the whole dependency graph stays out of
# every test binary (each UI test binary had a 500-600 MB PDB on Windows, #454).

[dependencies]
pdfcraft-cos = { path = "../pdfcraft-cos", version = "0.7.1" }
pdfcraft-fonts = { path = "../pdfcraft-fonts", version = "0.7.1" }
hayro = { package = "aphrody-hayro", path = "../../apps/pdfcraft/vendor/hayro", version = "0.7.1" }
hayro-syntax = { package = "aphrody-hayro-syntax", path = "../../apps/pdfcraft/vendor/hayro-syntax", version = "0.7.2" }
lopdf = { package = "aphrody-lopdf", path = "../../apps/pdfcraft/vendor/lopdf", version = "0.45.0" }
kurbo = "0.13"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive", "rc"] }
bytemuck = "1"

[dev-dependencies]
skrifa = "0.44"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
