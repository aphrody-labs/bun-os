[package]
name = "aphrody-webos-wasm"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license                = "Apache-2.0"
license-file           = "../../LICENSE-APACHE"
description            = "wasm-bindgen surface of the Aphrody WebOS apps: OPFS-backed VFS, binary triage, patch apply, document search and language detection over existing crates, and the terminal."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aphrody-google    = { workspace = true }
aphrody-patch     = { workspace = true }
aphrody-rag-core  = { workspace = true }
aphrody-re        = { workspace = true }
aphrody-shell-vfs = { workspace = true }
aphrody-shell-web = { workspace = true }
serde_json        = { workspace = true }
wasm-bindgen      = { workspace = true }

[lints]
workspace = true
