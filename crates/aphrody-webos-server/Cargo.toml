# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-webos-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license = "Apache-2.0"
description = "aphrody.com server (ADR-003): one axum binary serving the Rust wasm client, health, and the session, stream, repository and inventory routes, behind nginx."
publish = false

[[bin]]
name = "aphrody-webos"
path = "src/main.rs"

[dependencies]
aphrody-inventory = { workspace = true, features = ["server"] }
aphrody-webos-protocol = { path = "../aphrody-webos-protocol" }
bun-ui-web = { path = "../bun-ui-web", features = ["server"] }
axum = { workspace = true, features = ["json", "query", "tokio", "http1"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "fs", "time"] }
tower-http = { workspace = true, features = ["fs", "compression-br", "compression-gzip", "set-header"] }

[lints]
workspace = true
