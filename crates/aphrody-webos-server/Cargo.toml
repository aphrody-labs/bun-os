# SPDX-License-Identifier: Apache-2.0
[package]
name = "webos-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
description = "Bun OS full-stack server: serves the Web OS static site, the API routes and the browser backend over one native HTTP listener (axum), behind nginx."
publish = false

[[bin]]
name = "webos-server"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["json", "query", "tokio", "http1"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tower-http = { workspace = true, features = ["fs", "cors", "compression-gzip", "set-header"] }
serde_json = { workspace = true }

[lints]
workspace = true
