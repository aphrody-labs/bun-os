[package]
name = "effectcraft-export"
description = "Render Queue jobs and output modules: H.264 MP4 (+AAC), ProRes and uncompressed MOV (+PCM) via FilmCraft, HEVC / AV1 MP4 (+AAC) and WebM (VP9 or AV1 + Opus) via EffectCraft encoders, PNG/JPEG/TIFF/EXR sequences, animated GIF, WAV/AIFF"
version = "0.9.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
effectcraft-time = { path = "../effectcraft-time", version = "0.9.2" }
effectcraft-project = { path = "../effectcraft-project", version = "0.9.2" }
effectcraft-raster = { path = "../effectcraft-raster", version = "0.9.2" }
effectcraft-render = { path = "../effectcraft-render", version = "0.9.2" }
filmcraft-h264enc = { path = "../filmcraft-h264enc", version = "0.9.0" }
filmcraft-prores = { path = "../filmcraft-prores", version = "0.9.0" }
filmcraft-aac = { path = "../filmcraft-aac", version = "0.9.0" }
filmcraft-isobmff = { path = "../filmcraft-isobmff", version = "0.9.0" }
effectcraft-opusenc = { path = "../effectcraft-opusenc", version = "0.9.2" }
effectcraft-vp9enc = { path = "../effectcraft-vp9enc", version = "0.9.2" }
effectcraft-hevcenc = { path = "../effectcraft-hevcenc", version = "0.9.2" }
effectcraft-av1enc = { path = "../effectcraft-av1enc", version = "0.9.2" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "exr"] }
gif = "0.14"
rayon = "1"
web-time = "1"
thiserror = "2"
log = "0.4"

[dev-dependencies]
effectcraft-media = { path = "../effectcraft-media" }
effectcraft-effects = { path = "../effectcraft-effects" }
effectcraft-color = { path = "../effectcraft-color" }
filmcraft-opus = { path = "../filmcraft-opus" }
filmcraft-vp9 = { path = "../filmcraft-vp9" }
effectcraft-keyframe = { path = "../effectcraft-keyframe" }
