[package]
name = "designcraft-pdf"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "DesignCraft PDF export (krilla): real text with embedded font subsets, CMYK/spot colour, bleed and printer's marks"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
designcraft-geom = { path = "../designcraft-geom", version = "0.7.1" }
designcraft-color = { path = "../designcraft-color", version = "0.7.1" }
designcraft-doc = { path = "../designcraft-doc", version = "0.7.1" }
designcraft-fonts = { path = "../designcraft-fonts", version = "0.7.1" }
designcraft-compose = { path = "../designcraft-compose", version = "0.7.1" }
krilla = { version = "0.8", features = ["pdf"] }
# The hayro-syntax krilla parses placed PDFs with (its `pdf::Pdf::version()` type), not the aphrody fork.
krilla-hayro-syntax = { package = "hayro-syntax", version = "0.7.2" }
krilla-svg = "0.8"
designcraft-images = { path = "../designcraft-images", version = "0.7.1" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
thiserror = "2"
log = "0.4"
hayro-syntax = { package = "aphrody-hayro-syntax", path = "../../apps/pdfcraft/vendor/hayro-syntax", version = "0.7.2" }

[dev-dependencies]
hayro-interpret = { package = "aphrody-hayro-interpret", path = "../../apps/pdfcraft/vendor/hayro-interpret", version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
kurbo = { version = "0.13", features = ["serde"] }
tiff = "0.11"
designcraft-fonts = { path = "../designcraft-fonts", features = ["testing"] }
