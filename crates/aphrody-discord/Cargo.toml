# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-discord"
version = "1.4.7"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/aphrody"
description = "Native Aphrody Discord engine: Ed25519 interaction verification, REST client, AI answer embeds, Web extraction and timed shell receipts."

[dependencies]
aphrody-proc = { path = "../aphrody-proc", version = "1.4.7", features = ["tokio"] }
anyhow = "1.0.104"
aphrody-web-extract = { package = "bun_browser_extract", version = "1.4.7", optional = true }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env", "color"], optional = true }
hex = { version = "0.4", features = [] }
reqwest = { version = "0.13.5", features = ["rustls-no-provider", "json", "stream", "form", "query", "charset", "http2", "system-proxy", "blocking", "cookies", "gzip", "brotli", "deflate", "socks", "multipart"], default-features = false }
ring = "0.17"
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = ["cli", "web-extract"]
cli = ["dep:clap"]
web-extract = ["dep:aphrody-web-extract"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
