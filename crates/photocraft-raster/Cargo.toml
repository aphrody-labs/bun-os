[package]
name = "photocraft-raster"
version = "0.8.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Photocraft sparse, copy-on-write tiled surfaces in any pixel format."
repository = "https://github.com/aphrody-labs/bun-os"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
photocraft-geom = { path = "../photocraft-geom", version = "0.8.2" }
photocraft-color = { path = "../photocraft-color", version = "0.8.2" }
serde = { version = "1", features = ["derive", "rc"] }

[dev-dependencies]
proptest = "1"
