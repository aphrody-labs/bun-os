<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Aphrody Bun OS</title>
    <meta name="description" content="Pop!_OS with COSMIC, Redox OS, Android, Wine and Proton in your browser, streamed from Bun OS." />
    <link rel="canonical" href="https://aphrody.com/" />
    <link rel="modulepreload" href="/aphrody_webos_client.js" />
    <style>
      /* COSMIC dark palette (cosmic-theme default dark). */
      :root { --bg: #1b1b1b; --surface: #272727; --surface-2: #2f2f2f; --on: #e4e4e4; --muted: #a8a8a8; --accent: #63d0df; --radius: 16px; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--on); font: 16px/1.5 "Open Sans", "Fira Sans", system-ui, sans-serif; }
      #app { min-height: 100%; display: grid; place-content: center; gap: 20px; padding: 32px; box-sizing: border-box; }
      h1 { margin: 0; font-size: clamp(28px, 5vw, 44px); }
      .lead, .status { margin: 0; color: var(--muted); max-width: 60ch; }
      .os-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); max-width: 1000px; }
      .os { width: 100%; height: 100%; display: grid; gap: 6px; text-align: left; padding: 18px; border: 0; border-radius: var(--radius); background: var(--surface); color: var(--on); font: inherit; cursor: pointer; }
      .os:hover:not([disabled]), .os:focus-visible { background: var(--surface-2); outline: 2px solid var(--accent); }
      .os[disabled] { cursor: default; opacity: 0.7; }
      .os span { color: var(--muted); font-size: 14px; }
      .os em { color: var(--muted); font-size: 12px; font-style: normal; }
      #app:has(.stream) { display: block; padding: 0; }
      .stream { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; background: #000; outline: none; touch-action: none; }
    </style>
  </head>
  <body>
    <main id="app"><p class="status">Loading Bun OS...</p></main>
    <script type="module" src="/boot.js"></script>
  </body>
</html>
