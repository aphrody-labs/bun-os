# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-webos-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license = "Apache-2.0"
description = "aphrody.com client (ADR-003): an iced application themed with libcosmic, built for wasm32 with the wgpu backend and natively for the in-session tools: OS picker, session stream, input and gamepad."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aphrody-webos-protocol = { path = "../aphrody-webos-protocol" }
# Our pinned libcosmic fork (aphrody-labs/libcosmic, its iced submodule is our iced fork).
libcosmic = { git = "https://github.com/aphrody-labs/libcosmic", rev = "8fee30aa5079b0aed9318091c99c271c4b587803", default-features = false, features = ["winit", "wgpu"] }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# JPEG/PNG frames of the WebSocket fallback, decoded in Rust until the WebCodecs video widget lands.
image = { workspace = true, features = ["jpeg", "png"] }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true, features = ["std"] }
wasm-bindgen-futures = { workspace = true }
# Transport only (fetch, WebSocket, Gamepad API); no DOM UI is built by hand.
web-sys = { workspace = true, features = [
  "std",
  "BinaryType",
  "Blob",
  "Clipboard",
  "ImageData",
  "OffscreenCanvas",
  "OffscreenCanvasRenderingContext2d",
  "console",
  "Gamepad",
  "GamepadButton",
  "Headers",
  "Location",
  "MessageEvent",
  "Navigator",
  "Request",
  "RequestInit",
  "Response",
  "WebSocket",
  "Window",
] }

[lints]
workspace = true
