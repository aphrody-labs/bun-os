[package]
name = "photocraft-io"
description = "Import/export between photocraft documents and PSD/PSB and flat raster formats"
version = "0.8.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []
# HEIC/HEIF decode (forwarded to photocraft-codecs; see its `heif` feature).
heif = ["photocraft-codecs/heif"]

[dependencies]
craft-docpath = { package = "filmcraft-docpath", path = "../craft-docpath", version = "0.1.0" }
photocraft-geom = { path = "../photocraft-geom", version = "0.8.2" }
photocraft-color = { path = "../photocraft-color", version = "0.8.2" }
photocraft-cms = { path = "../photocraft-cms", version = "0.8.2" }
photocraft-raster = { path = "../photocraft-raster", version = "0.8.2" }
photocraft-doc = { path = "../photocraft-doc", version = "0.8.2" }
photocraft-compose = { path = "../photocraft-compose", version = "0.8.2" }
photocraft-algo = { path = "../photocraft-algo", version = "0.8.2" }
photocraft-psd = { path = "../photocraft-psd", version = "0.8.2" }
photocraft-codecs = { path = "../photocraft-codecs", version = "0.8.2" }
photocraft-raw = { path = "../photocraft-raw", version = "0.8.2" }
photocraft-affinity = { path = "../photocraft-affinity", version = "0.8.2" }
photocraft-text = { path = "../photocraft-text", version = "0.8.2" }
photocraft-paint = { path = "../photocraft-paint", version = "0.8.2" }
photocraft-vector = { path = "../photocraft-vector", version = "0.8.2" }
photocraft-format = { path = "../photocraft-format", version = "0.8.2" }
thiserror = "2"
serde_json = "1"
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
roxmltree = "0.20"

[dev-dependencies]
crc32fast = "1.5"
photocraft-affinity = { path = "../photocraft-affinity", features = ["synth"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
photocraft-psd = { path = "../photocraft-psd", features = ["testgen"] }
photocraft-raw = { path = "../photocraft-raw", features = ["testgen"] }
proptest = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "raster-images"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
resvg = { version = "0.45", default-features = false, features = ["text", "raster-images"] }
