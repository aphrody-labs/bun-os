# SPDX-License-Identifier: Apache-2.0
# Standalone (excluded from the root workspace): it links nu-plugin from the pinned nushell fork,
# whose dependency graph must match the `nu` binary we ship, so it keeps its own Cargo.lock.
[package]
name = "nu_plugin_windows"
version = "1.4.7"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["aphrody-dev <contact@aphrody.com>"]
repository = "https://github.com/aphrody-labs/bun-os"
description = "Windows API access for nushell (plugin) and bash-compatible shells (win CLI): registry, services, processes, scheduled tasks, event log, WMI/CIM, COM automation and the Explorer Shell namespace, with structured output. Generated from the WinClean catalog."
publish = false

[workspace]

[[bin]]
name = "nu_plugin_windows"
path = "src/main.rs"

[[bin]]
name = "win"
path = "src/bin/win.rs"

[dependencies]
bun-windows-winclean = { path = "../../packages/bun-windows-winclean", version = "1.4.7" }
nu-plugin = { path = "../../vendor/nushell/crates/nu-plugin", version = "0.116.2" }
nu-protocol = { path = "../../vendor/nushell/crates/nu-protocol", version = "0.116.2", features = ["plugin"] }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
