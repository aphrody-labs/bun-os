[package]
name = "cadcraft-io"
description = "CADCraft file formats: DXF read/write mapping, SVG, PNG and PDF export"
workspace = "../.."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-labs/bun-os/tree/main/crates/cadcraft-io"

[lints]
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
cadcraft-geom = { workspace = true }
cadcraft-color = { workspace = true }
cadcraft-doc = { workspace = true }
cadcraft-dxf = { workspace = true }
cadcraft-dwg = { workspace = true }
cadcraft-render = { workspace = true }
cadcraft-fonts = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
serde = { workspace = true }
miniz_oxide = { workspace = true }
quick-xml = { workspace = true }
