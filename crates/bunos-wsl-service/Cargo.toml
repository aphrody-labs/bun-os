# SPDX-License-Identifier: Apache-2.0
# Bun OS on WSL as a Windows service: owns the lifecycle of the `bunos` WSL 2 instance from the Service Control Manager
# (boot start, no logon, no idle shutdown, recovery, event log) and mirrors chosen systemd units as Windows services.
# Its own workspace (Windows-only, like crates/bunos-nt-client); see docs/WSL-SERVICE.md.
[workspace]

[package]
name = "bunos-wsl-service"
version = "1.4.7"
edition = "2024"
license = "Apache-2.0"
authors = ["aphrody-dev <contact@aphrody.com>"]
repository = "https://github.com/aphrody-labs/bun-os"
description = "Runs the Bun OS WSL 2 instance as the BunOSWsl Windows service and exposes its systemd units as Windows services."
publish = false

[[bin]]
name = "bunos-wsl-service"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_Storage_FileSystem",
  "Win32_System_Environment",
  "Win32_System_EventLog",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_UI_Shell",
] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
