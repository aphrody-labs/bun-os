name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm and crates.io (otherwise dry-run)
        type: boolean
        default: false
      crate-limit:
        description: Maximum crates to publish in this run (crates.io rate limits new crates; a 429 waits for the time it names)
        type: string
        default: "5"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          rust: "true"
      - run: bun scripts/release.ts verify

  binaries:
    name: Binaries ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          rust: "true"
      - name: Build
        shell: bash
        run: |
          mkdir -p dist/bin
          bun scripts/cargo-nie.ts --install dist/bin
          bun scripts/cargo.ts exec -- build --release --locked -p bun-re --features pipeline --bin bunre
          bun scripts/cargo.ts exec -- build --release --locked -p bun-steam --features depot --bin bun-steam-depot
          cp target/release/bunre* target/release/bun-steam-depot* dist/bin/
      - name: Archive
        shell: bash
        run: |
          tar -C dist -czf "bun-os-${{ matrix.target }}.tar.gz" bin
          sha256sum "bun-os-${{ matrix.target }}.tar.gz" > "bun-os-${{ matrix.target }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: bun-os-${{ matrix.target }}
          path: bun-os-${{ matrix.target }}.tar.gz*

  npm:
    name: npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Publish the unpublished packages
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          APPLY: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.publish) && '--apply' || '' }}
        run: bun scripts/release.ts npm $APPLY

  crates:
    name: crates.io
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      published: ${{ steps.publish.outputs.published }}
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Require the crates.io token
        if: env.CARGO_REGISTRY_TOKEN == '' && (startsWith(github.ref, 'refs/tags/') || inputs.publish)
        run: echo "::error::CARGO_REGISTRY_TOKEN is not set on this repository"; exit 1
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          rust: "true"
      - name: Publish the unpublished crates in dependency order
        id: publish
        env:
          APPLY: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.publish) && '--apply' || '' }}
        run: |
          set +e
          bun scripts/release.ts crates $APPLY --limit "${{ inputs.crate-limit || '5' }}" --pause 0 --budget 290 2>&1 | tee crates.log
          code=${PIPESTATUS[0]}
          echo "published=$(grep -oE '^crates.io: [0-9]+ published' crates.log | tail -1 | grep -oE '[0-9]+')" >> "$GITHUB_OUTPUT"
          exit $code

  continue:
    name: Continue publishing
    if: always() && inputs.publish && needs.crates.outputs.published != '' && needs.crates.outputs.published != '0'
    needs: crates
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # crates.io admits one new crate per ten minutes after a burst, so a run publishes a bounded batch and the
      # next one picks up the rest; it stops by itself when a run publishes nothing.
      - name: Dispatch the next batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}" -f publish=true -f crate-limit="${{ inputs.crate-limit }}"

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [binaries, npm, crates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
