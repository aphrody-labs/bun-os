name: CI

on:
  push:
    branches: [os]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Bun quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Type check
        run: bun run check
      - name: Lint
        if: ${{ !cancelled() }}
        run: bun run lint
      - name: Format
        if: ${{ !cancelled() }}
        run: bun run format:check
      - name: Documentation links and navigation
        if: ${{ !cancelled() }}
        run: bun run docs:check
      - name: Workspace manifests
        if: ${{ !cancelled() }}
        run: bun scripts/workspace-manifests.ts

  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          rust: "true"
      - name: Format
        run: bun scripts/cargo-fmt.ts
      - name: Check every workspace member
        run: bun scripts/cargo.ts check
      - name: Clippy
        run: bun scripts/cargo.ts exec -- clippy --workspace --all-targets --locked -- -D warnings

  release-plan:
    name: Release plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          rust: "true"
      - name: Every unpublished npm package and crate
        run: bun scripts/release.ts plan
      - name: Dry-run publication of the npm packages that are not out yet
        run: bun scripts/release.ts npm
