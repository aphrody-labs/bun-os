name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Manual runs get their own group: a push from another agent must not cancel a run someone started on purpose.
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Affected areas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      js: ${{ steps.areas.outputs.js }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github
            packages/bun-workspace
            packages/buncc
            packages/bun-os-plugins
      - uses: ./.github/actions/setup-bun
      - id: areas
        env:
          # Pull requests: git diff <base>...HEAD classified by path (packages/bun-workspace/src/git-affected.ts). Pushes run everything:
          # concurrency cancels superseded runs, so a push-to-push diff would silently skip the areas an earlier, cancelled run never checked.
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            bun packages/bun-workspace/src/git-cli.ts affected --base "$BASE" --github-output
          else
            for area in all js rust docs distro; do echo "$area=true" >> "$GITHUB_OUTPUT"; done
          fi
  quality:
    name: Bun quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Blobless + bootstrap cone: the setup-workspace action expands to the profile (docs/MONOREPO-SCALE.md).
          filter: blob:none
          sparse-checkout: |
            .github
            packages/bun-workspace
            packages/buncc
            packages/bun-os-plugins
      - id: setup
        uses: ./.github/actions/setup-workspace
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          profile: ci
      - name: Type check
        run: bun run check
      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run lint
      - name: Format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run format:check
      - name: Documentation links and navigation
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run docs:check
      - name: Workspace manifests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun scripts/workspace-manifests.ts
      - name: Buncc unit tests and toolchain report
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          bun test packages/buncc
          bun packages/buncc/src/cli.ts doctor || true
      - name: Repository consistency (component manifest, pins, architecture map)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun packages/buncc/src/cli.ts doctor --repo

  rust:
    name: Rust ${{ matrix.os }}
    needs: plan
    if: ${{ needs.plan.outputs.rust == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      # buncc's cargo runs stop after 30 minutes by default; whole-workspace check and clippy on the runners take longer.
      BUNCC_CARGO_DEADLINE_MS: "7200000"
    # Windows stays advisory until a green run on windows-latest is recorded (the fork-only MSVC wrapper calls are removed).
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # Blobless + bootstrap cone: the setup-workspace action expands to the profile (docs/MONOREPO-SCALE.md).
          filter: blob:none
          sparse-checkout: |
            .github
            packages/bun-workspace
            packages/buncc
            packages/bun-os-plugins
      - name: System libraries for the native crates (alsa-sys, bevy, tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libssl-dev libfontconfig1-dev libvulkan-dev libgtk-3-dev libgtk-4-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libopus-dev libavcodec-dev libavutil-dev libva-dev glslang-tools libsystemd-dev
      - id: setup
        uses: ./.github/actions/setup-workspace
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          profile: ci
          rust: "true"
      # The libcubeb C sources are a nested submodule that `bun run setup` does not recurse into; cubeb-sys builds them with CMake.
      - name: Nested libcubeb submodule
        if: ${{ steps.setup.outcome == 'success' }}
        run: git -C vendor/cubeb-rs submodule update --init --depth 1 --recursive
      # openssl-sys needs a prebuilt OpenSSL on MSVC. The Shining Light build from Chocolatey avoids vcpkg, which compiles OpenSSL
      # and downloads NASM from nasm.us (unreachable from the runners at times).
      - name: OpenSSL for the native crates
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          choco install openssl --no-progress -y
          # The Shining Light installer's directory varies by version: locate the MD import libraries instead of assuming it.
          $ssl = Get-ChildItem -Path 'C:\Program Files','C:\Program Files (x86)','C:\OpenSSL-Win64','C:\OpenSSL' -Filter libssl.lib -Recurse -Depth 8 -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -match '\\MD$' } | Select-Object -First 1
          if (-not $ssl) { throw 'libssl.lib (MD) not found after installing OpenSSL' }
          $lib = $ssl.DirectoryName
          $root = $lib
          while ($root -and -not (Test-Path (Join-Path $root 'include\openssl\ssl.h'))) { $root = Split-Path $root -Parent }
          if (-not $root) { throw "OpenSSL headers not found above $lib" }
          "OPENSSL_DIR=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "OPENSSL_LIB_DIR=$lib" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "OPENSSL_INCLUDE_DIR=$root\include" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      # bun-os-shell embeds the pinned Material Symbols font (packages/m3-fonts/fonts/upstream is git-ignored and fetched here).
      - name: Pinned font sources
        if: ${{ steps.setup.outcome == 'success' }}
        run: bun scripts/m3/fonts-sync.ts --quiet
      - name: Format
        run: bun scripts/cargo-fmt.ts
      - name: Check every workspace member
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && runner.os == 'Linux' }}
        run: bun packages/buncc/src/cli.ts check
      # ruzu is a GTK 4 frontend (glib/gdk4 need pkg-config and GTK 4 development files); its ruzu_cmd, video_core and audio_core ports probe pkg-config for FFmpeg and libopus.
      - name: Check every workspace member except the GTK 4 frontend
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && runner.os == 'Windows' }}
        run: bun packages/buncc/src/cli.ts exec -- check --locked --workspace --keep-going --exclude ruzu --exclude ruzu_cmd --exclude video_core --exclude audio_core
      # Deny-by-default lints only: the imported bevy forks do not pass -D warnings yet (non-ASCII test identifiers, unused deps).
      - name: Clippy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          BUNCC_CARGO_DEADLINE_MS: "7200000"
        run: bun packages/buncc/src/cli.ts exec -- clippy --workspace --all-targets --locked --keep-going ${{ runner.os == 'Windows' && '--exclude ruzu --exclude ruzu_cmd --exclude video_core --exclude audio_core' || '' }}

  release-plan:
    name: Release plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with:
          # Blobless + bootstrap cone: the setup-workspace action expands to the profile (docs/MONOREPO-SCALE.md).
          filter: blob:none
          sparse-checkout: |
            .github
            packages/bun-workspace
            packages/buncc
            packages/bun-os-plugins
      - id: setup
        uses: ./.github/actions/setup-workspace
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          profile: ci
          rust: "true"
      - name: Every unpublished npm package and crate
        run: bun scripts/release.ts plan
      # `bun publish --dry-run` still demands npm credentials; without the NPM_TOKEN secret only the plan above runs.
      - name: Dry-run publication of the npm packages that are not out yet
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: ${{ env.NPM_CONFIG_TOKEN != '' }}
        run: bun scripts/release.ts npm
