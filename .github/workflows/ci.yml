name: CI

on:
  push:
    branches: [os]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Affected areas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      js: ${{ steps.areas.outputs.js }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github
            packages/bun-workspace
            packages/buncc
      - uses: ./.github/actions/setup-bun
      - id: areas
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        # git diff <base>...HEAD classified by path (packages/bun-workspace/src/git-affected.ts); unknown base = everything.
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            bun packages/bun-workspace/src/git-cli.ts affected --base "$BASE" --github-output
          else
            for area in all js rust docs distro; do echo "$area=true" >> "$GITHUB_OUTPUT"; done
          fi
  quality:
    name: Bun quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Blobless + bootstrap cone: the setup-workspace action expands to the profile (docs/MONOREPO-SCALE.md).
          filter: blob:none
          sparse-checkout: |
            .github
            packages/bun-workspace
            packages/buncc
      - id: setup
        uses: ./.github/actions/setup-workspace
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          profile: ci
      - name: Type check
        run: bun run check
      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run lint
      - name: Format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run format:check
      - name: Documentation links and navigation
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run docs:check
      - name: Workspace manifests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun scripts/workspace-manifests.ts
      - name: Buncc unit tests and toolchain report
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          bun test packages/buncc
          bun packages/buncc/src/cli.ts doctor || true
      - name: Component manifest
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun factory/bunos/generate-components.ts --check && bun factory/bunos/check-components.ts

  rust:
    name: Rust ${{ matrix.os }}
    needs: plan
    if: ${{ needs.plan.outputs.rust == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    # Windows stays advisory until a green run on windows-latest is recorded (the fork-only MSVC wrapper calls are removed).
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # Blobless + bootstrap cone: the setup-workspace action expands to the profile (docs/MONOREPO-SCALE.md).
          filter: blob:none
          sparse-checkout: |
            .github
            packages/bun-workspace
            packages/buncc
      - name: System libraries for the native crates (alsa-sys, bevy, tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libssl-dev libfontconfig1-dev libvulkan-dev libgtk-3-dev libgtk-4-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - id: setup
        uses: ./.github/actions/setup-workspace
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          profile: ci
          rust: "true"
      # The libcubeb C sources are a nested submodule that `bun run setup` does not recurse into; cubeb-sys builds them with CMake.
      - name: Nested libcubeb submodule
        if: ${{ steps.setup.outcome == 'success' }}
        run: git -C vendor/cubeb-rs submodule update --init --depth 1 --recursive
      # openssl-sys finds OpenSSL through vcpkg on MSVC; Windows runners ship vcpkg without OpenSSL.
      - name: OpenSSL for the native crates
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows-static-md
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=x64-windows-static-md" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Format
        run: bun scripts/cargo-fmt.ts
      - name: Check every workspace member
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && runner.os == 'Linux' }}
        run: bun packages/buncc/src/cli.ts check
      # ruzu is a GTK 4 frontend: glib/gdk4 need pkg-config and the GTK 4 development files, which Windows runners lack.
      - name: Check every workspace member except the GTK 4 frontend
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && runner.os == 'Windows' }}
        run: bun packages/buncc/src/cli.ts exec -- check --locked --workspace --exclude ruzu
      # Deny-by-default lints only: the imported bevy forks do not pass -D warnings yet (non-ASCII test identifiers, unused deps).
      - name: Clippy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun packages/buncc/src/cli.ts exec -- clippy --workspace --all-targets --locked ${{ runner.os == 'Windows' && '--exclude ruzu' || '' }}

  release-plan:
    name: Release plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with:
          # Blobless + bootstrap cone: the setup-workspace action expands to the profile (docs/MONOREPO-SCALE.md).
          filter: blob:none
          sparse-checkout: |
            .github
            packages/bun-workspace
            packages/buncc
      - id: setup
        uses: ./.github/actions/setup-workspace
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          profile: ci
          rust: "true"
      - name: Every unpublished npm package and crate
        run: bun scripts/release.ts plan
      - name: Dry-run publication of the npm packages that are not out yet
        run: bun scripts/release.ts npm
