name: WSL rootfs (Bun OS on Arch)

on:
  workflow_dispatch:
    inputs:
      tier:
        description: CachyOS repo tier (x86-64, x86-64-v3, x86-64-v4, znver4)
        default: x86-64-v3
      profile:
        description: Package profile on top of base (base, cosmic, hyprland)
        default: base
  push:
    branches: [main]
    paths:
      - factory/wsl/**
      - .github/workflows/wsl-rootfs.yml

permissions:
  contents: read

concurrency:
  group: wsl-rootfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rootfs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            factory
            packages/buncc
            packages/bun-os-plugins
          sparse-checkout-cone-mode: true
      - name: Build rootfs in a privileged Arch container
        run: |
          mkdir -p out
          docker run --rm --privileged -v "$PWD":/repo -w /repo \
            -e BUNOS_TIER="${{ inputs.tier || 'x86-64-v3' }}" -e BUNOS_PROFILE="${{ inputs.profile || 'base' }}" \
            archlinux:base-devel bash factory/wsl/build-rootfs.sh /repo /repo/out/bunos-wsl.tar.gz
      - name: Receipt (size and package list)
        if: always()
        run: |
          ls -l out || true
          { echo '### bunos-wsl rootfs'; cat out/bunos-wsl.tar.gz.sha256 2>/dev/null || echo 'not built'; ls -l out 2>/dev/null; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bunos-wsl-rootfs
          path: out/
          if-no-files-found: warn
