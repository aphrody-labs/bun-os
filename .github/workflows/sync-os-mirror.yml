name: Sync os mirror

# `main` is the integration branch. `os` is kept as a fast-forward mirror for the clones, workflows and docs that still name it.
# The mirror is only ever fast-forwarded with GITHUB_TOKEN. When `os` has commits that `main` does not contain, nothing is forced:
# an alert issue is opened instead (and updated on later runs).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-os-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Fast-forward os to main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github
          # GITHUB_TOKEN cannot create or update workflow files; set MIRROR_TOKEN (a PAT with the workflow scope) so those fast-forwards succeed.
          token: ${{ secrets.MIRROR_TOKEN || github.token }}
      - name: Fast-forward os
        id: ff
        run: |
          git fetch origin os || { echo "state=missing" >> "$GITHUB_OUTPUT"; }
          if ! git rev-parse --verify -q origin/os >/dev/null; then
            if git push origin HEAD:refs/heads/os; then echo "state=created" >> "$GITHUB_OUTPUT"; else echo "state=push-failed" >> "$GITHUB_OUTPUT"; fi
          elif git merge-base --is-ancestor origin/os HEAD; then
            if [ "$(git rev-parse origin/os)" = "$(git rev-parse HEAD)" ]; then
              echo "state=current" >> "$GITHUB_OUTPUT"
            else
              if git push origin HEAD:refs/heads/os; then echo "state=advanced" >> "$GITHUB_OUTPUT"; else echo "state=push-failed" >> "$GITHUB_OUTPUT"; fi
            fi
          else
            echo "state=diverged" >> "$GITHUB_OUTPUT"
            echo "ahead=$(git rev-list --count HEAD..origin/os)" >> "$GITHUB_OUTPUT"
          fi
      - name: Alert when os is not an ancestor of main
        if: steps.ff.outputs.state == 'diverged' || steps.ff.outputs.state == 'push-failed'
        env:
          GH_TOKEN: ${{ github.token }}
          AHEAD: ${{ steps.ff.outputs.ahead }}
          STATE: ${{ steps.ff.outputs.state }}
        run: |
          title="os mirror out of sync with main"
          body="State: ${STATE}. If diverged, origin/os has ${AHEAD} commit(s) that main does not contain, so it was not fast-forwarded (no force push). If push-failed, the push was rejected (a change to .github/workflows needs the MIRROR_TOKEN secret). Merge origin/os into main, then the next push to main resynchronises the mirror. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
