name: Setup Bun
description: Installs the upstream oven-sh/bun build pinned by package.json (packageManager) from its npm platform package, checked against the registry integrity and gitHead.

inputs:
  bun-version:
    description: Exact npm version of bun (default is packageManager in package.json, bun@<version>).
    default: ""
    required: false

runs:
  using: composite
  steps:
    - name: Resolve the pinned version
      id: pin
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.bun-version }}
      run: |
        set -euo pipefail
        version="${INPUT_VERSION}"
        if [ -z "$version" ]; then
          version="$(sed -n 's/.*"packageManager": *"bun@\([^"]*\)".*/\1/p' package.json | head -n 1)"
        fi
        [ -n "$version" ] || { echo "::error::no Bun version: set packageManager to bun@<version> in package.json"; exit 1; }
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Cache Bun
      uses: actions/cache@v4
      with:
        path: ~/.bun/bin
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.version }}
    - name: Install Bun
      shell: bash
      env:
        BUN_VERSION: ${{ steps.pin.outputs.version }}
      run: |
        set -euo pipefail
        case "${RUNNER_OS}" in Windows) exe=bun.exe;; *) exe=bun;; esac
        # The cached binary is trusted only if it still reports the pinned revision.
        expected="$(node -e 'fetch("https://registry.npmjs.org/bun/"+process.argv[1]).then(r=>r.json()).then(m=>console.log(m.gitHead))' "$BUN_VERSION")"
        if ! [ "$("$HOME/.bun/bin/$exe" -p Bun.revision 2>/dev/null || true)" = "$expected" ]; then
          node "$GITHUB_ACTION_PATH/install.mjs" "$BUN_VERSION" "$HOME/.bun/bin"
        fi
        # Native tools see Windows paths: a /c/Users/... entry is not one, and the workspace scripts that spawn a
        # separate Bun (resolveBunExecutable) did not find it on the Windows runner. Hand them the executable directly.
        bin="$HOME/.bun/bin" path="$HOME/.bun/bin/$exe"
        if command -v cygpath >/dev/null; then bin="$(cygpath -w "$bin")" path="$(cygpath -w "$path")"; fi
        echo "$bin" >> "$GITHUB_PATH"
        echo "APHRODY_BUN_BINARY=$path" >> "$GITHUB_ENV"
        "$HOME/.bun/bin/$exe" --revision
