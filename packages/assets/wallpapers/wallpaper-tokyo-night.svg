<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160" fill="none">
  <defs>
    <radialGradient id="tn-base" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#24283b"/>
      <stop offset="50%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#13141c"/>
    </radialGradient>
    <radialGradient id="neon-cyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a1b26" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neon-purple" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1a1b26" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom-tn" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="#13141c"/>
  <rect width="3840" height="2160" fill="url(#tn-base)"/>
  <rect width="3840" height="2160" fill="url(#neon-cyan)" filter="url(#bloom-tn)"/>
  <rect width="3840" height="2160" fill="url(#neon-purple)" filter="url(#bloom-tn)"/>

  <!-- Geometric Grid Waves -->
  <g stroke="#7aa2f7" stroke-opacity="0.08" stroke-width="1.5">
    <line x1="0" y1="540" x2="3840" y2="540"/>
    <line x1="0" y1="1080" x2="3840" y2="1080"/>
    <line x1="0" y1="1620" x2="3840" y2="1620"/>
    <line x1="960" y1="0" x2="960" y2="2160"/>
    <line x1="1920" y1="0" x2="1920" y2="2160"/>
    <line x1="2880" y1="0" x2="2880" y2="2160"/>
  </g>

  <!-- Tokyo Cyber Rings -->
  <circle cx="1920" cy="1080" r="850" stroke="#bb9af7" stroke-opacity="0.15" stroke-width="2"/>
  <circle cx="1920" cy="1080" r="1300" stroke="#7aa2f7" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="16 24"/>
</svg>
