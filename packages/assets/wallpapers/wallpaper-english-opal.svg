<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160" fill="none">
  <defs>
    <radialGradient id="opal-base" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f8fafc"/>
      <stop offset="85%" stop-color="#eef2f6"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <radialGradient id="opal-luster" cx="70%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#c2e7ff" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#e0f2fe" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="opal-warm" cx="30%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#f1f5f9" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom-opal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="#f8fafc"/>
  <rect width="3840" height="2160" fill="url(#opal-base)"/>
  <rect width="3840" height="2160" fill="url(#opal-luster)" filter="url(#bloom-opal)"/>
  <rect width="3840" height="2160" fill="url(#opal-warm)" filter="url(#bloom-opal)"/>

  <!-- Elegant Linear Geometry -->
  <circle cx="1920" cy="1080" r="950" stroke="#0284c7" stroke-opacity="0.08" stroke-width="1.2"/>
  <circle cx="1920" cy="1080" r="1400" stroke="#0369a1" stroke-opacity="0.05" stroke-width="1.5" stroke-dasharray="8 16"/>

  <path d="M0 1650 C 960 1520, 1920 1800, 2880 1620 C 3360 1520, 3600 1560, 3840 1580 L 3840 2160 L 0 2160 Z" fill="#e2e8f0" fill-opacity="0.5"/>
</svg>
