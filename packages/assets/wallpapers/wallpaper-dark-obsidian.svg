<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160" fill="none">
  <defs>
    <radialGradient id="nebula-primary" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e2c48" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#111927" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-celestial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8ab4f8" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#7cd8e8" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#4285F4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ring-glow" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#8ab4f8" stop-opacity="0"/>
      <stop offset="95%" stop-color="#8ab4f8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c2e7ff" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="bloom-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>

  <!-- Base Surface -->
  <rect width="3840" height="2160" fill="#080c14"/>
  <rect width="3840" height="2160" fill="url(#nebula-primary)"/>

  <!-- Celestial Glow Fields -->
  <circle cx="1920" cy="1080" r="1400" fill="url(#glow-celestial)" filter="url(#bloom-soft)"/>
  <circle cx="2800" cy="600" r="800" fill="#7cd8e8" fill-opacity="0.08" filter="url(#bloom-soft)"/>
  <circle cx="1000" cy="1600" r="900" fill="#4285F4" fill-opacity="0.07" filter="url(#bloom-soft)"/>

  <!-- Orbital Rings -->
  <circle cx="1920" cy="1080" r="900" stroke="#8ab4f8" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="12 18"/>
  <circle cx="1920" cy="1080" r="1200" stroke="#7cd8e8" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="1920" cy="1080" r="1550" stroke="#c2e7ff" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Harmonic Horizon Wave -->
  <path d="M0 1600 C 960 1450, 1920 1750, 2880 1550 C 3360 1450, 3600 1500, 3840 1520 L 3840 2160 L 0 2160 Z" fill="#0b101b" fill-opacity="0.6"/>
  <path d="M0 1780 C 1200 1650, 2400 1900, 3840 1720 L 3840 2160 L 0 2160 Z" fill="#06090e" fill-opacity="0.8"/>

  <!-- Center Core Star -->
  <g transform="translate(1920, 1080)">
    <path d="M0 -180 C0 -50 50 0 180 0 C50 0 0 50 0 180 C0 50 -50 0 -180 0 C-50 0 0 -50 0 -180 Z" fill="#8ab4f8" fill-opacity="0.4" filter="url(#bloom-soft)"/>
    <path d="M0 -120 C0 -35 35 0 120 0 C35 0 0 35 0 120 C0 35 -35 0 -120 0 C-35 0 0 -35 0 -120 Z" fill="#c2e7ff" fill-opacity="0.8"/>
    <circle cx="0" cy="0" r="12" fill="#ffffff"/>
  </g>
</svg>
