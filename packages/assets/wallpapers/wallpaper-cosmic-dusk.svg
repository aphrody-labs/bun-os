<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160" fill="none">
  <defs>
    <radialGradient id="cosmic-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#182030"/>
      <stop offset="60%" stop-color="#0e131d"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </radialGradient>
    <radialGradient id="amber-glow" cx="25%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#f68b33" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0e131d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal-glow" cx="75%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#48b9c7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0e131d" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom-cosmic" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="#080a0f"/>
  <rect width="3840" height="2160" fill="url(#cosmic-bg)"/>
  <rect width="3840" height="2160" fill="url(#amber-glow)" filter="url(#bloom-cosmic)"/>
  <rect width="3840" height="2160" fill="url(#teal-glow)" filter="url(#bloom-cosmic)"/>

  <!-- Orbital Ellipse -->
  <ellipse cx="1920" cy="1080" rx="1400" ry="500" stroke="#48b9c7" stroke-opacity="0.12" stroke-width="2" transform="rotate(-15 1920 1080)"/>
  <ellipse cx="1920" cy="1080" rx="1100" ry="380" stroke="#f68b33" stroke-opacity="0.15" stroke-width="1.5" transform="rotate(25 1920 1080)"/>
</svg>
