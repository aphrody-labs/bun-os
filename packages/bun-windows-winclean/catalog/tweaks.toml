# ------------------------------------------------------------------------------------------------------------- look
# Replaces the retired resident desktop stack (GlazeWM, tacky-borders, AltSnap, Flow Launcher, the chrome watcher and
# overlay, the wgpu wallpaper; docs/WINDOWS-ARCHITECTURE.md): Windows draws all of this itself from these values.
# Colours are the M3 seed #5b45a2 of the design receipt (vps ~/build/storage/artifacts/design/current/receipt.json);
# DWORD colours are 0xAABBGGRR. The live apply broadcasts WM_SETTINGCHANGE (ImmersiveColorSet) and calls
# SPI_SETDESKWALLPAPER, so nothing needs a logoff (src/tweaks/live.rs notify_settings_changed).

[[tweak]]
id = "look.accent"
module = "look"
title = "Accent colour from the Bun OS seed, shown on title bars and window borders"
level = "standard"
registry = [
  { hive = "user", key = 'Software\Microsoft\Windows\DWM', name = "AccentColor", type = "dword", value = 4288824667 },
  { hive = "user", key = 'Software\Microsoft\Windows\DWM', name = "ColorizationColor", type = "dword", value = 3294315938 },
  { hive = "user", key = 'Software\Microsoft\Windows\DWM', name = "ColorizationAfterglow", type = "dword", value = 3294315938 },
  { hive = "user", key = 'Software\Microsoft\Windows\DWM', name = "ColorPrevalence", type = "dword", value = 1 },
  { hive = "user", key = 'Software\Microsoft\Windows\CurrentVersion\Explorer\Accent', name = "AccentColorMenu", type = "dword", value = 4286198852 },
  { hive = "user", key = 'Software\Microsoft\Windows\CurrentVersion\Explorer\Accent', name = "StartColorMenu", type = "dword", value = 4284032562 },
  { hive = "user", key = 'Software\Microsoft\Windows\CurrentVersion\Explorer\Accent', name = "AccentPalette", type = "binary", value = "d6d1e800ada2d1008474b9005b45a20044347a003226590020183900120e2000" },
  { hive = "user", key = 'Software\Microsoft\Windows\CurrentVersion\Themes\Personalize', name = "ColorPrevalence", type = "dword", value = 0 },
]

[[tweak]]
id = "look.transparency"
module = "look"
title = "Transparency effects on (Mica and Acrylic wherever apps and the shell offer them)"
level = "standard"
registry = [
  { hive = "user", key = 'Software\Microsoft\Windows\CurrentVersion\Themes\Personalize', name = "EnableTransparency", type = "dword", value = 1 },
]

[[tweak]]
id = "look.wallpaper"
module = "look"
title = 'Static Bun OS wallpaper (design artifact, installed under %SystemRoot%\BunOS\share\wallpaper)'
level = "standard"
registry = [
  { hive = "user", key = 'Control Panel\Desktop', name = "Wallpaper", type = "expand_sz", value = '%SystemRoot%\BunOS\share\wallpaper\bunos-dusk-3840x2160.png' },
  { hive = "user", key = 'Control Panel\Desktop', name = "WallpaperStyle", type = "sz", value = "10" },
  { hive = "user", key = 'Control Panel\Desktop', name = "TileWallpaper", type = "sz", value = "0" },
]

[[tweak]]
id = "look.snap"
module = "look"
title = "Snap layouts, Snap assist and snap groups on (Windows' own tiling)"
level = "conservative"
registry = [
  { hive = "user", key = 'Control Panel\Desktop', name = "WindowArrangementActive", type = "sz", value = "1" },
  { hive = "user", key = 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name = "SnapAssist", type = "dword", value = 1 },
  { hive = "user", key = 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name = "EnableSnapAssistFlyout", type = "dword", value = 1 },
  { hive = "user", key = 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name = "EnableSnapBar", type = "dword", value = 1 },
  { hive = "user", key = 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name = "EnableTaskGroups", type = "dword", value = 1 },
]

[[tweak]]
id = "look.virtual-desktops"
module = "look"
title = "Virtual desktops as workspaces: taskbar and Alt+Tab show the current desktop only"
level = "standard"
registry = [
  { hive = "user", key = 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name = "VirtualDesktopTaskbarFilter", type = "dword", value = 1 },
  { hive = "user", key = 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name = "VirtualDesktopAltTabFilter", type = "dword", value = 1 },
]

# --------------------------------------------------------------------------------------------------------- devtools

[[tweak]]
id = "devtools.long-paths"
module = "devtools"
title = "Win32 long paths enabled"
level = "conservative"
registry = [
  { hive = "machine", key = 'SYSTEM\CurrentControlSet\Control\FileSystem', name = "LongPathsEnabled", type = "dword", value = 1 },
]

[[tweak]]
id = "devtools.developer-mode"
module = "devtools"
title = "Developer Mode (sideloading, symlinks without elevation)"
level = "standard"
registry = [
  { hive = "machine", key = 'SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock', name = "AllowDevelopmentWithoutDevLicense", type = "dword", value = 1 },
]

[[tweak]]
id = "devtools.sudo"
module = "devtools"
title = "Windows sudo enabled inline"
level = "standard"
registry = [
  { hive = "machine", key = 'SOFTWARE\Microsoft\Windows\CurrentVersion\Sudo', name = "Enabled", type = "dword", value = 3 },
]

# ------------------------------------------------------------------------------------------------------------ setup

[[tweak]]
id = "setup.hardware-bypass"
module = "setup"
title = "Install on unsupported hardware (TPM, Secure Boot, CPU, RAM, storage checks)"
level = "standard"
targets = ["offline"]
registry = [
  { hive = "machine", key = 'SYSTEM\Setup\LabConfig', name = "BypassCPUCheck", type = "dword", value = 1 },
  { hive = "machine", key = 'SYSTEM\Setup\LabConfig', name = "BypassRAMCheck", type = "dword", value = 1 },
  { hive = "machine", key = 'SYSTEM\Setup\LabConfig', name = "BypassSecureBootCheck", type = "dword", value = 1 },
  { hive = "machine", key = 'SYSTEM\Setup\LabConfig', name = "BypassStorageCheck", type = "dword", value = 1 },
  { hive = "machine", key = 'SYSTEM\Setup\LabConfig', name = "BypassTPMCheck", type = "dword", value = 1 },
  { hive = "machine", key = 'SYSTEM\Setup\MoSetup', name = "AllowUpgradesWithUnsupportedTPMOrCPU", type = "dword", value = 1 },
  { hive = "user", key = 'Control Panel\UnsupportedHardwareNotificationCache', name = "SV1", type = "dword", value = 0 },
  { hive = "user", key = 'Control Panel\UnsupportedHardwareNotificationCache', name = "SV2", type = "dword", value = 0 },
]

[[tweak]]
id = "setup.local-account"
module = "setup"
title = "OOBE allows a local account (BypassNRO)"
level = "standard"
targets = ["offline"]
registry = [
  { hive = "machine", key = 'SOFTWARE\Microsoft\Windows\CurrentVersion\OOBE', name = "BypassNRO", type = "dword", value = 1 },
]

[[tweak]]
id = "setup.no-device-encryption"
module = "setup"
title = "No automatic BitLocker device encryption"
level = "standard"
targets = ["offline"]
registry = [
  { hive = "machine", key = 'SYSTEM\CurrentControlSet\Control\BitLocker', name = "PreventDeviceEncryption", type = "dword", value = 1 },
]

[[tweak]]
id = "setup.suggested-apps-keys"
module = "setup"
title = "Content Delivery Manager subscriptions and suggested apps cleared for new users"
level = "standard"
targets = ["offline"]
registry = [
  { hive = "user", key = 'Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager\Subscriptions', action = "delete_key" },
  { hive = "user", key = 'Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager\SuggestedApps', action = "delete_key" },
]

# ---------------------------------------------------------------------------------------------------- android / wsl

[[tweak]]
id = "android.vm-platform"
module = "android"
title = "Virtual Machine Platform enabled (Waydroid on WSL, WSABuilds)"
level = "aggressive"
features = [{ name = "VirtualMachinePlatform", state = "enabled" }]

[[tweak]]
id = "wsl.subsystem"
module = "wsl"
title = "Windows Subsystem for Linux enabled (Bun OS WSL bundle, WSLg desktops)"
level = "aggressive"
features = [{ name = "Microsoft-Windows-Subsystem-Linux", state = "enabled" }]
