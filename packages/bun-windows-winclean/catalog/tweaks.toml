# SPDX-License-Identifier: Apache-2.0
# Bun OS Windows tweak catalog: the single source of truth for `bunos-win11` (live and ISO), Bun OS Tweaks and the
# WinClean `tweak_*` tools. Every tweak is data; the engine (src/tweaks) detects, plans, applies, verifies and undoes it.
#
# Removal and policy lists were derived from public behaviour of ntdevlabs/tiny11builder (credited in
# vendor/tiny11builder and docs/WINDOWS-DESKTOP.md), Raphire/Win11Debloat (MIT), ChrisTitusTech/winutil (MIT) and
# Microsoft Learn policy CSP documentation. No code from those projects is copied here.
#
# level: conservative (allowed live by default), standard, aggressive (opt-in).
# targets: live (running Windows), offline (mounted install.wim). Default: both.
# hive: machine (HKLM: SOFTWARE\... or SYSTEM\CurrentControlSet\...) or user (HKCU; offline: Users\Default\NTUSER.DAT).

schema = 1

[[module]]
id = "privacy"
title = "Privacy and telemetry"
description = "Diagnostic data, advertising ID, tailored experiences, activity history, feedback prompts."

[[module]]
id = "ai"
title = "Copilot, Recall and AI features"
description = "Policies that turn off Copilot, Recall snapshots and Click to Do, and remove the Copilot app."

[[module]]
id = "suggestions"
title = "Ads and suggestions"
description = "Start, Settings, lock screen and notification suggestions, silent app installs, web results in search."

[[module]]
id = "appx"
title = "Consumer app bloat"
description = "Inbox consumer apps removed for the current user (live) or deprovisioned from the image (offline)."

[[module]]
id = "edge-onedrive"
title = "Edge and OneDrive"
description = "Edge background/sidebar/shopping policies, OneDrive sync client. WebView2 is never touched."

[[module]]
id = "services"
title = "Services and scheduled tasks"
description = "Telemetry services and CEIP/appraiser/feedback scheduled tasks."

[[module]]
id = "performance"
title = "Performance and power"
description = "Power plan, startup delay, menu delay, Game DVR."

[[module]]
id = "shell"
title = "Shell and desktop"
description = "Start and taskbar declutter, Explorer defaults."

[[module]]
id = "look"
title = "Native look (Bun OS Material)"
description = "Windows' own personalisation settings from the Bun OS M3 seed: accent on title bars and borders, Mica/transparency, static wallpaper, Snap and virtual desktops. One-shot registry values with undo; no resident process."

[[module]]
id = "devtools"
title = "Developer tools"
description = "Long paths, Developer Mode, sudo."

[[module]]
id = "setup"
title = "Setup (image only)"
description = "Hardware-requirement bypass, offline account, device encryption, inbox installers; offline targets only."

[[module]]
id = "android"
title = "Android apps"
description = "Virtual Machine Platform state for Waydroid on WSL (detect; enabling is opt-in and needs a reboot)."

[[module]]
id = "wsl"
title = "WSL and Bun OS"
description = "Windows Subsystem for Linux state for the Bun OS WSL bundle (detect; enabling is opt-in)."

# ---------------------------------------------------------------------------------------------------------- privacy

[[tweak]]
id = "privacy.telemetry"
module = "privacy"
title = "Diagnostic data to the minimum, no feedback notifications"
level = "conservative"
registry = [
  { hive = "machine", key = 'SOFTWARE\Policies\Microsoft\Windows\DataCollection', name = "AllowTelemetry", type = "dword", value = 0 },
  { hive = "machine", key = 'SOFTWARE\Policies\Microsoft\Windows\DataCollection', name = "DoNotShowFeedbackNotifications", type = "dword", value = 1 },
  { hive = "machine", key = 'SOFTWARE\Policies\Microsoft\Windows\DataCollection', name = "LimitDiagnosticLogCollection", type = "dword", value = 1 },
  { hive = "machine", key = 'SOFTWARE\Policies\Microsoft\Windows\DataCollection', name = "DisableOneSettingsDownloads", type = "dword", value = 1 },
  { hive = "user", key = 'Software\Microsoft\Siuf\Rules', name = "NumberOfSIUFInPeriod", type = "dword", value = 0 },
]

[[tweak]]
id = "privacy.advertising-id"
module = "privacy"
title = "Advertising ID off"
level = "conservative"
registry = [
  { hive = "machine", key = 'SOFTWARE\Policies\Microsoft\Windows\AdvertisingInfo', name = "DisabledByGroupPolicy", type = "dword", value = 1 },
  { hive = "user", key = 'Software\Microsoft\Windows\CurrentVersion\AdvertisingInfo', name = "Enabled", type = "dword", value = 0 },
]

[[tweak]]
id = "privacy.tailored-experiences"
module = "privacy"
title = "No tailored experiences from diagnostic data"
level = "conservative"
registry = [
  { hive = "user", key = 'Software\Microsoft\Windows\CurrentVersion\Privacy', name = "TailoredExperiencesWithDiagnosticDataEnabled", type = "dword", value = 0 },
  { hive = "user", key = 'Software\Policies\Microsoft\Windows\CloudContent', name = "DisableTailoredExperiencesWithDiagnosticData", type = "dword", value = 1 },
]

[[tweak]]
id = "privacy.activity-history"
module = "privacy"
title = "Activity history not collected or uploaded"
level = "conservative"
registry = [
  { hive = "machine", key = 'SOFTWARE\Policies\Microsoft\Windows\System', name = "EnableActivityFeed", type = "dword", value = 0 },
  { hive = "machine", key = 'SOFTWARE\Policies\Microsoft\Windows\System', name = "PublishUserActivities", type = "dword", value = 0 },
  { hive = "machine", key = 'SOFTWARE\Policies\Microsoft\Windows\System', name = "UploadUserActivities", type = "dword", value = 0 },
]

[[tweak]]
id = "privacy.inking-typing"
module = "privacy"
title = "No inking and typing personalisation"
level = "conservative"
registry = [
  { hive = "user", key = 'Software\Microsoft\InputPersonalization', name = "RestrictImplicitInkCollection", type = "dword", value = 1 },
  { hive = "user", key = 'Software\Microsoft\InputPersonalization', name = "RestrictImplicitTextCollection", type = "dword", value = 1 },
  { hive = "user", key = 'Software\Microsoft\InputPersonalization\TrainedDataStore', name = "HarvestContacts", type = "dword", value = 0 },
  { hive = "user", key = 'Software\Microsoft\Personalization\Settings', name = "AcceptedPrivacyPolicy", type = "dword", value = 0 },
  { hive = "user", key = 'Software\Microsoft\Input\TIPC', name = "Enabled", type = "dword", value = 0 },
]

[[tweak]]
id = "privacy.online-speech"
module = "privacy"
title = "Online speech recognition off"
level = "standard"
registry = [
  { hive = "user", key = 'Software\Microsoft\Speech_OneCore\Settings\OnlineSpeechPrivacy', name = "HasAccepted", type = "dword", value = 0 },
]

