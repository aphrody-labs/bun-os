  { hive = "machine", key = 'SOFTWARE\Policies\Microsoft\Edge', name = "StartupBoostEnabled", type = "dword", value = 0 },
  { hive = "machine", key = 'SOFTWARE\Policies\Microsoft\Edge', name = "BackgroundModeEnabled", type = "dword", value = 0 },
  { hive = "machine", key = 'SOFTWARE\Policies\Microsoft\Edge', name = "EdgeShoppingAssistantEnabled", type = "dword", value = 0 },
  { hive = "machine", key = 'SOFTWARE\Policies\Microsoft\Edge', name = "ShowRecommendationsEnabled", type = "dword", value = 0 },
