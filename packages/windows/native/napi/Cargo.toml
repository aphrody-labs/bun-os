# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-windows-napi"
version = "1.4.7"
edition = "2024"
authors = ["aphrody-dev <contact@aphrody.com>"]
repository = "https://github.com/aphrody-labs/bun-os"
license = "Apache-2.0"
description = "WinRT provider of @aphrody/windows: a Node-API addon on windows-rs, loaded by upstream Bun."
publish = false

[lib]
name = "aphrody_windows_napi"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.15", default-features = false, features = ["napi8"] }
napi-derive = "3.6"
windows = { version = "0.62.2", features = [
  "Foundation",
  "Storage",
  "Storage_Search",
  "System_Profile",
  "Win32_System_WinRT",
] }

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Standalone: not a member of the repository workspace, so it never touches the root Cargo.lock.
[workspace]
