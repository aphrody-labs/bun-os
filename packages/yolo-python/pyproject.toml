[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "yolo"
version = "0.1.0"
description = "Python wrapper around YOLO Rust native engine (PyO3 + uv)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8.0", "polars>=1.12.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "yolo._yolo_native"
python-source = "python"
features = ["pyo3/extension-module"]
locked = true

