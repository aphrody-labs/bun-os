[package]
name = "__NAME__-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
name = "__IDENT___desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Upstream Tauri 3 from crates.io (the same pins as the bun-os workspace.dependencies).
[build-dependencies]
tauri-build = "=3.0.0-alpha.4"

[dependencies]
tauri = { version = "=3.0.0-alpha.5", default-features = false, features = ["compression", "dynamic-acl"] }
tauri-runtime-wry = "=3.0.0-alpha.5"
tauri-plugin-opener = "=3.0.0-alpha.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
