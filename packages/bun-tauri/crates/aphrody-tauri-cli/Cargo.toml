[package]
name = "aphrody-tauri-cli"
version = "1.4.7"
authors = ["Tauri Programme within The Commons Conservancy"]
edition = "2024"
rust-version.workspace = true
categories = ["gui", "web-programming"]
license = "Apache-2.0 OR MIT"
homepage = "https://tauri.app"
repository = "https://github.com/aphrody-labs/bun-distribution"
description = "Command line interface for building Tauri apps"
include = [
  "src/",
  "/templates",
  "scripts/",
  "*.json",
  "*.rs",
  "tauri.gitignore",
  "tauri-dev-watcher.gitignore",
  "LICENSE*",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/tauri-cli-v{ version }/cargo-tauri-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-fmt = "zip"

[lib]
name = "tauri_cli"

[target."cfg(any(target_os = \"linux\", target_os = \"dragonfly\", target_os = \"freebsd\", target_os = \"openbsd\", target_os = \"netbsd\", target_os = \"windows\", target_os = \"macos\"))".dependencies]
cargo-mobile2 = { version = "0.22.5", default-features = false }

[dependencies]
jsonrpsee = { version = "0.26", features = ["server"] }
jsonrpsee-core = "0.26"
jsonrpsee-client-transport = { version = "0.26", features = ["ws"] }
jsonrpsee-ws-client = { version = "0.26", default-features = false }
tower = { version = "0.5", default-features = false }
sublime_fuzzy = "0.7"
clap_complete = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
thiserror = { workspace = true }
tauri-bundler = { version = "=1.4.7", path = "../aphrody-tauri-bundler", package = "aphrody-tauri-bundler", default-features = false }
colored = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
# version should match tauri-utils for deduplication
json5 = "1.3"
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
shared_child = "1"
duct = "1.0"
toml_edit = { workspace = true, features = ["serde"] }
json-patch = "4"
tauri-utils = { version = "~1.4.7", path = "../aphrody-tauri-utils", package = "aphrody-tauri-utils", features = [
  "isolation",
  "schema",
  "config-json5",
  "config-toml",
  "html-manipulation-2",
] }
toml = { workspace = true }
jsonschema = { version = "0.58", default-features = false }
handlebars = "6"
include_dir = "0.7"
dirs = { workspace = true }
# Careful with updating minisign, often broke our updater signatures.
# See https://github.com/tauri-apps/tauri/pull/15022 for example.
minisign = "0.9"
base64 = "0.22"
ureq = { version = "3", default-features = false, features = ["gzip"] }
os_info = "3"
semver = { workspace = true }
regex = { workspace = true }
heck = "0.5"
dialoguer = "0.12"
url = { workspace = true, features = ["serde"] }
os_pipe = "1"
ignore = { workspace = true }
ctrlc = "3"
log = { workspace = true, features = ["kv", "kv_std"] }
env_logger = "0.11"
icns = { package = "tauri-icns", version = "0.1" }
image = { version = "0.25", default-features = false, features = ["ico"] }
axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true, features = ["macros", "sync"] }
common-path = "1"
serde-value = "0.7"
itertools = "0.15"
local-ip-address = "0.6"
css-color = "0.2"
resvg = "0.48"
dunce = { workspace = true }
glob = { workspace = true }
oxc_parser = "0.153.0"
oxc_span = "0.153.0"
oxc_allocator = "0.153.0"
oxc_ast = "0.153.0"
magic_string = "0.3"
phf = { version = "0.14", features = ["macros"] }
walkdir = { workspace = true }
elf = "0.8"
memchr = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true, features = ["v5"] }
rand = { workspace = true }
zip = { version = "8", default-features = false, features = ["deflate"] }
which = { workspace = true }
rayon = { workspace = true }
download-cef = "3"

[dev-dependencies]
serial_test = "3.5"
insta = "1"
pretty_assertions = { workspace = true }

[target."cfg(windows)".dependencies.windows-sys]
version = "0.61"
features = ["Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Console"]

[target."cfg(unix)".dependencies]
libc = { workspace = true }

[target."cfg(target_os = \"macos\")".dependencies]
plist = "1"
tauri-macos-sign = { version = "=1.4.7", path = "../aphrody-tauri-macos-sign", package = "aphrody-tauri-macos-sign" }
object = { version = "0.39", default-features = false, features = ["macho", "read_core", "std"] }
ar = "0.9"

[features]
default = ["rustls", "platform-certs"]
native-tls = ["tauri-bundler/native-tls", "cargo-mobile2/native-tls", "ureq/native-tls"]
native-tls-vendored = ["native-tls", "tauri-bundler/native-tls-vendored"]
rustls = ["tauri-bundler/rustls", "cargo-mobile2/rustls", "ureq/rustls"]
platform-certs = ["tauri-bundler/platform-certs", "ureq/platform-verifier"]

[lints.clippy]
collapsible_if = "allow"
redundant_clone = "warn"
assigning_clones = "warn"
or_fun_call = "warn"
