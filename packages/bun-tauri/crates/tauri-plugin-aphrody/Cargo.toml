[package]
name = "tauri-plugin-aphrody"
version = "1.4.7"
description = "Every Tauri 3 plugin in one crate, with upstream Bun as a first-class backend runtime."
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license = "Apache-2.0 OR MIT"
authors.workspace = true
links = "tauri-plugin-aphrody"
build = "build.rs"
include = ["build.rs", "build/**", "src/**", "permissions/**", "iife/**", "mobile/**", "LICENSE*", "SECURITY.md"]

[lib]
name = "tauri_plugin_aphrody"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = [
  "autostart",
  "clipboard-manager",
  "deep-link",
  "dialog",
  "dialog-xdg-portal",
  "fs",
  "global-shortcut",
  "log",
  "notification",
  "opener",
  "os",
  "process",
  "single-instance",
  "store",
  "updater",
  "updater-rustls-tls",
  "updater-system-proxy",
  "updater-zip",
  "window-state",
]
autostart = ["dep:auto-launch"]
clipboard-manager = ["dep:arboard"]
deep-link = [
  "dep:tauri-utils",
  "dep:tracing",
  "dep:dunce",
  "dep:windows-registry",
  "dep:windows-result",
  "dep:rust-ini",
]
dialog = ["fs", "dep:rfd", "dep:raw-window-handle"]
dialog-xdg-portal = ["dialog", "rfd/xdg-portal", "rfd/tokio", "rfd/wayland"]
fs = ["dep:serde_repr", "dep:anyhow", "dep:glob", "dep:dunce", "dep:percent-encoding", "dep:objc2-foundation"]
fs-watch = ["fs", "dep:notify", "dep:notify-debouncer-full"]
global-shortcut = ["dep:global-hotkey"]
log = [
  "dep:serde_repr",
  "dep:fern",
  "dep:time",
  "dep:android_logger",
  "dep:swift-rs",
  "dep:objc2",
  "dep:objc2-foundation",
]
log-colored = ["log", "fern/colored"]
log-tracing = ["log", "dep:tracing"]
mcp-bridge = [
  "dep:tauri-runtime",
  "dep:tauri-runtime-cef",
  "dep:tokio",
  "tokio/full",
  "dep:tokio-tungstenite",
  "dep:futures-util",
  "dep:uuid",
  "dep:base64",
  "dep:image",
]
notification = ["dep:rand", "dep:time", "dep:serde_repr", "dep:notify-rust"]
notification-windows7-compat = ["notification"]
opener = ["dep:open", "dep:glob", "dep:dunce", "dep:windows", "dep:zbus", "dep:objc2-app-kit", "dep:objc2-foundation"]
os = ["dep:os_info", "dep:sys-locale", "dep:gethostname", "dep:serialize-to-javascript"]
process = []
single-instance = ["dep:tracing", "dep:tokio", "tokio/net", "dep:windows-sys", "dep:zbus"]
single-instance-deep-link = ["single-instance", "deep-link"]
single-instance-semver = ["single-instance", "dep:semver"]
store = ["dep:tracing", "dep:dunce", "dep:tokio", "tokio/sync", "tokio/time", "tokio/macros"]
updater = [
  "dep:tokio",
  "dep:reqwest",
  "dep:http",
  "dep:minisign-verify",
  "dep:time",
  "dep:base64",
  "dep:semver",
  "semver/serde",
  "dep:futures-util",
  "dep:tempfile",
  "dep:infer",
  "dep:percent-encoding",
  "dep:windows-sys",
  "dep:dirs",
  "dep:tar",
  "dep:flate2",
  "dep:osakit",
]
updater-native-tls = ["updater", "reqwest/native-tls"]
updater-native-tls-vendored = ["updater", "reqwest/native-tls-vendored"]
updater-rustls-tls = ["updater", "reqwest/rustls-no-provider", "dep:rustls"]
updater-system-proxy = ["updater", "reqwest/system-proxy"]
updater-zip = ["updater", "dep:zip", "dep:tar", "dep:flate2"]
window-state = ["dep:bitflags"]
wrap = ["dep:open"]
wrap-bundle = ["wrap", "dep:axum", "dep:http", "dep:reqwest", "reqwest/rustls-no-provider", "dep:rustls", "dep:tokio"]
wrap-debug-bridge = ["wrap", "mcp-bridge", "dep:uuid"]
# Mock runtime of `tauri::test`, used by the e2e suite of every module (tests/).
test = ["tauri/test"]

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }
tauri-utils = { workspace = true, features = ["build"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[target.'cfg(target_os = "macos")'.build-dependencies]
plist = "1"

[dependencies]
tauri = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true, features = ["kv"] }
url = { workspace = true }
# deep-link
tauri-utils = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# fs, log, notification
serde_repr = { version = "0.1", optional = true }
anyhow = { workspace = true, optional = true }
glob = { workspace = true, optional = true }
notify = { workspace = true, optional = true, features = ["serde"] }
notify-debouncer-full = { workspace = true, optional = true }
dunce = { workspace = true, optional = true }
percent-encoding = { version = "2.3", optional = true }
fern = { version = "0.7", optional = true }
time = { workspace = true, optional = true, features = ["formatting", "local-offset", "macros", "parsing", "serde"] }
rand = { version = "0.9", optional = true }
# os
os_info = { version = "3", optional = true }
sys-locale = { workspace = true, optional = true }
gethostname = { version = "1.0", optional = true }
serialize-to-javascript = { version = "0.1.1", optional = true }
# opener, wrap
open = { workspace = true, optional = true, features = ["shellexecute-on-windows"] }
# single-instance, store, updater, mcp-bridge, wrap-bundle
tokio = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
# updater, wrap-bundle
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"], optional = true }
rustls = { workspace = true, optional = true }
http = { workspace = true, optional = true }
minisign-verify = { version = "0.3", optional = true }
base64 = { version = "0.22.1", optional = true }
futures-util = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
infer = { version = "0.22", optional = true }
axum = { workspace = true, optional = true }
# window-state
bitflags = { version = "2", optional = true }
# mcp-bridge
tauri-runtime = { workspace = true, optional = true }
tauri-runtime-cef = { workspace = true, optional = true }
tokio-tungstenite = { version = "0.30", optional = true }
uuid = { workspace = true, optional = true }
image = { version = "0.25.10", optional = true, default-features = false, features = ["png", "jpeg"] }
# autostart
auto-launch = { version = "0.5", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
global-hotkey = { version = "0.8", features = ["serde"], optional = true }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
arboard = { version = "3.6", features = ["wayland-data-control"], optional = true }
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"], optional = true }
raw-window-handle = { version = "0.6", optional = true }
notify-rust = { version = "4.18", optional = true }

[target.'cfg(windows)'.dependencies]
windows-registry = { version = "0.6", optional = true }
windows-result = { version = "0.4", optional = true }
windows-sys = { version = "0.61", optional = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", optional = true, features = [
  "Win32_Foundation",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_Storage_FileSystem",
] }
zip = { version = "8", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rust-ini = { version = "0.21", optional = true }
dirs = { version = "7", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
zbus = { version = "5.9", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
tar = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
osakit = { version = "0.3", features = ["full"], optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"], optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSURL",
  "NSArray",
  "NSString",
], optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
swift-rs = { workspace = true, optional = true }
objc2 = { version = "0.6", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = { version = "0.15", optional = true }

[dev-dependencies]
tauri = { workspace = true, features = ["test", "dynamic-acl"] }
tauri-utils = { workspace = true, features = ["build"] }
tempfile = { workspace = true }
toml = { workspace = true }
dunce = { workspace = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
