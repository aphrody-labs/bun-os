[package]
name = "aphrody-tauri-bundler"
version = "1.4.7"
authors = ["George Burton <burtonageo@gmail.com>", "Tauri Programme within The Commons Conservancy"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]
license = "Apache-2.0 OR MIT"
keywords = ["bundle", "cargo", "tauri"]
repository = "https://github.com/aphrody-labs/bun-distribution"
description = "Wrap rust executables in OS-specific app bundles for Tauri"
edition = "2024"
rust-version = "1.95"
exclude = ["CHANGELOG.md", "/target", "rustfmt.toml"]

[dependencies]
tauri-utils = { version = "~1.4.7", path = "../aphrody-tauri-utils", package = "aphrody-tauri-utils", features = [
  "resources",
] }
image = { workspace = true }
flate2 = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
strsim = "0.11"
tar = { workspace = true }
walkdir = { workspace = true }
bytesize = "2"
handlebars = "6"
tempfile = { workspace = true }
log = { workspace = true, features = ["kv"] }
dirs = { workspace = true }
os_pipe = "1"
ureq = { version = "3", default-features = false, features = ["socks-proxy"] }
native-tls = { version = "0.2", optional = true }
hex = { workspace = true }
semver = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
zip = { version = "8", default-features = false, features = ["deflate"] }
dunce = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5"] }
regex = { workspace = true }
plist = "1"
glob = { workspace = true }

[target."cfg(target_os = \"windows\")".dependencies]
bitness = "0.4"
windows-registry = "0.6"

[target."cfg(target_os = \"windows\")".dependencies.windows-sys]
version = "0.61"
features = ["Win32_System_SystemInformation", "Win32_System_Diagnostics_Debug"]

[target."cfg(target_os = \"macos\")".dependencies]
icns = { package = "tauri-icns", version = "0.1" }
time = { workspace = true, features = ["formatting"] }
tauri-macos-sign = { version = "=1.4.7", path = "../aphrody-tauri-macos-sign", package = "aphrody-tauri-macos-sign" }

[target."cfg(target_os = \"linux\")".dependencies]
heck = "0.5"
ar = "0.9"
md5 = "0.8"
# TODO: xz-compression's `lzma` conflicts with apple-codesign's `xz`
# Sequoia preserves OpenPGP signing without rPGP's vulnerable draft ML-DSA dependency.
rpm = { version = "0.30", default-features = false, features = [
  "gzip-compression",
  "payload",
  "signature-sequoia",
  "zstd-compression",
  "bzip2-compression",
] }
xz2 = "0.1"
zstd = "0.13"
bzip2 = "0.4"

[target."cfg(unix)".dependencies]
which = { workspace = true }

[lib]
name = "tauri_bundler"
path = "src/lib.rs"

[features]
default = ["rustls", "platform-certs"]
native-tls = ["ureq/native-tls"]
native-tls-vendored = ["native-tls", "native-tls/vendored"]
rustls = ["ureq/rustls"]
platform-certs = ["ureq/platform-verifier"]

[lints.clippy]
collapsible_if = "allow"
redundant_clone = "warn"
assigning_clones = "warn"
or_fun_call = "warn"

[dev-dependencies]
serial_test = "3.5"
