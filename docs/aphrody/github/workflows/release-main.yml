# SPDX-License-Identifier: Apache-2.0
# Push on main -> gates -> build matrix -> immutable release on downloads.aphrody.com -> hosts updated.
# Publisher and updater are the existing owners (scripts/release/auto-release.sh = downloads:publish on the vps
# factory, `aphrody self update` on the hosts and PCs). Runbook: docs/operations/infra/AUTO-RELEASE.md.
name: release-main

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".coord/**"
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the release and update the hosts (otherwise gates and builds only)
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time; a push during a run queues exactly one newer run, the running one is never cancelled.
concurrency:
  group: release-main
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.3"

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the upstream Bun canary from npm
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm install --global "bun@$BUN_VERSION"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - name: Release scripts and host catalog
        run: bun test scripts/release/auto-release.test.ts scripts/release/publish-downloads.test.ts
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck

  build:
    name: Build ${{ matrix.name }}
    needs: gates
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, bin: target/release/aphrody, optional: false }
          - { name: windows-2025, os: windows-2025, bin: target/release/aphrody.exe, optional: false }
          - { name: windows-11-arm, os: windows-11-arm, bin: target/release/aphrody.exe, optional: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}
      - name: Build aphrody
        shell: bash
        run: cargo build --release --locked -p aphrody --bin aphrody
      - name: Smoke
        shell: bash
        run: |
          "${{ matrix.bin }}" --version
          "${{ matrix.bin }}" self update --help >/dev/null

  wasm:
    name: Build wasm32
    needs: gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-wasm32
      - run: cargo check --locked --target wasm32-unknown-unknown -p aphrody-command --lib

  publish:
    name: Immutable release
    needs: [build, wasm]
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-24.04
    environment: release
    env:
      RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
      RELEASE_KNOWN_HOSTS: ${{ secrets.RELEASE_KNOWN_HOSTS }}
      RELEASE_VPS: ${{ vars.RELEASE_VPS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SSH access to the build factory
        run: |
          if [ -z "$RELEASE_SSH_KEY" ] || [ -z "$RELEASE_KNOWN_HOSTS" ] || [ -z "$RELEASE_VPS" ]; then
            echo "::error::RELEASE_SSH_KEY, RELEASE_KNOWN_HOSTS (secrets) and RELEASE_VPS (variable) must be set"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$RELEASE_SSH_KEY" > ~/.ssh/release
          chmod 600 ~/.ssh/release
          printf '%s\n' "$RELEASE_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Publish the immutable release (build, stage, scan, upload, verify on the factory)
        run: |
          ssh -i ~/.ssh/release -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$RELEASE_VPS" bash -s -- "$GITHUB_SHA" < scripts/release/auto-release.sh
      - name: Public check of latest.json and checksums
        run: |
          curl -fsS https://downloads.aphrody.com/latest.json | jq -e --arg c "$GITHUB_SHA" '.release.commit == $c'
          id="$(curl -fsS https://downloads.aphrody.com/latest.json | jq -r .release.id)"
          curl -fsS "https://downloads.aphrody.com/releases/$id/SHA256SUMS" | awk 'NF == 2 && length($1) == 64 { n++ } END { exit n ? 0 : 1 }'

  deploy:
    name: Update hosts
    needs: publish
    runs-on: ubuntu-24.04
    environment: release
    env:
      RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
      RELEASE_KNOWN_HOSTS: ${{ secrets.RELEASE_KNOWN_HOSTS }}
      RELEASE_VPS: ${{ vars.RELEASE_VPS }}
    steps:
      - name: SSH access
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$RELEASE_SSH_KEY" > ~/.ssh/release
          chmod 600 ~/.ssh/release
          printf '%s\n' "$RELEASE_KNOWN_HOSTS" > ~/.ssh/known_hosts
      # The timers (aphrody-self-update*, scheduled task on the PCs) converge on their own; this step only makes
      # the declared hosts converge now. A failed update rolls back on the host and fails this job.
      - name: vps and dbfr (aphrody self update, rollback on failure)
        run: |
          ssh_vps() { ssh -i ~/.ssh/release -o IdentitiesOnly=yes -o BatchMode=yes "$RELEASE_VPS" "$@"; }
          ssh_vps '$HOME/.local/bin/aphrody self update'
          ssh_vps 'ssh -o BatchMode=yes dbfr "\$HOME/.local/bin/aphrody self update"'
          ssh_vps '$HOME/.local/bin/aphrody --version'
