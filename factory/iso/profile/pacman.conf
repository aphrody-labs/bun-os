# Bun OS pacman configuration: used to build the live image (mkarchiso) and installed as the live system's
# /etc/pacman.conf. [bunos-testing] comes first, like Arch's testing repositories, and is signed by the Store key
# (aphrody-store, fingerprint in ../build.sh); SigLevel Required covers its database and packages.
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[bunos-testing]
SigLevel = Required
Server = https://aphrody.com/repo/bunos-testing/$arch

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
