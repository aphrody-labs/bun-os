# /etc/wsl-distribution.conf (Learn: build-custom-distro). The user `bun` (uid 1000) is created at build time,
# so no oobe.command is needed. Needs WSL >= 2.4.4 for `wsl --install --from-file` and double-click of the .wsl file.
[oobe]
defaultUid = 1000
defaultName = bunos

[shortcut]
enabled = true
icon = /usr/lib/wsl/bunos.ico

[windowsterminal]
enabled = true
