# /etc/wsl.conf for the Bun OS WSL distro (microsoft/WSL, docs: learn.microsoft.com/windows/wsl/wsl-config)
[boot]
systemd=true

[user]
default=bun

[interop]
enabled=true
appendWindowsPath=false

[automount]
enabled=true
root=/mnt/
options="metadata,umask=022,fmask=011"

[network]
generateHosts=true
generateResolvConf=true
hostname=bunos
