# RetroArch defaults of the Gamescope Gaming session: Vulkan presents through gamescope on software and hardware
# Vulkan alike (the GL path through Xwayland stays black on lavapipe), Ozone menu, PipeWire audio, udev pads.
video_driver = "vulkan"
video_fullscreen = "true"
menu_driver = "ozone"
audio_driver = "pipewire"
input_joypad_driver = "udev"
pause_nonactive = "false"
