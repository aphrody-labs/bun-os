# Bun OS system tuning. Values follow CachyOS/CachyOS-Settings usr/lib/sysctl.d/70-cachyos-settings.conf
# (HEAD f79b237defab, 2026-10-22). Left out on purpose: kernel.unprivileged_userns_clone (not a mainline
# sysctl) and kernel.sysrq=1 (a policy choice Bun OS has not made).
vm.swappiness = 100
vm.vfs_cache_pressure = 50
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.dirty_writeback_centisecs = 1500
vm.page-cluster = 0
kernel.nmi_watchdog = 0
kernel.printk = 3 3 3 3
kernel.kptr_restrict = 2
net.core.netdev_max_backlog = 4096
fs.file-max = 2097152
