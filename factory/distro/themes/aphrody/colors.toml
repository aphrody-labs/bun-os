# Aphrody theme: the default Bun OS theme (COSMIC session, Omarchy theme system).
# Keys follow Omarchy's canonical colors.toml (basecamp/omarchy docs/theming.md, quattro 51bfd1d).
# Values are the WebOS "Aphrody" Material 3 dark roles (apps/webos/src/themes.ts, seed #4c62d9):
# surface #11131d, surface-container-lowest #0c0e17, surface-container #1b1e2b, on-surface #e1e3f2,
# on-surface-variant #a9aec8, outline #6d7393, outline-variant #353a50, primary #a9b8ff,
# primary-container #2e3f95, tertiary #7fd6c6. The COSMIC theme (cosmic.ron here, = ThemeBuilder::dark() of
# the aphrody-labs/libcosmic fork) carries the same values.
mode = "dark"

accent = "#a9b8ff"
tertiary = "#7fd6c6"
selection = "#2e3f95"
muted = "#353a50"
outline = "#6d7393"
cursor = "#a9b8ff"

background = "#11131d"
dark_background = "#0c0e17"
darker_background = "#080a11"
lighter_background = "#1b1e2b"
highest_background = "#2c3142"

foreground = "#e1e3f2"
dark_foreground = "#a9aec8"
light_foreground = "#eceefa"
bright_foreground = "#f7f8ff"

selection_foreground = "#e1e3f2"
selection_background = "#2e3f95"

