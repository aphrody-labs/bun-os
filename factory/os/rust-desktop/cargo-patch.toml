# SPDX-License-Identifier: MIT
# Bun OS shared Rust desktop crates: the ONE [patch] table read by every consumer.
#   - Linux COSMIC session builds:  cargo build --config factory/os/rust-desktop/cargo-patch.toml
#   - Redox cookbook (aphrody-labs/redox branch bunos): `bun factory/os/rust-desktop.ts redox` copies this file to
#     <redox>/bunos/cargo-patch.toml and cookbook_cargo passes it with --config.
#   - Root workspace (aphrody-chat, aphrody-search, aphrody-webos-client) depends on aphrody-labs/libcosmic at the same rev;
#     `bun factory/os/rust-desktop.ts check` fails when a root pin drifts from this table.
# Every entry redirects an upstream pop-os git source to the single aphrody-labs fork at a pinned commit.
# Upstream licences (MPL-2.0 libcosmic, MIT/Apache-2.0 iced/winit/softbuffer, GPL-3.0 COSMIC apps) stay in the forks.

