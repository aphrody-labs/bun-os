[project]
name = "aphrody-py-workspace"
version = "0.1.0"
description = "Unified Aphrody Python projects and tools"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
required-version = ">=0.12.24"
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/aphrody", "packages/aphrody-train", "packages/embedding-fixtures", "packages/model-tools", "packages/cli", "apps/meetings"]

[tool.pytest.ini_options]
testpaths = ["packages/aphrody/tests", "packages/aphrody-train/tests", "packages/embedding-fixtures/tests", "packages/model-tools/tests", "tools/packaging", "packages/cli/tests", "apps/meetings/tests"]
pythonpath = ["packages/aphrody/src", "packages/aphrody-train/src", "packages/model-tools/src", "packages/embedding-fixtures/src", "packages/cli/src", "apps/meetings/src"]
addopts = "-q --strict-markers --import-mode=importlib"
markers = ["integration: opt-in tests requiring runtimes, models or services", "live_api: opt-in authenticated provider requests"]
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "var", "target"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["tools/ui", "vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"**/resources/blender/**" = ["E402"]
"**/blender_addon/**" = ["E402"]
"tools/ai/scripts/*.py" = ["E402"]
"packages/aphrody/scripts/*.py" = ["E402"]
"**/tests/**" = ["B018"]

[tool.ruff.lint.isort]
known-first-party = ["aphrody", "aphrody_train", "aphrody_cli", "aphrody_meetings", "koharu_model_tools", "aphrody_embedding_fixtures"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["packages/aphrody/src", "packages/aphrody-train/src", "packages/cli/src", "packages/model-tools/src", "packages/embedding-fixtures/src", "apps/meetings/src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
show_error_codes = true
explicit_package_bases = true
mypy_path = ["packages/aphrody/src", "packages/aphrody-train/src", "packages/cli/src", "packages/model-tools/src", "packages/embedding-fixtures/src", "apps/meetings/src"]

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.23", "pytest-httpx>=0.35", "ruff>=0.16", "mypy>=1.19,<2"]
