# Generated by `bun infra/fleet/api.ts render` from infra/fleet/api.toml. Do not edit on the host.
map $http_upgrade $fleet_connection_upgrade {
    default upgrade;
    '' close;
}

map $http_origin $fleet_api_origin {
    default "";
    "https://aphrody.com" $http_origin;
    "https://www.aphrody.com" $http_origin;
    "https://aphrody.app" $http_origin;
    "https://store.aphrody.com" $http_origin;
    "https://downloads.aphrody.com" $http_origin;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.aphrody.com;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.aphrody.com;
    ssl_certificate /etc/letsencrypt/live/api.aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aphrody.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=63072000" always;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location = /v1/health {
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    location = /v1/ {
        default_type application/json;
        return 200 '{"services":[{"name":"a2a","base":"/v1/a2a/","description":"Agent-to-agent hub"},{"name":"bunos","base":"/v1/bunos/","description":"Bun OS server (product API)"},{"name":"chat","base":"/v1/chat/","description":"Aphrody Chat gateway"},{"name":"downloads","base":"/v1/downloads/","description":"Downloads and release artifacts"},{"name":"fonts","base":"/v1/fonts/","description":"Fonts proxy"},{"name":"site","base":"/v1/site/","description":"aphrody.com site backend"},{"name":"store","base":"/v1/store/","description":"Bun OS Store API (apt, pacman, flatpak, F-Droid, bun, cargo feeds)"},{"name":"webos","base":"/v1/webos/","description":"WebOS server (session API and stream)"}]}';
    }

    # Agent-to-agent hub (vps:8788)
    location /v1/a2a/ {
        proxy_pass http://10.200.77.1:8080/v1/a2a/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fleet_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $http_traceparent;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header Access-Control-Allow-Origin $fleet_api_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Vary Origin always;
    }

    # Bun OS server (product API) (vps:29030)
    location /v1/bunos/ {
        proxy_pass http://10.200.77.1:8080/v1/bunos/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fleet_connection_upgrade;
        proxy_set_header Host $host;
