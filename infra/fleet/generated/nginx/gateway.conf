# Generated by `bun infra/fleet/api.ts render` from infra/fleet/api.toml. Do not edit on the host.
map $http_upgrade $fleet_connection_upgrade {
    default upgrade;
    '' close;
}

map $http_origin $fleet_api_origin {
    default "";
    "https://aphrody.com" $http_origin;
    "https://www.aphrody.com" $http_origin;
    "https://aphrody.app" $http_origin;
    "https://store.aphrody.com" $http_origin;
    "https://downloads.aphrody.com" $http_origin;
    "https://cdn.aphrody.com" $http_origin;
    "https://api.aphrody.com" $http_origin;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.aphrody.com;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.aphrody.com;
    ssl_certificate /etc/letsencrypt/live/api.aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aphrody.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=63072000" always;
    set $fleet_api_service "";
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location = /v1/health {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 200 '{"status":"ok","service":"gateway","version":"1"}';
    }

    # API catalogue (docs/generated/openapi, written by scripts/service-map.ts and installed by `api.ts apply`):
    # /v1/ the index, /v1/openapi.json the merged document, /v1/openapi/<service>.json the committed documents.
    location = /v1/ {
        rewrite ^ /v1/openapi/index.json last;
    }

    location = /v1/openapi.json {
        alias /var/www/aphrody-api/openapi.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=60" always;
    }

    location /v1/openapi/ {
        alias /var/www/aphrody-api/;
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=60" always;
    }

    # Agent-to-agent hub (vps:8788/)
    location /v1/a2a/ {
        set $fleet_api_service a2a;
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fleet_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /v1/$fleet_api_service;
        proxy_set_header traceparent $http_traceparent;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        add_header Access-Control-Allow-Origin $fleet_api_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Expose-Headers "Content-Type, Retry-After, traceparent" always;
        add_header Vary Origin always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $fleet_api_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, traceparent, Last-Event-ID" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary Origin always;
            return 204;
        }
    }

    # Bun OS server (product API) (vps:29030/api/v1/)
