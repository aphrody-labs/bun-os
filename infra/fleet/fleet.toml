os = "ubuntu-26.10"
roles = ["bunos-prod"]
user = "ubuntu"
mesh_ip = "10.200.77.3"
public_ipv4 = "51.255.162.6"
public_ipv6 = "2001:41d0:305:2100::a461"
public_interface = "ens3"
cpus = 6
memory_gib = 11
host_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHYR3pwug0v845mC0RZLveKK7ZG5QzqQcRtExNwTniOl"
public_tcp = [22, 80, 443]
public_udp = [443, 45667]

[hosts.prod]
description = "Shenron (dragonballfr.com), fully migrated here, behind Cloudflare"
provider = "Hostinger"
os = "arch"
roles = ["shenron-prod"]
user = "root"
mesh_ip = "10.200.77.5"
public_ipv4 = "72.60.186.43"
public_ipv6 = "2a02:4780:28:8e1e::1"
public_interface = "eth0"
cpus = 8
memory_gib = 31
host_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIARirhBJIljCJ/n/b7+3hZKOBI+MZ5W6qJtHT4BgDbQs"
public_tcp = [22, 80, 443]
# 51821: wg `prod` (10.200.78.0/30); 52244: wg `vps` (mesh link to the hub).
public_udp = [51821, 52244]

