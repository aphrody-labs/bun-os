# Bun OS fleet: the single source of truth for hosts, their roles, the private mesh, SSH access and the host firewall.
#
# Everything else is derived from this file by `bun infra/fleet/fleet.ts` (see docs/ops/FLEET.md):
#   ssh-config   the workstation SSH client config and pinned known_hosts (infra/fleet/generated/)
#   firewall     the nftables ruleset of one host (table `inet fleet`, applied by fleet-firewall.service)
#   audit        a read-only probe comparing each host with this file
#
# Rules (owner order 2026-11-03):
# - Every host is reached over the WireGuard mesh by its short name. `<name>-public` is the recovery path only.
# - Host keys are pinned here and checked strictly; a host key change is a reviewed commit, never accept-new.
# - Only the public interface is filtered. The mesh, loopback and container bridges are trusted.
# - Services listen on loopback or the mesh. Public traffic enters through nginx (80/443) or Cloudflare tunnels only.

schema = 1

[mesh]
name = "aphrody-private"
interface = "wg1"
cidr = "10.200.77.0/24"
hub = "vps"
keepalive = 25

[ssh]
identity = "~/.ssh/id_ed25519_aphrody"
known_hosts = "infra/fleet/generated/known_hosts"
server_alive_interval = 15
server_alive_count_max = 3
connect_timeout = 15
# Multiplex interactive and scripted sessions; one TCP+WireGuard handshake per host per 10 minutes.
control_persist = "10m"

# ---------------------------------------------------------------------------------------------------------------------
# Servers
# ---------------------------------------------------------------------------------------------------------------------

[hosts.vps]
description = "Build, qualification and release factory; mesh hub"
provider = "OVH"
os = "ubuntu-26.10"
roles = ["mesh-hub", "build", "qualification", "release"]
user = "ubuntu"
mesh_ip = "10.200.77.1"
public_ipv4 = "51.77.147.152"
public_ipv6 = "2001:41d0:404:200::4d8e"
public_interface = "ens3"
cpus = 12
memory_gib = 45
host_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINPa730pnwLsaHzUJ7T2IErtqGyBgH6gNGdsHNC4h02O"
checkout = "~/src/bun-os"
public_tcp = [22, 80, 443]
public_udp = [443, 51821]

[hosts.bunos]
