# Public Bun OS API (docs/ops/API.md): one entry, api.aphrody.com on the single Bun OS host (vps), routed by /v1/<service>/.
# `bun infra/fleet/api.ts render` writes the nginx site; `apply` installs it with the API catalogue
# (docs/generated/openapi, written by `bun scripts/service-map.ts`); `deploy <service>` releases one service.
#
# A service runs on `host` and listens on loopback `port`. `upstream` is the path the service mounts its public base
# at (default "/"): https://api.aphrody.com/v1/<service>/<path> reaches 127.0.0.1:<port><upstream><path>, so every
# service answers <upstream>openapi.json and <upstream>health (docs/ops/API.md). When `host` is not the gateway host,
# the gateway forwards over the WireGuard mesh to that host's mesh listener (`mesh_port`), which proxies to loopback.
#
# `source` is the member that implements the service; `openapi` is where its OpenAPI document comes from: a Bun
# module export (`<file>#<export>`, an `Api` of packages/bun-os-platform/src/api) or `cargo` (the Rust route table,
# kept in docs/generated/openapi/<service>.json by the crate's `openapi_snapshot_is_current` test).
#
# [services.<name>.deploy] is the release recipe of `api.ts deploy` (built from origin/main on the gateway host,
# installed, restarted, gated on <upstream>health reporting the commit, rolled back on failure):
#   kind = "bun"      bun build --target bun of `entry` into `install` (APHRODY_COMMIT defined at build time)
#   kind = "cargo"    cargo build --release of `package`/`bin` through the lane wrapper, binary installed at `install`
#   kind = "command"  `command` builds and activates by itself (its own health gate); the deploy waits for the commit
# `unit_file` (optional) is installed from origin/main before the restart and restored on rollback.

schema = 1
domain = "api.aphrody.com"
gateway = "vps"
mesh_port = 8080
# Origins allowed to call the API from a browser (CORS); no wildcard on authenticated routes. The gateway is the only
# CORS authority: upstream Access-Control-* headers are dropped.
origins = ["https://aphrody.com", "https://www.aphrody.com", "https://aphrody.app", "https://store.aphrody.com", "https://downloads.aphrody.com", "https://cdn.aphrody.com", "https://api.aphrody.com"]
# Gateway-served catalogue (index, merged document, per-service snapshots) on the gateway host.
catalogue_root = "/var/www/aphrody-api"

[services.site]
description = "aphrody.com site backend: documentation, templates, search, M3 design reference"
host = "vps"
port = 8083
upstream = "/api/"
source = "crates/aphrody-site"
openapi = "cargo"
unit = "aphrody-site.service"
[services.site.deploy]
kind = "cargo"
package = "aphrody-site"
bin = "aphrody-site"
install = "~/apps/aphrody/current/bin/aphrody-site"

[services.store]
description = "Bun OS Store API (catalog, qualification, per-format indexes, winget REST source)"
host = "vps"
port = 8791
upstream = "/api/store/"
source = "apps/webos"
openapi = "apps/webos/store/api.ts#storeSpec"
unit = "aphrody-store.service"
[services.store.deploy]
kind = "bun"
entry = "apps/webos/store/serve.ts"
install = "~/apps/store/serve.js"
unit_file = "infra/config/host/systemd/aphrody/aphrody-store.service"

[services.downloads]
description = "Downloads and release artifacts"
host = "vps"
port = 8797
source = "packages/product"
openapi = "packages/product/src/downloads/server.ts#downloadsSpec"
unit = "aphrody-downloads.service"
[services.downloads.deploy]
kind = "bun"
entry = "packages/product/src/downloads/server.ts"
install = "~/apps/downloads/app/server.ts"

[services.chat]
description = "Aphrody Chat gateway (OpenAI-compatible, Vertex AI Gemini)"
host = "vps"
port = 8794
realtime = true
source = "apps/webos"
openapi = "apps/webos/services/chat-api.ts#chatSpec"
unit = "aphrody-chat-gateway.service"
[services.chat.deploy]
kind = "bun"
entry = "apps/webos/services/chat.ts"
install = "~/apps/chat/chat.ts"

[services.a2a]
description = "Agent-to-agent hub"
host = "vps"
port = 8788
realtime = true
source = "crates/aphrody-a2a-coord"
openapi = "cargo"
unit = "aphrody-a2a.service"
[services.a2a.deploy]
kind = "cargo"
package = "aphrody"
bin = "aphrody"
install = "~/.local/share/aphrody/bin/aphrody"

[services.bunos]
description = "Bun OS server (product API)"
host = "vps"
port = 29030
upstream = "/api/v1/"
source = "packages/bun-app-host"
openapi = "packages/bun-app-host/src/product.ts#productSpec"
unit = "aphrody-bun-os-server.service"
[services.bunos.deploy]
kind = "command"
command = "bun packages/bun-app-host/src/build.ts build . {out}"
install = "~/src/bun-os/install/bin/bun-os-server"

[services.fonts]
description = "Fonts proxy and asset CDN"
host = "vps"
port = 8796
source = "packages/google"
openapi = "packages/google/src/fonts-proxy.ts#fontsSpec"
unit = "aphrody-fonts-proxy.service"
[services.fonts.deploy]
kind = "bun"
entry = "packages/google/src/fonts-serve.ts"
install = "~/apps/cdn/src/fonts-serve.js"

[services.webos]
description = "WebOS server (sessions, stream, emulators, inventory)"
host = "vps"
port = 8790
upstream = "/api/"
realtime = true
source = "crates/aphrody-webos-server"
openapi = "cargo"
unit = "aphrody-webos.service"
[services.webos.deploy]
kind = "command"
command = "crates/aphrody-webos-server/release.sh"
