# Bun OS VPS module options (infra/config/host/vps/tuning).
options kvm_intel nested=1
# Windows and macOS guests probe MSRs the host does not emulate.
options kvm ignore_msrs=1 report_ignored_msrs=0
# The Cirrus VGA must stay /dev/dri/card0 (Hyprland/Aquamarine opens it); vkms registers after it.
softdep vkms pre: cirrus_qemu
