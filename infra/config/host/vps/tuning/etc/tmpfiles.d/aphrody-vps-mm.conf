# Bun OS VPS memory management (infra/config/host/vps/tuning), applied at boot by systemd-tmpfiles.
# THP only where requested (QEMU, JVM, allocators), compaction deferred to khugepaged.
w /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
w /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
w /sys/kernel/mm/transparent_hugepage/shmem_enabled - - - - advise
# KSM merges identical pages of similar VMs (QEMU marks guest RAM MADV_MERGEABLE); the advisor
# adapts the scan rate to a 200 s full-scan target and at most 30 % of one CPU.
w /sys/kernel/mm/ksm/use_zero_pages - - - - 1
w /sys/kernel/mm/ksm/advisor_max_cpu - - - - 30
w /sys/kernel/mm/ksm/advisor_target_scan_time - - - - 200
w /sys/kernel/mm/ksm/advisor_mode - - - - scan-time
w /sys/kernel/mm/ksm/run - - - - 1
