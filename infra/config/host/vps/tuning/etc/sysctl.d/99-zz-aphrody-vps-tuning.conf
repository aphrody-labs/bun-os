# SPDX-License-Identifier: Apache-2.0
# Bun OS VPS low-level tuning (infra/config/host/vps/tuning, docs/VPS-TUNING.md).
# Sorts after every other /etc/sysctl.d file, so these values win over the older overlapping
# files (90-aphrody-bun, 90-vps, 95-aphrody-tune, 95-aphrody-vps-build, 99-stable-build).
# Security sysctls (90-vps-security: unprivileged_bpf_disabled, bpf_jit_harden, ...) are not touched.

# Network: BBR + fq pacing, deep accept queues, buffers for HTTP/2, QUIC and WebRTC.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 65536
net.ipv4.tcp_max_syn_backlog = 65535
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.core.rmem_default = 524288
net.core.wmem_default = 524288
net.core.optmem_max = 65536
net.ipv4.tcp_rmem = 4096 131072 33554432
net.ipv4.tcp_wmem = 4096 65536 33554432
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_notsent_lowat = 131072
net.ipv4.tcp_mtu_probing = 1
net.ipv4.ip_local_port_range = 10240 65535

# Memory: zram (zstd, priority 100) is the first swap tier, so swap eagerly and read one page.
vm.swappiness = 100
vm.page-cluster = 0
vm.vfs_cache_pressure = 50
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
vm.overcommit_memory = 1
# SteamOS value; a superset of the 1048576 Android and games need.
vm.max_map_count = 2147483642
# 1 GiB reserved 2 MiB pool for hugetlbfs-backed VMs, up to 16 GiB more allocated on demand.
vm.nr_hugepages = 512
vm.nr_overcommit_hugepages = 8192

# Files and watchers: builds, IDE servers, Docker and nginx at 65535 connections per worker.
fs.file-max = 4194304
fs.nr_open = 4194304
fs.aio-max-nr = 1048576
fs.inotify.max_user_watches = 2097152
fs.inotify.max_user_instances = 8192
fs.inotify.max_queued_events = 65536
kernel.pid_max = 4194304
