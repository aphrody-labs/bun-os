# SPDX-License-Identifier: Apache-2.0
# The VPS journal lives in memory only: nothing is written to the shared disk (builds and agents log heavily).
# A small ring buffer stays for live debugging (journalctl) and the health loop; it is empty after a reboot.
[Journal]
Storage=volatile
RuntimeMaxUse=100M
RuntimeMaxFileSize=16M
MaxRetentionSec=1day
ForwardToSyslog=no
