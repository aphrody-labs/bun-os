# play.aphrody.app - Bun OS NGINX engine owned by bun:nginx (template).
#
# Engine: pinned vendor/nginx 1.31.6 + vendor/ngx-rust with the Bun Rust module (ngx_http_bun_module),
# built by packages/bun-nginx/scripts/build-provider.ts of the abandoned fork (legacy; upstream Bun has no bun:nginx) and installed in the prefix
# ~/apps/play/nginx/sbin/nginx. apps/play/src/server/nginx.ts renders ${...} placeholders into
# <prefix>/conf/nginx.conf, then `Nginx.create` -> validate -> start; SIGHUP -> validate -> reload;
# stop -> quit. No `daemon` or `pid` directive: bun:nginx runs the master in the foreground and
# owns <prefix>/bun-nginx.pid.
#
# Listeners (no privileged port, no public address):
#   ${LISTEN_LOOPBACK}  the site, reached only from the distro NGINX TLS front (play.aphrody.app.conf)
#   ${LISTEN_TUNNEL}    the Aphrody mesh (wg1): sign-in bridge /auth/tunnel, redirects the rest
#   127.0.0.1:${INFO_PORT}  bun_nginx module metadata for readModuleInfo()
#
# Built-in modules only (http, ssl, v2, v3, gzip, proxy, map, geo, limit_req/limit_conn, headers):
# no realip in this build, so the client address comes from X-Real-IP set by the TLS front on
# loopback and from the socket on the mesh listener.

worker_processes 2;
worker_shutdown_timeout 10s;
error_log ${PREFIX}/logs/error.log warn;

events {
    worker_connections 1024;
}

http {
    include ${PREFIX}/conf/mime.types;
    types {
        text/javascript mjs;
        application/manifest+json webmanifest;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css text/javascript application/json application/manifest+json image/svg+xml;
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    client_max_body_size 1m;
    reset_timedout_connection on;

    client_body_temp_path ${PREFIX}/temp/client_body;
    proxy_temp_path ${PREFIX}/temp/proxy;
    fastcgi_temp_path ${PREFIX}/temp/fastcgi;
    uwsgi_temp_path ${PREFIX}/temp/uwsgi;
    scgi_temp_path ${PREFIX}/temp/scgi;

    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_errors on;

    # Client address: the TLS front sets X-Real-IP (Cloudflare real IP) on loopback.
    map $server_addr $play_client {
        127.0.0.1 $http_x_real_ip;
        default   $remote_addr;
    }
    # The canonical Aphrody mesh identity (shared/source-tunnel-auth.conf), on the socket peer.
    geo $remote_addr $aphrody_tunnel_user {
        default "";
        10.200.77.0/24 aphrody-dev;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    log_format play '$play_client [$time_local] "$request" $status $body_bytes_sent '
                    '$request_time "$http_user_agent" $upstream_response_time';
    access_log ${PREFIX}/logs/access.log play buffer=32k flush=5s;

    limit_req_zone $play_client zone=play_auth:10m rate=12r/m;
    limit_req_zone $play_client zone=play_api:10m rate=30r/s;
    limit_conn_zone $play_client zone=play_ws:10m;
    limit_req_status 429;
    limit_conn_status 429;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json
               application/wasm image/svg+xml text/plain;

    upstream play_app {
        server ${APP_UPSTREAM};
        keepalive 16;
    }

    # Response headers of every location (add_header_inherit merge keeps them when a location adds
    # its own Cache-Control). COOP + COEP make the page cross-origin isolated for wasm threads and
    # SharedArrayBuffer; credentialless lets Steam capsule images load without CORP.
    add_header_inherit merge;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "gamepad=(self), fullscreen=(self), autoplay=(self), camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://shared.cloudflare.steamstatic.com https://cdn.cloudflare.steamstatic.com https://steamcdn-a.akamaihd.net; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $play_client;
    proxy_set_header X-Forwarded-For $play_client;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;

    # The site, behind the distro NGINX TLS front.
    server {
        listen ${LISTEN_LOOPBACK} default_server;
        server_name play.aphrody.app;
        root ${PUBLIC_ROOT};
        # Only the engine may assert a mesh identity; nothing on this listener is on the mesh.
        proxy_set_header X-Aphrody-Tunnel-User "";

        location = /index.html {
            add_header Cache-Control "no-cache";
        }
        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache";
        }
        # Content-hashed client bundle (Bun.build naming [name]-[hash]).
        location ^~ /assets/ {
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        # Freely redistributable ROMs, named by MD5.
        location ^~ /roms/ {
            access_log off;
            default_type application/octet-stream;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        # Web emulation cores (dist/web-emulation/<core>/{*.wasm,*.js,manifest.json}).
        # Manifests are revalidated; the versioned wasm/js they reference are immutable.
        location ~ ^/emulation/([A-Za-z0-9._-]+/manifest\.json)$ {
            alias ${EMULATION_ROOT}/$1;
            add_header Cache-Control "no-cache";
        }
        location /emulation/ {
            alias ${EMULATION_ROOT}/;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location = /catalog.json {
            add_header Cache-Control "no-cache";
        }
        # Steam library art, transcoded and disk-cached by the Bun server (immutable responses).
        location /art/ {
            limit_req zone=play_api burst=120 nodelay;
            proxy_pass http://play_app;
        }
        location /api/ {
            limit_req zone=play_api burst=60 nodelay;
            proxy_pass http://play_app;
        }
        # Signed-in owned-dump uploads: resumable 8 MiB chunks, streamed to the app unbuffered.
        location ^~ /api/owned/upload/ {
            limit_req zone=play_api burst=60 nodelay;
            client_max_body_size 16m;
            client_body_timeout 120s;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_pass http://play_app;
        }
        location /auth/ {
            limit_req zone=play_auth burst=6 nodelay;
            proxy_pass http://play_app;
        }
        location = /healthz {
            access_log off;
            proxy_pass http://play_app;
        }
        # Realtime pub/sub and gamestream signalling; unbuffered, long-lived.
        location = /ws {
            limit_conn play_ws 8;
            limit_req zone=play_api burst=20 nodelay;
            proxy_pass http://play_app;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # Aphrody mesh (wg1): proves the tunnel identity, then returns to the public origin.
    server {
        listen ${LISTEN_TUNNEL};
        server_name _;
        allow 10.200.77.0/24;
        deny all;

        location = /auth/tunnel {
            limit_req zone=play_auth burst=6 nodelay;
            proxy_set_header X-Aphrody-Tunnel-User $aphrody_tunnel_user;
            proxy_pass http://play_app;
        }
        location / {
            return 302 ${PUBLIC_ORIGIN}$request_uri;
        }
    }

    # Bun Rust module metadata for readModuleInfo() (loopback only).
    server {
        listen 127.0.0.1:${INFO_PORT};
        server_name _;
        access_log off;
        allow 127.0.0.1;
        deny all;

        location = /_bun/info {
            bun_nginx;
        }
        location / {
            return 404;
        }
    }
}
