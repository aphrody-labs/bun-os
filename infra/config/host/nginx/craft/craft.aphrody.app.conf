# SPDX-License-Identifier: Apache-2.0
# craft.aphrody.app - static browser builds of the Craft apps (apps/*craft-web), one path per app:
# /art/ /cad/ /deck/ /design/ /effect/ /fig/ /film/ /grid/ /light/ /pdf/ /photo/ /sound/ /vector/ /word/
# at /. Output of scripts/aphrody/tools/infra/deploy-craft-frontends.ts in ~/apps/craft-web/current.
#
# DNS: Cloudflare zone aphrody.app, A craft -> vps public address, proxied.
# TLS: Let's Encrypt `craft.aphrody.app` (certbot dns-cloudflare, /etc/letsencrypt/cloudflare.ini,
# ECDSA), same approach as play.aphrody.app. cloudflare-realip.conf (conf.d) restores the client address.
#
# Install:
#   sudo install -m 644 nginx/craft/craft.aphrody.app.conf /etc/nginx/conf.d/craft.aphrody.app.conf
#   sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=craft_edge:10m rate=50r/s;

# Plain WASM and glue names revalidate on every load. Content-addressed artifacts
# from earlier releases retain their immutable contract.
map $uri $craft_cache {
    default "no-cache";
    "~^/[a-z]+/.+-[0-9a-f]{8}\.(?:js|wasm)$" "public, max-age=31536000, immutable";
}
map $uri $craft_isolation {
    default "";
    "~^/(?:light|film|effect)/" "same-origin";
}
map $uri $craft_isolation_embedder {
    default "";
    "~^/(?:light|film|effect)/" "require-corp";
}

server {
    listen 80;
    listen [::]:80;
    server_name craft.aphrody.app;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # reuseport is already claimed by play.aphrody.app (one QUIC socket group per host).
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name craft.aphrody.app;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/craft.aphrody.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/craft.aphrody.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:craft_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_early_data off;

    # One header set for every response (a location-level add_header would drop the inherited ones).
    # Empty map values make add_header skip the header.
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $craft_cache always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    # LightCraft renders in worker threads and needs a cross-origin isolated page.
    add_header Cross-Origin-Opener-Policy $craft_isolation always;
    add_header Cross-Origin-Embedder-Policy $craft_isolation_embedder always;

    root /home/ubuntu/apps/craft-web/current;
    index index.html;
    client_max_body_size 1k;
    limit_req zone=craft_edge burst=100 nodelay;
    limit_req_status 429;

    location = /art { return 308 /art/; }
    location /art/ {
        try_files $uri $uri/ /art/index.html;
    }

    # Each app is a directory with its own index.html; /cad redirects to /cad/. No SPA fallback:
    # every app is a single document, an unknown path is a 404.
    location / {
        try_files $uri $uri/ =404;
    }
}
