# Reserved hosts: DNS points here but no backend is deployed (# mcp: aphrody-mcp-http is a privileged loopback API, never exposed without an auth gateway; nie, admin: no service).
# HTTPS is valid and answers 410 JSON until a service is declared in routes.json and gets its own vhost file.
# TLS: Let's Encrypt webroot, certificate /etc/letsencrypt/live/aphrody.com (SAN covers every aphrody.com host).
# Installed on the vps host nginx as /etc/nginx/conf.d/reserved.aphrody.com.conf. Rollback: remove that file, `nginx -t`, reload.
server {
    listen 80;
    listen [::]:80;
    server_name bot.aphrody.com mcp.aphrody.com nie.aphrody.com admin.aphrody.com;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bot.aphrody.com mcp.aphrody.com nie.aphrody.com admin.aphrody.com;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:aphrody_tls:10m;
    ssl_session_timeout 1d;

    access_log off;
    default_type application/json;

    location / {
        add_header Cache-Control "no-store";
        include snippets/aphrody-security.inc;
        return 410 '{"status":"reserved","host":"$host"}';
    }
}
