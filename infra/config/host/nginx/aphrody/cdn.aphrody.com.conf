#
# cdn.aphrody.com: the Aphrody CDN origin, served by aphrody-fonts-proxy (127.0.0.1:8796, Bun; unit
# infra/config/host/systemd/aphrody/aphrody-fonts-proxy.service):
#   /css2 /css /icon      fonts.googleapis.com CSS APIs (M3 families and Material Symbols)
#   /s/<id>/v<N>/<file>   fonts.gstatic.com font files (immutable)
#   /h/<sha16>.<ext>      asset CDN release tree (tools/aphrody/config/asset-catalog.json, `bun scripts/aphrody/tools/infra/cdn.ts publish --vps vps`)
#   /s/<scope>/<path>     same tree, stable URLs; /s/manifest.json lists every file
#   /status/manga-source-pool.json sanitized live worker progress, one public file only
# nginx adds TLS, a shared response cache keyed per encoding and request limits on the CSS APIs. The VPS nginx
# build has no headers-more module and the host serves no QUIC sockets, so neither is used here.
# TLS: Let's Encrypt webroot, certificate /etc/letsencrypt/live/aphrody.com.
# Needs: sudo install -d -o www-data -g www-data /var/cache/nginx/aphrody-cdn
# Installed on the vps host nginx as /etc/nginx/conf.d/cdn.aphrody.com.conf (Cloudflare proxies cdn -> vps).
# Rollback: remove that file, `nginx -t`, reload.

proxy_cache_path /var/cache/nginx/aphrody-cdn levels=1:2 keys_zone=aphrody_cdn:32m max_size=4g inactive=30d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=aphrody_cdn_css:10m rate=30r/s;

upstream aphrody_fonts_proxy {
    server 127.0.0.1:8796;
    keepalive 32;
}

# The proxy only distinguishes brotli from identity: one cache entry per variant.
map $http_accept_encoding $aphrody_cdn_encoding {
    "~*\bbr\b"  br;
    default     "";
}

server {
    listen 80;
    listen [::]:80;
    server_name cdn.aphrody.com;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cdn.aphrody.com;

    ssl_certificate /etc/letsencrypt/live/aphrody-webos-vps/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody-webos-vps/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:aphrody_tls:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    access_log off;

    # The public status location repeats HSTS because its own headers override inheritance.
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Cache $upstream_cache_status always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Accept-Encoding $aphrody_cdn_encoding;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    proxy_cache aphrody_cdn;
    proxy_cache_key "$uri$is_args$args|$aphrody_cdn_encoding";
    proxy_cache_lock on;
    proxy_cache_lock_timeout 15s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_revalidate on;
    proxy_cache_valid 403 404 1m;
    proxy_ignore_headers Set-Cookie;

    limit_req_status 429;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /health {
        proxy_cache off;
        proxy_pass http://aphrody_fonts_proxy;
    }

    location = /status/manga-source-pool.json {
        alias /var/www/aphrody-status/manga-source-pool.json;
        default_type application/json;
        etag off;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        limit_except GET HEAD { deny all; }
    }

    location ~ ^/(css2?|icon)$ {
        limit_req zone=aphrody_cdn_css burst=60 nodelay;
        limit_except GET HEAD { deny all; }
        proxy_pass http://aphrody_fonts_proxy;
    }

    location ^~ /s/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://aphrody_fonts_proxy;
    }

    location ^~ /h/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://aphrody_fonts_proxy;
    }

    location / {
        return 404;
    }
}
