# SPDX-License-Identifier: Apache-2.0
#
# creator.aphrody.com: static download page of creator-kit (Material 3 page, latest.json, packs). No application
# origin: nginx serves the `current` release tree published by scripts/release/publish-creator.ts
# (/home/ubuntu/apps/creator/current, a symlink flipped atomically). Public and unauthenticated by design: published,
# checksummed release files only, GET and HEAD only. TLS: Let's Encrypt webroot, certificate /etc/letsencrypt/live/aphrody.com.
# Installed on the vps host nginx as /etc/nginx/conf.d/creator.aphrody.com.conf (Cloudflare proxies creator -> vps).
# Rollback: remove that file, `nginx -t`, reload; releases stay on disk.

limit_req_zone $binary_remote_addr zone=aphrody_creator:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=aphrody_creator_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name creator.aphrody.com;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name creator.aphrody.com;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:aphrody_tls:10m;
    ssl_session_timeout 1d;

    root /home/ubuntu/apps/creator/current;
    index index.html;
    autoindex off;

    # add_header is not inherited once a location sets its own: shared headers are repeated where needed.
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    limit_req zone=aphrody_creator burst=40 nodelay;
    limit_conn aphrody_creator_conn 16;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types application/json text/plain;

    location = / {
        include snippets/aphrody-security.inc;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Link '</llms.txt>; rel="describedby"; type="text/markdown"';
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Page assets: logo and favicons.
    location ~ ^/(logo\.webp|favicon-32\.png|favicon-192\.png|icon-256\.png|og\.png|apple-touch-icon\.png|theme\.css|page\.css|app\.js|fonts/GoogleSansFlex-latin\.woff2)$ {
        include snippets/aphrody-security.inc;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    # Crawler and install files: plain text, XML and the web manifest, each with an explicit type and charset.
    location ~ ^/(robots\.txt|llms\.txt|sitemap\.xml|site\.webmanifest)$ {
        types {
            text/plain txt;
            application/xml xml;
            application/manifest+json webmanifest;
        }
        charset utf-8;
        charset_types text/plain application/xml application/manifest+json;
        include snippets/aphrody-security.inc;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location = /favicon.ico {
        default_type image/png;
        include snippets/aphrody-security.inc;
        add_header Cache-Control "public, max-age=86400";
        try_files /favicon-32.png =404;
    }

    # The updater and the page poll this file: never cached.
    location = /latest.json {
        default_type application/json;
        include snippets/aphrody-security.inc;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /SHA256SUMS {
        default_type text/plain;
        include snippets/aphrody-security.inc;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Stable name for the current Windows pack (the page button).
    location = /download/windows {
        alias /home/ubuntu/apps/creator/current/download/creator-kit-windows-x64.zip;
        default_type application/zip;
        include snippets/aphrody-security.inc;
        add_header Cache-Control "no-cache";
        add_header Content-Disposition 'attachment; filename="creator-kit-windows-x64.zip"';
    }

    # Immutable, versioned files.
    location /files/ {
        default_type application/octet-stream;
        sendfile on;
        tcp_nopush on;
        gzip off;
        limit_rate_after 50m;
        limit_rate 40m;
        include snippets/aphrody-security.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    # Own 404 page, never served directly.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        include snippets/aphrody-security.inc;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'" always;
        add_header Cache-Control "no-cache";
    }

    location / { return 404; }
}
