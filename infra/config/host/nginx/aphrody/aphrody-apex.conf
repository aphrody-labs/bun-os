# Retired 2026-09-25: aphrody.com's origins (aphrody-site, aphrody-a2a, aphrody-ai-http) and its certificate were removed from vps (tools/config/service-catalog.json status:retired; docs/PLAN.md). Kept as a redeploy template for the Aphrody convergence plan (superproject docs/architecture/APHRODY-CONVERGENCE.md).
# aphrody.com, www.aphrody.com and mcp.aphrody.com — Web site :8083, AI :8788/:8789.
# Self-contained: no include and no upstream from the nie/cdn/inacord blocks of
# aphrody.com.conf, so it can be installed and validated on its own.

# --- HTTP -> HTTPS ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name aphrody.com www.aphrody.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://aphrody.com$request_uri; }
}

# --- Aphrody OS web origin and explicitly routed Aphrody AI endpoints -------------------------
# Own limits, independent of nie: one page load fetches about ten versioned assets, which are
# then cached for a year, so the burst is sized for a cold visit, not for sustained traffic.
limit_req_zone $binary_remote_addr zone=aphrody_site:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=aphrody_conn:10m;

# Persistent connections to the origin instead of one TCP handshake per request.
upstream aphrody_site {
    server 127.0.0.1:8083;
    keepalive 32;
}

# `www` is not a second copy of the site: one canonical host for search engines.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.aphrody.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    return 301 https://aphrody.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aphrody.com;
    access_log off;

    # aphrody-site precompresses its front-end (brotli/gzip, `Vary: Accept-Encoding`); nginx
    # never recompresses an encoded body and only gzips the uncompressed API responses.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/xml application/manifest+json text/plain text/css
        text/javascript image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    limit_req zone=aphrody_site burst=60 nodelay;
    limit_conn aphrody_conn 24;
    limit_req_status 429;
    limit_conn_status 429;

    location = /healthz { proxy_pass http://127.0.0.1:8083/healthz; proxy_set_header Host $host; }
    location = /health  { proxy_pass http://127.0.0.1:8083/healthz; proxy_set_header Host $host; }
    location = /llms.txt { proxy_pass http://127.0.0.1:8083/llms.txt; proxy_set_header Host $host; }
    location = /api/v1/openapi.json { proxy_pass http://127.0.0.1:8083/api/v1/openapi.json; proxy_set_header Host $host; }
    location = /api/v1/ecosystem { proxy_pass http://127.0.0.1:8083/api/v1/ecosystem; proxy_set_header Host $host; }
    location = /api/v1/models { proxy_pass http://127.0.0.1:8789/api/v1/models; proxy_set_header Host $host; }
    location = /api/v1/rag/query { proxy_pass http://127.0.0.1:8789/api/v1/rag/query; proxy_set_header Host $host; }
    location = /api/v1/rag/stats { proxy_pass http://127.0.0.1:8789/api/v1/rag/stats; proxy_set_header Host $host; }
    location ^~ /api/v1/web/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ { proxy_pass http://127.0.0.1:8083; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

    location = /mcp {
        proxy_pass http://127.0.0.1:8083/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://aphrody_site;
        proxy_set_header Host $host;
        include snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- mcp.aphrody.com : alias du transport MCP Web ----------------------------------------------
# Retired 2026-09-25 along with its 8083 backend (config/nginx-routes.json: mcp.aphrody.com,
# status retired). Kept as a redeploy template, same as the rest of this file.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcp.aphrody.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    location = / {
        return 308 https://aphrody.com/mcp;
    }

    location = /mcp {
        proxy_pass http://127.0.0.1:8083/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / { return 404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp.aphrody.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
