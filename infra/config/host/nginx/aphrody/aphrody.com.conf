# SPDX-License-Identifier: Apache-2.0
# Direct public ingress for the native WebOS service (127.0.0.1:8790). No Worker or tunnel upstream.
# Installed as /etc/nginx/sites-available/aphrody.com (enabled by symlink). HTTP/3 + QUIC, HTTP/2,
# TLS 1.3 0-RTT for safe methods; http-level tuning, compression and maps are in conf.d/01-02.
limit_req_zone $binary_remote_addr zone=aphrody_webos_api:10m rate=60r/m;

upstream aphrody_webos {
    server 127.0.0.1:8790;
    keepalive 64;
    keepalive_time 1h;
    keepalive_timeout 120s;
}

# 0-RTT data can be replayed: only idempotent methods may ride on it (RFC 8470 425 Too Early).
map "$ssl_early_data:$request_method" $aphrody_early_reject {
    default 0;
    "~^1:(POST|PUT|PATCH|DELETE)$" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name aphrody.com www.aphrody.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://aphrody.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name www.aphrody.com;
    ssl_certificate /etc/letsencrypt/live/aphrody-webos-vps/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody-webos-vps/privkey.pem;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    return 301 https://aphrody.com$request_uri;
}
server {
    # play.aphrody.app owns `reuseport` on the shared 443/udp sockets.
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name aphrody.com;
    ssl_certificate /etc/letsencrypt/live/aphrody-webos-vps/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody-webos-vps/privkey.pem;
    ssl_early_data on;
    if ($aphrody_early_reject) { return 425; }
    client_max_body_size 1m;
    limit_req_status 429;

    # Headers on every response, error pages included. The service sends its own COOP/COEP;
    # nginx owns them so SharedArrayBuffer/wasm threads hold on every WebOS path.
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Embedder-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Alt-Svc;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    include /etc/nginx/snippets/aphrody-craft.inc;
    include /etc/nginx/snippets/aphrody-store.inc;
    include /etc/nginx/snippets/aphrody-store-api.inc;
    include /etc/nginx/snippets/aphrody-wayland.inc;
    include /etc/nginx/snippets/aphrody-android.inc;
    include /etc/nginx/snippets/aphrody-chat.inc;
    include /etc/nginx/snippets/aphrody-google.inc;
    include /etc/nginx/snippets/aphrody-status.inc;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Early-Data $ssl_early_data;
    # Upgrade for WebSocket/WebRTC signalling, empty Connection (upstream keepalive) otherwise.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $aphrody_connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;

    location ~ ^/(api/|mcp$|v1/) {
        limit_req zone=aphrody_webos_api burst=20 nodelay;
        proxy_pass http://aphrody_webos;
    }
    # Content-hashed assets never change under the same URL.
    location ~* "[.-][0-9a-f]{8,64}\.(?:js|mjs|css|wasm|woff2|png|jpg|webp|avif|svg|data|bin)$" {
        proxy_pass http://aphrody_webos;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
    }
    # WebOS shell and its WebSocket/stream channels: long-lived, unbuffered.
    location / {
        proxy_pass http://aphrody_webos;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
