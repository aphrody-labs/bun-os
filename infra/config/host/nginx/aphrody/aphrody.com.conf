# Public TLS edge; the read-only application runs on DBFR through WireGuard.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name aphrody.com www.aphrody.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://aphrody.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.aphrody.com;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:aphrody_tls:10m;
    ssl_session_timeout 1d;

    include snippets/aphrody-security.inc;
    return 301 https://aphrody.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aphrody.com;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:aphrody_tls:10m;
    ssl_session_timeout 1d;

    include snippets/aphrody-security.inc;

    include snippets/public-webos.inc;
    include snippets/aphrody-store.inc;

    location = /api/search {
        limit_except GET { deny all; }
        default_type application/json;
        add_header Cache-Control no-store always;
        return 503 '{"error":"Public search backend is not yet qualified"}';
    }

    location = /api/index/search {
        limit_except GET { deny all; }
        default_type application/json;
        add_header Cache-Control no-store always;
        return 503 '{"error":"Public search backend is not yet qualified"}';
    }

    location / {
        proxy_pass http://10.200.77.3:18803;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
