# Direct public ingress for the native WebOS service. No Worker or tunnel upstream.
limit_req_zone $binary_remote_addr zone=aphrody_webos_api:10m rate=60r/m;
server {
    listen 80;
    listen [::]:80;
    server_name aphrody.com www.aphrody.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://aphrody.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.aphrody.com;
    ssl_certificate /etc/letsencrypt/live/aphrody-webos-vps/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody-webos-vps/privkey.pem;
    return 301 https://aphrody.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aphrody.com;
    ssl_certificate /etc/letsencrypt/live/aphrody-webos-vps/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody-webos-vps/privkey.pem;
    client_max_body_size 1m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript application/wasm application/json text/css image/svg+xml;
    limit_req_status 429;
    include /etc/nginx/snippets/aphrody-craft.inc;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_hide_header Alt-Svc;
    location ~ ^/(api/|mcp$|v1/) {
        limit_req zone=aphrody_webos_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8790;
    }
    location / { proxy_pass http://127.0.0.1:8790; }
}
