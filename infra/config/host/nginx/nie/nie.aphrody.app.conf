# SPDX-License-Identifier: Apache-2.0
# nie.aphrody.app — public IEVR asset origin for iecode (Vercel: NEXT_PUBLIC_CDN_ORIGIN).
#
# Origin: 127.0.0.1:8810, which relays this host to its
# supervised nie-model-serve child (127.0.0.1:8792); routes in snippets/nie-assets.inc, served at the
# root of this host (`/model-full/<code>.glb`, `/tex/<vfs>.png`, `/avatar/catalog.json`, …).
# DNS: Cloudflare zone aphrody.app, A nie -> vps public address, proxied.
# TLS: Let's Encrypt `nie.aphrody.app` (certbot dns-cloudflare, /etc/letsencrypt/cloudflare.ini).
#
# Install:
#   sudo install -m 644 nginx/nie/nie.aphrody.app.conf /etc/nginx/conf.d/nie.aphrody.app.conf
#   sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=nie_assets:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=nie_conn:10m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nie.aphrody.app;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/nie.aphrody.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nie.aphrody.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_read_timeout 120s;
    proxy_send_timeout 60s;

    include snippets/nie-assets.inc;
}

server {
    listen 80;
    listen [::]:80;
    server_name nie.aphrody.app;
    access_log off;
    return 301 https://$host$request_uri;
}
