# Private mesh-only origin of the reorganised DBXV2 dump (scripts/aphrody/tools/infra/dbxv2-assets-layout.ts).
# Install as /etc/nginx/conf.d/dbxv2-assets.conf. It listens on the wireguard address only: the dump is
# game data and never leaves the mesh.
#
# URL contract: GET /<kind>/<cpk>/<path inside the cpk>
#   models, textures, data, text  stored once as <path>.xz (xz -9e): request /<kind>/<cpk>/<path>.xz, the
#                                 body is the xz stream as is (application/x-xz, no Content-Encoding):
#                                 the client decodes it (bun_re::game::api::xz_decode).
#   audio, video                  raw, requested without suffix; /video/ supports ranges.
#   meta/vfs-index.ndjson         canonical VFS manifest (header line with count and sha256 digest, then one row per CPK entry).
#   meta/index.jsonl              one line per file: cpk, path, kind, size (original), compression
#                                 ("xz" | "gzip" | absent), gzip (bool, true only for a leftover .gz), stored.
# A leftover <path>.gz (a conversion not finished) is still served by gzip_static/gunzip as the original file.

server {
    listen 10.200.77.1:8794;
    server_name dbxv2-assets.internal;
    access_log off;

    root /home/ubuntu/apps/dbxv2-assets;
    allow 10.200.77.0/24;
    deny all;

    gzip_static always;
    gunzip on;
    add_header Cache-Control "private, max-age=3600" always;
    add_header X-Content-Type-Options nosniff always;

    # xz tree: plain files, never negotiated or inflated by nginx.
    location ~ \.xz$ {
        default_type application/x-xz;
        gzip off;
        gzip_static off;
        gunzip off;
        add_header Cache-Control "private, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
    }
    # Ranges and large media are served straight from disk.
    location ~ ^/video/ {
        sendfile_max_chunk 2m;
        add_header Accept-Ranges bytes;
    }
    location /meta/ {
        default_type application/json;
        location = /meta/index.jsonl { default_type application/x-ndjson; }
        # Canonical VFS manifest of the CPKs (docs/re/vfs-sync.md): `bunre vfs manifest dbxv2 <install> --out`.
        location = /meta/vfs-index.ndjson { default_type application/x-ndjson; }
    }
    location / {
        autoindex off;
    }
}
