# SPDX-License-Identifier: Apache-2.0
# zstd (tokers/zstd-nginx-module, built against the packaged nginx by /usr/local/libexec/aphrody-nginx-zstd).
# Kept at /etc/nginx/aphrody/03-zstd.conf and linked into conf.d only while the matching module is loaded,
# so an nginx package upgrade never leaves an invalid configuration.

zstd on;
zstd_static on;
zstd_comp_level 3;
zstd_min_length 512;
zstd_types
    text/plain text/css text/xml text/javascript application/javascript application/json
    application/manifest+json application/xml application/rss+xml application/atom+xml
    application/wasm image/svg+xml application/x-ndjson;
