# SPDX-License-Identifier: Apache-2.0
# brotli on top of the gzip fallback of 01-tuning.conf, installed as /etc/nginx/conf.d/02-compression.conf
# (modules libnginx-mod-http-brotli-filter/-static from Ubuntu, upgraded with nginx). zstd is in 03-zstd.conf.
# Precompressed .br siblings are served as-is; dynamic text is compressed once at a moderate level.

brotli on;
brotli_static on;
brotli_comp_level 5;
brotli_min_length 512;
brotli_types
    text/plain text/css text/xml text/javascript application/javascript application/json
    application/manifest+json application/xml application/rss+xml application/atom+xml
    application/wasm image/svg+xml application/x-ndjson;
