# Host-wide http-level tuning, loaded after 00-default.conf as /etc/nginx/conf.d/01-tuning.conf.
# Vhosts keep their own server-level overrides (client_max_body_size, ssl_session_cache, ...).

tcp_nodelay on;
reset_timedout_connection on;

keepalive_timeout 30s;
keepalive_requests 1000;
send_timeout 30s;
client_header_timeout 15s;
client_body_timeout 30s;
client_body_buffer_size 64k;
large_client_header_buffers 4 16k;

# Static files: descriptors and metadata stay cached between requests.
open_file_cache max=10000 inactive=60s;
open_file_cache_valid 120s;
open_file_cache_min_uses 2;
open_file_cache_errors on;
aio threads;
directio 16m;
output_buffers 2 256k;

# Text is compressed once at a moderate level. Images, archives, fonts and media are already
# compressed and are left alone.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 512;
gzip_http_version 1.1;
gzip_types
    text/plain text/css text/xml text/javascript application/javascript application/json
    application/manifest+json application/xml application/rss+xml application/atom+xml
    application/wasm image/svg+xml application/x-ndjson;

# TLS resumption for returning visitors: shared cache plus tickets (keys regenerate on every reload).
ssl_session_cache shared:SSL:50m;
ssl_session_timeout 1d;
ssl_session_tickets on;
ssl_buffer_size 8k;
# Let's Encrypt stopped OCSP in 2025 (no responder URL in current certificates): no stapling.

# QUIC: UDP segmentation offload, larger HTTP/3 stream buffers.
quic_gso on;
http3_stream_buffer_size 256k;

# WebSocket/WebRTC signalling: Upgrade when asked, otherwise an empty Connection header so
# upstream keepalive pools stay usable.
map $http_upgrade $aphrody_connection_upgrade {
    default upgrade;
    ""      "";
}
