# ~/apps/compose.yaml on dbfr: the ONE compose project of the host, one included file per ~/apps/<app>
# (layout: tools/config/host/host-policy.toml). Docker restarts the containers through `restart:`, no systemd
# wrapper. Installed by scripts/tools/infra/host-apps.ts; ~/apps/.env (env next to this file) selects the profiles.
name: aphrody
include:
  # Legacy: generated from the abandoned the former Bun fork fork (scripts/aphrody/deploy/docker/compose.yaml); the runtime is now upstream oven-sh/bun.
  - path: [aphrody-bun/compose.yaml, bun-prod-runtime.yaml]
  # tools/config/container/compose.yaml.
  - path: [aphrody/compose.yaml, bun-services-runtime.yaml]
  - aphrody-bun-release/compose.yaml
  - aphrody-site/compose.yaml
