# ~/apps/compose.yaml on the vps: the ONE compose project of the host, one included file per ~/apps/<app>
# (layout: tools/config/host/host-policy.toml). Docker restarts the containers through `restart:`, no systemd
# wrapper. Installed by scripts/tools/infra/host-apps.ts; ~/apps/.env (env next to this file) selects the profiles.
name: aphrody
include:
  # tools/config/container/compose.yaml: the idle aphrody-build container (profile build).
  - aphrody/compose.yaml
  - komodo/compose.yaml
  - webos/compose.yaml
