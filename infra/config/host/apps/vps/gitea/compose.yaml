services:
  gitea:
    image: docker.gitea.com/gitea:28.1.0@sha256:f505a0d3a41323b786e05942fc7a4075e07ae7c169fd9485649aa55ee543a21a
    container_name: aphrody-gitea
    restart: unless-stopped
    init: true
    cpus: 1.0
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 256
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__DEFAULT__APP_NAME: Aphrody / Bun
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: source.aphrody.app
      GITEA__server__ROOT_URL: https://source.aphrody.app/
      GITEA__server__SSH_DOMAIN: source.aphrody.app
      GITEA__server__SSH_PORT: "29022"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__REVERSE_PROXY_AUTHENTICATION_USER: X-Aphrody-Tunnel-User
      GITEA__security__REVERSE_PROXY_LIMIT: "1"
      GITEA__security__REVERSE_PROXY_TRUSTED_PROXIES: 172.18.0.1/32
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__ENABLE_REVERSE_PROXY_AUTHENTICATION: "true"
      GITEA__service__ENABLE_REVERSE_PROXY_AUTHENTICATION_API: "false"
      GITEA__service__ENABLE_REVERSE_PROXY_AUTO_REGISTRATION: "false"
      GITEA__service__ENABLE_REVERSE_PROXY_EMAIL: "false"
      GITEA__service__ENABLE_REVERSE_PROXY_FULL_NAME: "false"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      GITEA__repository__DEFAULT_PRIVATE: private
      GITEA__actions__ENABLED: "true"
      GITEA__actions__DEFAULT_ACTIONS_URL: self
      GITEA__actions__ENDLESS_TASK_TIMEOUT: 12h
      GITEA__log__LEVEL: Warn
      # SQLite write-contention mitigation (infra repair of 2026-10-25).
      GITEA__database__SQLITE_TIMEOUT: "60000"
      GITEA__database__SQLITE_JOURNAL_MODE: WAL
      # SQLite and the LevelDB queues live on the root SSD: /home (btrfs on sdb+sdc) is capped at 250 IOPS per
      # device and its fsyncs reach 30-80 s under build load, which held the writer lock past SQLITE_TIMEOUT.
      GITEA__database__PATH: /data/gitea-db/gitea.db
      GITEA__queue__DATADIR: /data/gitea-db/queues
      GITEA__cron_0X2E_update_mirrors__SCHEDULE: "@every 30m"
      GITEA__cron_0X2E_update_mirrors__PULL_LIMIT: "5"
      GITEA__mirror__DEFAULT_INTERVAL: 24h
      GITEA__cron_0X2E_check_repo_stats__RUN_AT_START: "false"
      GITEA__cron_0X2E_archive_cleanup__RUN_AT_START: "false"
      GITEA__cron_0X2E_update_checker__ENABLED: "false"
    ports:
      - "127.0.0.1:29020:3000"
      - "127.0.0.1:29022:22"
    entrypoint: ["/bin/sh", "/usr/local/bin/gitea-native-storage-guard"]
    command: ["/usr/bin/s6-svscan", "/etc/s6"]
    volumes:
      - ./data:/data
      - /var/lib/aphrody-gitea/db:/data/gitea-db
      - ./native-storage-guard.sh:/usr/local/bin/gitea-native-storage-guard:ro
      - type: volume
        source: native_storage
        target: /data/git/repositories/aphrody-labs-native
        volume:
          nocopy: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  native_storage:
    name: aphrody-gitea-native-storage
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ubuntu/build/apps/gitea/native-storage
