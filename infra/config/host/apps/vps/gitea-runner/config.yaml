# SPDX-License-Identifier: Apache-2.0
log:
  level: warn
  job:
    max_size: 16777216
    retention: 24h
runner:
  file: /data/.runner
  capacity: 3
  timeout: 720m
  shutdown_timeout: 30s
  # Fewer SQLite writes than the 2s poll / 5s report defaults. The push failures of 2026-10-25 came from fsync
  # latency on /home, fixed by moving gitea.db to the root SSD (see ../gitea/compose.yaml).
  fetch_timeout: 30s
  fetch_interval: 10s
  fetch_interval_max: 60s
  log_report_interval: 15s
  log_report_max_latency: 10s
  state_report_interval: 15s
  labels:
    - aphrody-bun-linux:docker://sha256:c61efd9c0858cd031c40caabb5d72bac9620c2ce4032663099745bc48673d2f2
  envs:
    BUN_EXECUTABLE: /usr/local/bin/bun
    # Submodule URLs resolve to the read-only host mirrors (git-mirrors.sh writes this file: path insteadOf
    # rules, protocol.file.allow=always, safe.directory). A missing file or URL falls back to the network.
    GIT_CONFIG_SYSTEM: /home/ubuntu/build/git-mirrors/jobs.gitconfig
    GIT_SSH_COMMAND: ssh -F /run/aphrody/git-ssh/config
    PATH: /usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin:/root/.cargo/bin
  action_shallow_clone: true
  idle_cleanup_interval: 0s
container:
  network: aphrody_default
  privileged: false
  force_pull: false
  options: >-
    --init --cpus=4 --memory=12g --pids-limit=1024
    --volume=/home/ubuntu/.bun/bin/bun:/usr/local/bin/bun:ro
    --volume=/home/ubuntu/.aphrody/secrets/gitea/bun-os-crate-runner:/run/aphrody/git-ssh/identity:ro
    --volume=/home/ubuntu/apps/gitea-runner/ssh/config:/run/aphrody/git-ssh/config:ro
    --volume=/home/ubuntu/apps/gitea-runner/ssh/known_hosts:/run/aphrody/git-ssh/known_hosts:ro
    --volume=/home/ubuntu/build/cache/gitea-runner:/cache
    --volume=/home/ubuntu/build/git-mirrors:/home/ubuntu/build/git-mirrors:ro
  valid_volumes:
    - /home/ubuntu/.bun/bin/bun:ro
    - /home/ubuntu/.aphrody/secrets/gitea/bun-os-crate-runner:ro
    - /home/ubuntu/apps/gitea-runner/ssh/config:ro
    - /home/ubuntu/apps/gitea-runner/ssh/known_hosts:ro
    - /home/ubuntu/build/cache/gitea-runner
    - /home/ubuntu/build/git-mirrors:ro
  sweep: true
  # Job workspaces live on the /home btrfs (sdb+sdc), not in Docker volumes on the root disk: one native job
  # holds 4 to 19 GB and three run at once. The runner container mounts this directory at the same path.
  bind_workdir: true
  workdir_parent: home/ubuntu/build/gitea-work
cache:
  enabled: false
