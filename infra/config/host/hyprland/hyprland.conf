# SPDX-License-Identifier: Apache-2.0
# Aphrody headless Hyprland session (Omarchy-style defaults: tokyo-night borders, SUPER keybinds, 10 workspaces).
# Monitor: the headless output is created by exec-once; WebOS resizes it through hyprctl.
monitor = HEADLESS-1, 1600x900@60, 0x0, 1
monitor = Virtual-1, disable
exec-once = hyprctl output create headless
exec-once = hyprctl keyword monitor HEADLESS-1,1600x900@60,0x0,1
exec-once = waybar
exec-once = wl-paste --watch cat >/dev/null

env = XCURSOR_SIZE,24
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = MOZ_ENABLE_WAYLAND,1

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(414868aa)
    layout = dwindle
}
decoration { rounding = 6 }
animations { enabled = false }
misc { disable_hyprland_logo = true; disable_splash_rendering = true; force_default_wallpaper = 0 }
input { kb_layout = us; follow_mouse = 1 }
dwindle { pseudotile = true; preserve_split = true }

$mod = SUPER
bind = $mod, RETURN, exec, rio
bind = $mod SHIFT, RETURN, exec, foot
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, J, layoutmsg, togglesplit
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
