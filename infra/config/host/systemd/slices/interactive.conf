# Drop-in installed as /etc/systemd/system/<unit>.d/90-aphrody-interactive.conf for the interactive services
# (list in aphrody-priority.json). The slice applies at the unit's next restart; the weights are also set live.
[Service]
Slice=interactive.slice
CPUWeight=1000
IOWeight=1000
