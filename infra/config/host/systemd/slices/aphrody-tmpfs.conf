# /tmp and /dev/shm are tmpfs (RAM). Build caches left there pinned ~34 GiB on 2026-11-03 and starved sshd.
# systemd-tmpfiles-clean drops entries untouched for 12 hours (tmpfiles.d(5), "q" = create, age-clean).
q /tmp 1777 root root 12h
q /dev/shm 1777 root root 12h
