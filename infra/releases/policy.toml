# Bun OS release policy (docs/ops/RELEASES.md): Arch-style rolling release. Read by the release tooling.
schema = 2
model = "rolling"

[repositories]
release = "bunos"
testing = "bunos-testing"
staging = "bunos-staging"
promotion_gate = "stage-5 qualification"
signing = "pacman (gpg)"

[package_managers]
system = "pacman"
sandboxed = "flatpak"
userspace = "bun"

[userland]
languages = ["rust", "bun"]
shell = "nushell"
terminal = "rio"
desktop = "cosmic"
prefer_sources = ["redox crates", "uutils", "sudo-rs", "ntpd-rs"]

[iso]
version = "YYYY.MM.DD"
cadence = "monthly, 1st"

[kernels]
linux-bun = "kernel.org stable"
linux-bun-lts = "kernel.org longterm"
linux-bun-mainline = "kernel.org mainline (testing)"
rust = true
llvm = true

[packages]
scheme = "semver-2.0"
workspace_version = "1.4.7"
semver_check = "cargo semver-checks"
registries = ["crates.io", "npmjs.com"]
