# Self-hosted: runs only on the Gitea runner label aphrody-bun-linux (VPS), which provides BUN_EXECUTABLE (pinned upstream Bun),
# the git-ssh transport under /run/aphrody/git-ssh and the /cache volume. GitHub-hosted CI is .github/workflows/ci.yml.
name: Bun Engine
on:
  push:
    branches: [main, os]
    paths:
      - crates/bun-engine-core/**
      - packages/bun-engine/**
      - packages/bun-loaders/**
      - vendor/tetanes
      - vendor/rustboyadvance-ng
      - vendor/starpsx
      - vendor/chipi-spec
      - .gitea/workflows/bun-engine.yaml
  workflow_dispatch:
jobs:
  engine:
    runs-on: aphrody-bun-linux
    timeout-minutes: 240
    env:
      GIT_SSH_COMMAND: ssh -F /run/aphrody/git-ssh/config
      CARGO_HOME: /cache/cargo-home
      CARGO_TARGET_DIR: /cache/bun-engine-target
    steps:
      - uses: builtin:checkout
        with:
          submodules: false
          fetch-depth: 1
          persist-credentials: false
      - name: Select runtime
        run: printf '%s\n' "${BUN_EXECUTABLE%/*}" >> "$GITHUB_PATH"
      - name: Engine sources
        # Only the cores the native engine links, with their free test ROMs and BIOS.
        run: |
          git submodule update --init --depth 1 vendor/tetanes vendor/starpsx vendor/chipi-spec
          git submodule update --init --recursive --depth 1 vendor/rustboyadvance-ng
      - name: Check
        run: bun check packages/bun-engine/src/cli.ts packages/bun-engine/src/bep.ts packages/bun-loaders/src/index.ts
      - name: Build
        run: cargo build --release --locked -p bun-engine --bin bun-engine --no-default-features --features nds,nes,gba,psx,arm,wii,cartridge,window
      - name: Machines on free content
        run: |
          set -eu
          bin="$CARGO_TARGET_DIR/release/bun-engine"
          out="$RUNNER_TEMP/frames"
          "$bin" run nes vendor/tetanes/tetanes/assets/roms/alter_ego.nes --headless --frames 180 --out "$out/nes"
          for t in arm thumb memory; do
            "$bin" run gba "vendor/rustboyadvance-ng/external/gba-tests/$t/$t.gba" --headless --frames 120 --out "$out/gba-$t"
          done
          bun packages/bun-engine/src/cli.ts formats header vendor/tetanes/tetanes/assets/roms/alter_ego.nes > /dev/null
