# Self-hosted: runs only on the Gitea runner label aphrody-bun-linux (VPS), which provides BUN_EXECUTABLE (pinned upstream Bun),
# the git-ssh transport under /run/aphrody/git-ssh and the /cache volume. GitHub-hosted CI is .github/workflows/ci.yml.
name: Aphrody / Bun
on:
  push:
    branches: [main, os]
    # Publishing the website does not change native application inputs.
    paths-ignore:
      - apps/webos/**
      - infra/config/host/nginx/**
      - infra/config/host/systemd/aphrody/aphrody-webos*
      - infra/config/host/apps/vps/webos/**
      - infra/config/host/apps/vps/compose.yaml
      - .gitea/workflows/aphrody-sites.yaml
      - .gitea/workflows/apps.yaml
      - docs/**
  workflow_dispatch:
    inputs:
      build:
        description: Build native applications after host admission
        type: boolean
        default: false
# A push supersedes the native build of the previous commit on the same branch: without this, every push queued a
# 12-hour build and the three runner slots starved the sites deploy.
concurrency:
  group: aphrody-bun-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: aphrody-bun-linux
    timeout-minutes: 720
    env:
      GIT_SSH_COMMAND: ssh -F /run/aphrody/git-ssh/config
    steps:
      - name: Validate checkout transport
        run: |
          command -v git >/dev/null
          command -v ssh >/dev/null
          test -r /run/aphrody/git-ssh/identity
          test -r /run/aphrody/git-ssh/config
          test -r /run/aphrody/git-ssh/known_hosts
          test "$(stat -c %a /run/aphrody/git-ssh/identity)" = 600
          ssh -G -F /run/aphrody/git-ssh/config bun-forge >/dev/null
      - uses: builtin:checkout
        with:
          submodules: true
          fetch-depth: 1
          persist-credentials: false
      - name: Select runtime
        run: |
          "$BUN_EXECUTABLE" scripts/assert-runtime-pin.ts
          printf '%s\n' "${BUN_EXECUTABLE%/*}" >> "$GITHUB_PATH"
      - name: Install
        run: |
          bun install --frozen-lockfile
          bun scripts/node-modules.ts
      - name: Check
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Format
        run: bun run format:check
      - name: Build apps
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.build == true || inputs.build == 'true') }}
        run: bun scripts/build-apps.ts build --target bun-linux-x64 --bun "$BUN_EXECUTABLE" --runtime-pin infra/runtime-pins/linux-x64.json --host vps --mode docker --shared-assets infra/shared-assets.json --output build/apps --report .local/builds/linux-x64.json
