# Self-hosted: runs only on the Gitea runner label aphrody-bun-linux (VPS), which provides BUN_EXECUTABLE (pinned upstream Bun),
# the git-ssh transport under /run/aphrody/git-ssh and the /cache volume. GitHub-hosted CI is .github/workflows/ci.yml.
name: Aphrody Sites

on:
  push:
    branches: [os]
  workflow_dispatch:

permissions:
  contents: read

# No schedule: a pending run in the concurrency group is replaced by the newest
# one, so an hourly cron kept cancelling the deploy queued by a push.
concurrency:
  group: aphrody-sites-production
  cancel-in-progress: false

jobs:
  webos:
    name: Build and publish unified WebOS
    runs-on: aphrody-bun-linux
    timeout-minutes: 120
    env:
      GIT_SSH_COMMAND: ssh -F /run/aphrody/git-ssh/config
      WEBOS_DEPLOY_ROOT: /cache/webos-deploy
      # The build runs in one persistent workspace on the runner cache volume (host:
      # ~/build/cache/gitea-runner/sites-ws): its 168 submodules, node_modules and Cargo target
      # survive between runs, so a push only fetches what changed. The concurrency group above
      # serializes the runs that use it.
      SITES_WORKSPACE: /cache/sites-ws
    steps:
      - name: Validate checkout transport
        run: |
          command -v git >/dev/null
          command -v ssh >/dev/null
          test -r /run/aphrody/git-ssh/identity
          test -r /run/aphrody/git-ssh/config
          test -r /run/aphrody/git-ssh/known_hosts
          test "$(stat -c %a /run/aphrody/git-ssh/identity)" = 600
      - uses: builtin:checkout
        with:
          submodules: false
          fetch-depth: 1
          persist-credentials: false
      - name: Update the persistent Sites workspace
        run: |
          git config --global --add safe.directory '*'
          sha="$(git rev-parse HEAD)"
          test -d "$SITES_WORKSPACE/.git" || git clone --no-checkout --depth 1 "file://$PWD" "$SITES_WORKSPACE"
          cd "$SITES_WORKSPACE"
          git fetch --depth 1 "file://$GITHUB_WORKSPACE" "$sha"
          git checkout -q -f --detach "$sha"
          # The checkout dropped its credentials, so record the pushed commit as the published tip locally.
          git update-ref refs/remotes/origin/os "$sha"
          # Kernel, LLVM and Wine forks are distribution-only sources the Sites never build.
          for p in vendor/cachyos-linux vendor/ogc-linux vendor/linux-cachyos vendor/kernel-patches vendor/ogc-kernel-packages vendor/nvidia-kernels vendor/open-gpu-kernel-modules vendor/llvm vendor/proton vendor/proton-cachyos vendor/wine-cachyos packages/re/third_party/unblob; do
            git config "submodule.$p.update" none
          done
          # Pins are not always branch tips, so no --depth. The Sites need the top-level submodules; nested
          # ones already present in the workspace are refreshed on a best-effort basis (vendor/qemu and the
          # like pin commits their upstreams no longer serve).
          git submodule update --init --jobs 4
      - name: Select pinned upstream Bun runtime
        run: |
          test -x "$BUN_EXECUTABLE"
          "$BUN_EXECUTABLE" scripts/assert-runtime-pin.ts
          printf '%s\n' "${BUN_EXECUTABLE%/*}" >> "$GITHUB_PATH"
      - name: Install workspace
        run: |
          cd "$SITES_WORKSPACE"
          bun install --frozen-lockfile
          bun scripts/node-modules.ts
      - name: Compile the complete installable Craft suite
        run: |
          cd "$SITES_WORKSPACE"
          rustup target add wasm32-unknown-unknown
          CARGO_BUILD_JOBS=4 APHRODY_CARGO_JOBS=4 bun apps/webos/build-craft.ts
      - name: Build and hand off the native VPS release
        run: |
          cd "$SITES_WORKSPACE"
          bun apps/webos/deploy.ts
