[package]
description = "Nintendo DS WebAssembly browser adapter."
license-file = "../../docs/licenses/iecode/licenses/dust/LICENSE"
name = "aphrody-dust-web"
version = "0.0.1"
edition = "2021"
publish = false
[lib]
crate-type = ["cdylib", "rlib"]

[features]
log = ["slog", "aphrody-dust-core/log"]

[dependencies]
aphrody-dust-core = { path = "../../crates/aphrody-dust-core", version = "0.0.1" }
aphrody-dust-soft-2d = { path = "../../crates/aphrody-dust-soft-2d", version = "0.0.1" }
aphrody-dust-soft-3d = { path = "../../crates/aphrody-dust-soft-3d", version = "0.0.1" }
aphrody-dust-wgpu = { path = "../../crates/aphrody-dust-wgpu", version = "0.1.1" }
bun-engine = { workspace = true, features = ["host"] }
wasm-bindgen-futures = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["console", "OffscreenCanvas"] }
slog = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
bun-engine = { workspace = true, features = ["bevy-web"] }
