[package]
name = "aphrody-bun-desktop"
version = "1.4.4"
description = "Aphrody desktop library inspector"
authors = ["aphrody-dev <contact@aphrody.com>"]
edition = "2024"
rust-version = "1.97"
license = "MIT"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true, features = ["compression"] }
tauri-runtime-wry = { workspace = true }
tauri-runtime-cef = { workspace = true, optional = true }
tauri-plugin-aphrody = { workspace = true }
serde_json = { workspace = true }

[features]
custom-protocol = ["tauri/custom-protocol"]
# Chromium Embedded Framework instead of the system webview (cef-dll-sys needs CMake).
cef = ["dep:tauri-runtime-cef"]
