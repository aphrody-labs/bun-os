[package]
name = "photocraft-cli"
description = "Headless Photocraft: convert, inspect, run commands, batch, MCP server"
version = "0.8.2"
edition = "2024"
license = "MIT OR Apache-2.0"
build = "build.rs"

[features]
# Open HEIC/HEIF photos (the optional heic-rs decoder in photocraft-codecs). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["photocraft-codecs/heif"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[lib]
name = "photocraft_cli"
path = "src/lib.rs"

[[bin]]
name = "photocraft-cli"
path = "src/main.rs"

[dependencies]
photocraft-automation = { path = "../../crates/photocraft-automation", version = "0.8.2" }
photocraft-engine = { path = "../../crates/photocraft-engine", version = "0.8.2" }
photocraft-io = { path = "../../crates/photocraft-io", version = "0.8.2" }
photocraft-format = { path = "../../crates/photocraft-format", version = "0.8.2" }
photocraft-codecs = { path = "../../crates/photocraft-codecs", version = "0.8.2" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
winresource = "0.1"
