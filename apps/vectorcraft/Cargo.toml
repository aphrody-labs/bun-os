[package]
name = "vectorcraft"
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
default-run = "vectorcraft"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
# VectorCraft never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Robustness). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[features]
default = ["wgpu", "accessibility"]
wgpu = ["eframe/wgpu", "dep:winsafe"]
accessibility = ["eframe/accesskit"]
# Build with --no-default-features --features windows7 and the win7 Rust target.
windows7 = ["eframe/glow"]

[dependencies]
winit = { workspace = true, features = ["x11"] }
image = "0.25"
rfd = "0.17"
arboard = "3"
craft-print = { path = "../../crates/craft-print" }
webbrowser = "1"
vectorcraft-engine = { path = "../../crates/vectorcraft-engine" }
vectorcraft-ui-egui = { path = "../../crates/vectorcraft-ui-egui" }
vectorcraft-text = { path = "../../crates/vectorcraft-text" }
eframe = { version = "0.36", default-features = false, features = [
  "glow",
  "default_fonts",
  "wayland",
  "x11",
] }
egui = "0.36"
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
winsafe = { workspace = true, features = ["gui"], optional = true }
windows = { workspace = true, features = ["Win32_Graphics_DirectWrite"] }
clipboard-win = "5"
pollster = "1"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = "0.32"
