[package]
name = "figcraft"
version = "0.5.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "FigCraft desktop app"
default-run = "figcraft"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
# Style lints from newer toolchains that fight index-heavy pixel code.
needless_range_loop = "allow"
chunks_exact_to_as_chunks = "allow"
# FigCraft never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Never crash). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[dependencies]
figcraft-engine = { path = "../../crates/figcraft-engine" }
figcraft-ui-egui = { path = "../../crates/figcraft-ui-egui" }
figcraft-collab-net = { path = "../../crates/figcraft-collab-net" }
figcraft-format = { path = "../../crates/figcraft-format" }
figcraft-text = { path = "../../crates/figcraft-text" }
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = [
  "glow",
  "default_fonts",
  "wgpu",
  "accesskit",
  "wayland",
  "x11",
] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
rfd = "0.17"
arboard = { version = "3.6", default-features = false, features = [
  "image-data",
] }
webbrowser = "1"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "gif",
  "bmp",
  "tiff",
] }
env_logger = { version = "0.11", default-features = false, features = [
  "auto-color",
  "humantime",
] }

[dev-dependencies]
wat = "1.261"

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Gaming_Input", "System_UserProfile", "UI_ViewManagement", "Foundation_Collections"] }
