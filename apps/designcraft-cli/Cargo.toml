[package]
name = "designcraft-cli"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[[bin]]
name = "designcraft-cli"
path = "src/main.rs"

[dependencies]
designcraft-engine = { path = "../../crates/designcraft-engine" }
designcraft-render = { path = "../../crates/designcraft-render" }
designcraft-doc = { path = "../../crates/designcraft-doc" }
designcraft-geom = { path = "../../crates/designcraft-geom" }
designcraft-color = { path = "../../crates/designcraft-color" }
designcraft-compose = { path = "../../crates/designcraft-compose" }
designcraft-pdf = { path = "../../crates/designcraft-pdf" }
designcraft-mcp = { path = "../../crates/designcraft-mcp" }
serde_json = { version = "1", features = ["float_roundtrip"] }
