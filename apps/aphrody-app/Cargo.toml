# SPDX-License-Identifier: Apache-2.0
#
# aphrody-app: the Aphrody OS desktop (Tauri 3), GUI and window manager.
# The agent runs in this process: src/broker.rs serves `aphrody-app-server` over in-memory pipes
# (no `aphrody app-server` child, no `aphrody` sidecar; see
# m3/docs/plans/local-ai-gui-native-integration.md). Model management is in process through
# aphrody-local-ai. Local models run in this process (feature `in-process`, on by default); the
# executable still answers `__llama-daemon` (src/llama_daemon.rs) only for the spawn fallback.
# It is also the Yolo desktop SDK host (`--host-info`, `--runtime-host`, src/runtime_host.rs) and opens the
# M3 showcase window with `--showcase` (src/showcase.rs); it is the only desktop application.

[package]
name = "aphrody-app"
description = "Aphrody OS desktop (Tauri 3): the GUI and window manager; drives the aphrody agent over its app-server protocol."
version = "1.4.7"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/aphrody"
[lib]
name = "aphrody_app_lib"
crate-type = ["rlib"]

[[bin]]
name = "aphrody-app"
path = "src/main.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[features]
# The desktop runs local models in its own process (aphrody-llama-server's `in-process` engine);
# it never re-executes its own exe as `__llama-daemon`. Without the feature (no libclang at build
# time) the supervisor falls back to the detached daemon, which `src/llama_daemon.rs` still serves.
default = ["in-process"]
# Chromium Embedded Framework runtime instead of the system webview (WebView2/WKWebView/WebKitGTK); cef-dll-sys needs CMake.
cef = ["dep:tauri-runtime-cef"]
in-process = [
  "aphrody-app-server/in-process",
  "aphrody-llama-server/in-process",
]
# Serve the bundled `frontendDist` (ui-dist) instead of `devUrl`. The Tauri CLI enables it for
# `tauri build`; plain `cargo build`/`cargo run` release builds must pass it explicitly.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
aphrody-proc = { path = "../../crates/aphrody-proc", version = "1.4.7", features = [] }
reqwest = { version = "0.13.5", features = ["rustls-no-provider", "json", "stream", "form", "query", "charset", "http2", "system-proxy", "blocking", "cookies", "gzip", "brotli", "deflate", "socks", "multipart"], default-features = false }
aphrody-app-server = { path = "../../crates/aphrody-app-server", version = "1.4.7", features = [] }
aphrody-capture = { path = "../../crates/aphrody-capture", version = "1.4.7", features = [] }
aphrody-diagnostics = { path = "../../crates/aphrody-diagnostics", version = "1.4.7" }
aphrody-drive = { path = "../../crates/aphrody-drive", version = "1.4.7" }
aphrody-fsindex = { path = "../../crates/aphrody-fsindex", version = "1.4.7", features = [] }
aphrody-shell-tauri = { path = "../../crates/aphrody-shell-tauri", version = "1.4.7", features = [] }
aphrody-identity = { path = "../../crates/aphrody-identity", version = "1.4.7" }
aphrody-kernel = { path = "../../crates/aphrody-kernel", version = "1.4.7", default-features = false, features = ["builtins"] }
aphrody-llama-server = { path = "../../crates/aphrody-llama-server", version = "1.4.7", features = [] }
aphrody-models = { path = "../../crates/aphrody-models", version = "1.4.7", features = [] }
futures-util = { version = "0.3", features = [] }
thiserror = "2.0.20"
aphrody-native = { package = "bun_native", path = "../../crates/bun-os-native" }
aphrody-sprite-sheet = { path = "../../crates/aphrody-sprite-sheet", version = "1.4.7" }
aphrody-subsystem = { path = "../../crates/aphrody-subsystem", version = "1.4.7" }
async-trait = "0.1.92"
yolo-core = "1.0.0"
base64 = "0.23.1"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
tauri = { workspace = true, features = ["compression", "dynamic-acl", "image-ico", "tray-icon"] }
tauri-runtime-wry = { workspace = true }
tauri-runtime-cef = { workspace = true, optional = true }
tokio = { version = "1.53.1", features = [
  "process",
  "rt-multi-thread",
  "macros",
  "time",
  "signal",
  "sync",
  "fs",
  "io-util",
  "full",
] }
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
log = "0.4.34"
mimalloc = { version = "0.1", default-features = false, features = [] }
url = { version = "2.5.8", features = ["serde"] }
tauri-plugin-aphrody = { workspace = true, features = ["wrap"] }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-global-shortcut = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-os = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-window-state = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"
