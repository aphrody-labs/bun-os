<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Aphrody Bun OS</title>
    <meta
      name="description"
      content="Bun OS in your browser: the real Hyprland desktop with COSMIC apps, streamed from your Bun OS session."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/m3.css" />
    <style>
      html,
      body,
      #desktop {
        margin: 0;
        height: 100%;
        background: var(--md-sys-color-surface, #111);
        color: var(--md-sys-color-on-surface, #eee);
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      .client-status,
      .client-signin {
        display: grid;
        place-content: center;
        gap: 12px;
        height: 100%;
        margin: 0;
      }
      .client-signin label {
        display: grid;
        gap: 8px;
      }
      .client-signin input,
      .client-signin button {
        font: inherit;
        padding: 8px 12px;
        border-radius: 12px;
        border: 1px solid var(--md-sys-color-outline, #888);
      }
      .client-signin button {
        background: var(--md-sys-color-primary, #8ab4f8);
        color: var(--md-sys-color-on-primary, #000);
      }
    </style>
  </head>
  <body>
    <main id="desktop" aria-label="Bun OS desktop"></main>
    <script type="module" src="/client.js"></script>
  </body>
</html>
