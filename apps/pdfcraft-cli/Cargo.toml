[package]
name = "pdfcraft-cli"
description = "PdfCraft command-line tool: inspect, render and robustness-check PDFs"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "pdfcraft-cli"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

# `"*"` matches every non-workspace package: crates.io dependencies and the
# vendored crates under `vendor/` (excluded from the workspace). Our own crates
# keep full debug info. Dependencies keep only line tables, so backtraces still
# show file and line, but debug info for the whole dependency graph stays out of
# every test binary (each UI test binary had a 500-600 MB PDB on Windows, #454).

[dependencies]
rustix = "1"
pdfcraft-render = { path = "../../crates/pdfcraft-render", version = "0.7.1" }
serde_json = "1"
pdfcraft-engine = { path = "../../crates/pdfcraft-engine", version = "0.7.1" }
pdfcraft-cos = { path = "../../crates/pdfcraft-cos", version = "0.7.1" }
pdfcraft-automation = { path = "../../crates/pdfcraft-automation", version = "0.7.1", default-features = false }
base64 = "0.22"

[build-dependencies]
winresource = "0.1"

[features]
default = ["mcp"]
# The opt-in MCP server (`pdfcraft-cli mcp`). Build with --no-default-features to leave it out.
mcp = ["pdfcraft-automation/mcp"]
