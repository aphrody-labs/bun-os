[package]
name = "gridcraft"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
default-run = "gridcraft"
description = "GridCraft desktop app"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
craft-print = { path = "../../crates/craft-print" }
rfd = "0.17"
arboard = "3"
gridcraft-engine = { path = "../../crates/gridcraft-engine" }
gridcraft-ui-egui = { path = "../../crates/gridcraft-ui-egui" }
eframe = { version = "0.36", default-features = false, features = [
  "glow",
  "default_fonts",
  "wgpu",
  "accesskit",
  "wayland",
  "x11",
] }
egui = "0.36"
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
] }

[build-dependencies]
winresource = "0.1"

[[test]]
name = "mac_menu_appkit"
harness = false

[target.'cfg(windows)'.dependencies]
pollster = "1"
