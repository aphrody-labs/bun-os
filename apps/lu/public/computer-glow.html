<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LU status</title>
    <!--
      The glow at the edge of the display while LU works on the screen.
      One static page: no script, nothing to load. The window it is shown in
      lets every click through and takes no focus (surface.rs). The colour is
      the accent of the app (--color-lu-accent in src/index.css); a test
      holds the two together.
    -->
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
      }
      .glow {
        --accent: 160, 148, 248;
        position: fixed;
        inset: 0;
        pointer-events: none;
        box-shadow:
          inset 0 0 0 1px rgba(var(--accent), 0.55),
          inset 0 0 18px 2px rgba(var(--accent), 0.42),
          inset 0 0 72px 8px rgba(var(--accent), 0.16);
        animation: breathe 4.8s ease-in-out infinite;
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.62;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .glow {
          animation: none;
          opacity: 0.85;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>
  </body>
</html>
