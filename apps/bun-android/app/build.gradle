import javax.inject.Inject

// Canonical CARGO_HOME: ~/.cargo/registry is a symlink on the factory, and askama (uniffi_bindgen) cannot find its
// templates when the registry path is not canonical.
static String canonicalCargoHome() {
    String env = System.getenv('CARGO_HOME')
    if (env) return env
    def home = new File(System.getProperty('user.home'), '.cargo')
    def registry = new File(home, 'registry').toPath()
    return java.nio.file.Files.isSymbolicLink(registry) ? registry.toRealPath().parent.toString() : home.path
}

plugins {
    alias(libs.plugins.android.application)
