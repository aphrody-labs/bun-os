}

// Rust core (crates/android-native) for every Android ABI, built by cargo-ndk from Gradle. cargo-ndk runs Cargo through
// the workspace's serialized wrapper (scripts/aphrody/build/rust/cargo-serial.sh), which owns the factory lock and the
// four-job limit. The .so files land in a generated jniLibs directory registered on every variant.
abstract class CargoNdkTask extends DefaultTask {
    @InputDirectory @PathSensitive(PathSensitivity.RELATIVE) abstract DirectoryProperty getCrateDir()
    @InputFile @PathSensitive(PathSensitivity.NONE) abstract RegularFileProperty getLockFile()
    @Input abstract ListProperty<String> getAbis()
    @Input abstract Property<Integer> getPlatform()
    @Input abstract Property<String> getProfile()
    @Input abstract Property<String> getFeatures()
    @Internal abstract DirectoryProperty getWorkspace()
    @Internal abstract Property<String> getNdkDir()
    @OutputDirectory abstract DirectoryProperty getOutputDir()
    @Inject abstract ExecOperations getExecOperations()

    @TaskAction
    void build() {
        File out = outputDir.get().asFile
        out.deleteDir()
        out.mkdirs()
        File root = workspace.get().asFile
        List<String> args = ['ndk', '--platform', platform.get().toString(), '--output-dir', out.absolutePath]
        abis.get().each { args.addAll(['--target', it]) }
        args.addAll(['build', '--locked', '-p', 'android-native', '--lib', '--features', features.get()])
        if (profile.get() == 'release') args.add('--release')
        execOperations.exec {
            workingDir = root
            executable = System.getenv('CARGO_NDK') ?: System.getProperty('user.home') + '/.cargo/bin/cargo-ndk'
            delegate.args = args
            environment('CARGO', new File(root, 'scripts/aphrody/build/rust/cargo-serial.sh').absolutePath)
            environment('ANDROID_NDK_HOME', ndkDir.get())
            environment('APHRODY_CARGO_TARGET_DIR', new File(root, 'target/android-native').absolutePath)
            environment('CARGO_BUILD_BUILD_DIR', new File(root, 'target/android-native/build').absolutePath)
            // Factory runtime lane (four jobs, own flock) shared by Android, JVM and Flutter builds (as apps/webos/store/pacman.ts).
            environment('CARGO_HOME', canonicalCargoHome())
            environment('APHRODY_BUILD_HOST', '')
            environment('APHRODY_LOCAL_CARGO', '1')
            environment('APHRODY_CARGO_JOBS', '4')
            environment('APHRODY_CARGO_LOCK_DIR', System.getenv('APHRODY_CARGO_LOCK_DIR') ?: System.getProperty('user.home') + '/.cache/aphrody/lanes/runtime')
            environment('APHRODY_CARGO_LOCK_TIMEOUT_SECS', '10800')
        }
    }
}

// Kotlin bindings of the Rust core generated by uniffi in library mode from a host build of the same crate.
abstract class UniffiKotlinTask extends DefaultTask {
    @InputDirectory @PathSensitive(PathSensitivity.RELATIVE) abstract DirectoryProperty getCrateDir()
    @Internal abstract DirectoryProperty getWorkspace()
    @OutputDirectory abstract DirectoryProperty getOutputDir()
    @Inject abstract ExecOperations getExecOperations()

    @TaskAction
    void generate() {
        File out = outputDir.get().asFile
        out.deleteDir()
        out.mkdirs()
        File root = workspace.get().asFile
        File target = new File(root, 'target/android-native')
        execOperations.exec {
            workingDir = root
            executable = new File(root, 'scripts/aphrody/build/rust/cargo-serial.sh').absolutePath
            // Same feature set as the Bun JNI bridge build, so both share one host artifact.
            args = ['build', '--locked', '-p', 'android-native', '--features', 'invocation,uniffi-cli', '--release']
            environment('APHRODY_CARGO_TARGET_DIR', target.absolutePath)
            environment('CARGO_BUILD_BUILD_DIR', new File(target, 'build').absolutePath)
            // Factory runtime lane (four jobs, own flock) shared by Android, JVM and Flutter builds (as apps/webos/store/pacman.ts).
            environment('CARGO_HOME', canonicalCargoHome())
            environment('APHRODY_BUILD_HOST', '')
            environment('APHRODY_LOCAL_CARGO', '1')
            environment('APHRODY_CARGO_JOBS', '4')
            environment('APHRODY_CARGO_LOCK_DIR', System.getenv('APHRODY_CARGO_LOCK_DIR') ?: System.getProperty('user.home') + '/.cache/aphrody/lanes/runtime')
            environment('APHRODY_CARGO_LOCK_TIMEOUT_SECS', '10800')
        }
        execOperations.exec {
            workingDir = new File(root, 'crates/android-native')
            executable = new File(target, 'release/uniffi-bindgen').absolutePath
            args = ['generate', '--library', new File(target, 'release/libandroid_native.so').absolutePath,
                    '--language', 'kotlin', '--no-format', '--out-dir', out.absolutePath]
        }
    }
}

def workspaceDir = rootProject.layout.projectDirectory.dir('../..')
def rustAbis = ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64']
def ndkVersionPin = '30.0.16248370'
def ndkHome = providers.environmentVariable('ANDROID_NDK_HOME').orElse(providers.environmentVariable('ANDROID_HOME').orElse('/opt/android-sdk').map { "$it/ndk/$ndkVersionPin" })

android {
    namespace = 'com.aphrody.android'
    compileSdk { version = release(37) { minorApiLevel = 2 } }
    buildToolsVersion = '37.0.0'
    ndkVersion = ndkVersionPin
    defaultConfig {
        applicationId = 'com.aphrody.android.setup'
        minSdk = 24
        targetSdk = 37
        versionCode = 2
        versionName = '1.1'
        ndk { abiFilters.addAll(rustAbis) }
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }
    sourceSets {
        main {
            java.srcDir '../../java-ffi/src/main/java'
            // libbun.so per ABI, written by `bun android build --libbun abi=path` (packages/bun-android).
            jniLibs.srcDir '../../../target/android/jniLibs'
            assets.srcDir '../../../packages/android-web/dist'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    // Extract libbun.so to nativeLibraryDir so BunRuntime.exec can spawn it.
    packaging { jniLibs { useLegacyPackaging = true } }
    buildFeatures { compose = true }
    lint { warningsAsErrors = true }
}

def cargoNdkDebug = tasks.register('cargoNdkDebug', CargoNdkTask) {
    crateDir = workspaceDir.dir('crates/android-native')
    lockFile = workspaceDir.file('Cargo.lock')
    abis = rustAbis
    platform = 24
    profile = 'debug'
    features = 'uniffi'
    workspace = workspaceDir
    ndkDir = ndkHome
    outputDir = layout.buildDirectory.dir('rust/jniLibs/debug')
}
def cargoNdkRelease = tasks.register('cargoNdkRelease', CargoNdkTask) {
    crateDir = workspaceDir.dir('crates/android-native')
    lockFile = workspaceDir.file('Cargo.lock')
    abis = rustAbis
    platform = 24
    profile = 'release'
    features = 'uniffi'
    workspace = workspaceDir
    ndkDir = ndkHome
    outputDir = layout.buildDirectory.dir('rust/jniLibs/release')
}
def uniffiKotlin = tasks.register('uniffiKotlin', UniffiKotlinTask) {
    crateDir = workspaceDir.dir('crates/android-native')
    workspace = workspaceDir
    outputDir = layout.buildDirectory.dir('generated/uniffi/kotlin')
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def cargo = variant.buildType == 'release' ? cargoNdkRelease : cargoNdkDebug
        variant.sources.jniLibs?.addGeneratedSourceDirectory(cargo) { it.outputDir }
        variant.sources.kotlin?.addGeneratedSourceDirectory(uniffiKotlin) { it.outputDir }
    }
}

dependencyLocking { lockAllConfigurations() }

dependencies {
    implementation platform(libs.compose.bom)
    androidTestImplementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.foundation
    implementation libs.compose.material3
    implementation libs.compose.navigation.suite
    implementation libs.compose.adaptive
    implementation libs.compose.preview
    implementation libs.activity.compose
    implementation libs.lifecycle.runtime.compose
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.webkit
    // uniffi-generated Kotlin calls the Rust core through JNA (Android AAR with the per-ABI dispatch library).
    implementation "net.java.dev.jna:jna:${libs.versions.jna.get()}@aar"
    debugImplementation libs.compose.tooling
    debugImplementation libs.compose.test.manifest
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.test.runner
    // Compose's transitive Espresso 3.5.0 still reflects InputManager.getInstance,
    // removed on modern Android. Pin the current official stable test runtime.
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.compose.ui.test
}
