[package]
name    = "sd-photos"
version = "0.1.0"
edition = "2021"

[dependencies]
# The Photos catalog is Core Data over SQLite, read synchronously from a
# snapshot. rusqlite rather than sqlx: no async, no pool, one blocking pass.
rusqlite  = { version = "0.32", features = ["bundled"] }
libc      = { version = "0.2.169" }
dirs      = "5.0"
thiserror = { version = "2.0.8" }
tracing   = { version = "0.1.41" }

[dev-dependencies]
tempfile = { version = "3.14.0" }
