[package]
name    = "sd-archive"
version = "0.1.0"
edition = "2021"

[dependencies]
sd-store = { path = "../store" }

sqlx       = { workspace = true, features = ["sqlite", "runtime-tokio", "derive"] }
# "process": adapters are subprocesses speaking JSONL over stdio.
tokio      = { version = "1.42.0", features = ["process"] }
serde      = { version = "1.0.216" }
serde_json = { version = "1.0.133" }
uuid       = { version = "1.10", features = ["v4", "v7"] }
blake3     = { workspace = true }
toml       = { version = "0.8" }
chrono     = { version = "0.4.39" }
thiserror  = { version = "2.0.8" }
tracing    = { version = "0.1.41" }

[dev-dependencies]
tempfile = { version = "3.14.0" }
tokio    = { version = "1.42.0", features = ["macros", "rt-multi-thread"] }

[features]
default = []
