[package]
name    = "sd-task-system"
version = "0.1.0"

authors                = ["Ericson Soares <ericson@spacedrive.com>"]
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
# Workspace deps
async-channel       = { workspace = true }
async-trait         = { version = "0.1.83" }
futures             = { version = "0.3.31" }
futures-concurrency = { workspace = true }
pin-project-lite    = { version = "0.2.15" }
thiserror           = { version = "2.0.8" }
tokio               = { version = "1.42.0", features = ["parking_lot", "rt-multi-thread", "sync", "time"] }
tokio-stream        = { workspace = true }
tracing             = { version = "0.1.41" }
uuid                = { version = "1.10", features = ["v4"] }

# Specific Task System dependencies
downcast-rs = "1.2"

[dev-dependencies]
lending-stream     = { workspace = true }
rand               = { version = "0.9.0-alpha.2" }
rmp-serde          = { workspace = true }
serde              = { version = "1.0.216", features = ["derive"] }
tempfile           = { version = "3.14.0" }
thiserror          = { version = "2.0.8" }
tokio              = { version = "1.42.0", features = ["fs", "macros", "test-util"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-test       = { workspace = true, features = ["no-env-filter"] }
uuid               = { version = "1.10", features = ["serde"] }
