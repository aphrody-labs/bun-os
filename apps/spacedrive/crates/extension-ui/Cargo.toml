[package]
name = "sd-extension-ui"
version = "0.1.0"
edition = "2021"
description = "The part of an extension's ui_manifest.json the daemon and its HTTP servers read: file viewers and the bundles they serve"

[dependencies]
serde = { version = "1.0.216", features = ["derive"] }
serde_json = { version = "1.0.133" }
tokio = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = { version = "3.14.0" }
tokio = { version = "1", features = ["fs", "macros", "rt"] }
