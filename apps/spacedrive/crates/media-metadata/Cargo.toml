[package]
name    = "sd-media-metadata"
version = "0.1.0"

authors = [
	"Ericson Soares <ericson@spacedrive.com>",
	"Jake Robinson <jake@spacedrive.com>",
	"Vítor Vasconcellos <vitor@spacedrive.com>"
]
edition = "2021"

[features]
ffmpeg = ["dep:sd-ffmpeg"]

[dependencies]
# Spacedrive Sub-crates
sd-ffmpeg = { path = "../ffmpeg", optional = true }
sd-utils  = { path = "../utils" }

# Workspace dependencies
chrono     = { version = "0.4.39", features = ["serde"] }
image      = { version = "0.25.5" }
serde      = { version = "1.0.216", features = ["derive"] }
serde_json = { version = "1.0.133" }
specta     = { git = "https://github.com/jamiepine/specta", branch = "main", features = ["chrono", "derive"] }
thiserror  = { version = "2.0.8" }
tokio      = { version = "1.42.0", features = ["rt", "rt-multi-thread"] }

# Specific Media Metadata dependencies
kamadak-exif = "0.5.5"
