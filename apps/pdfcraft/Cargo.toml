[package]
name = "pdfcraft"
publish = false
description = "PdfCraft desktop app"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

# `"*"` matches every non-workspace package: crates.io dependencies and the
# vendored crates under `vendor/` (excluded from the workspace). Our own crates
# keep full debug info. Dependencies keep only line tables, so backtraces still
# show file and line, but debug info for the whole dependency graph stays out of
# every test binary (each UI test binary had a 500-600 MB PDB on Windows, #454).

[dependencies]
ureq = { version = "3.4", default-features = false, features = [
  "rustls-no-provider",
  "_ring",
] }
rustls-native-certs = "0.8"
pdfcraft-ui-egui = { path = "../../crates/pdfcraft-ui-egui", version = "0.7.1" }
pdfcraft-engine = { path = "../../crates/pdfcraft-engine", version = "0.7.1" }
eframe = { version = "0.36", default-features = false, features = [
  "default_fonts",
  "wgpu",
  "glow",
  "accesskit",
  "wayland",
  "x11",
  "persistence",
  "links",
] }
egui = "0.36"
serde_json = "1"
log = "0.4"

[dev-dependencies]
pollster = "1.0"

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = "0.32"

[target.'cfg(windows)'.dependencies]
uds_windows = "1"
windows = { workspace = true, features = ["UI_ViewManagement"] }
winsafe = { workspace = true, features = ["user"] }
