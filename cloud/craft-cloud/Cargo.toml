# SPDX-License-Identifier: Apache-2.0
[package]
name = "craft-cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Cloud files and documents for the craft apps: Google Drive, Docs, Sheets, Slides, Photos, Calendar, Gmail, People, Tasks, Play and Gemini, and OneDrive/SharePoint with the Excel workbook API, over Graph, with change feeds, offline cache and conflict handling."

[dependencies]
aphrody-accounts = { path = "../aphrody-accounts", default-features = false }
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }
serde_json = "1.0.151"
url = "2.5.8"
sha2 = "0.11.0"
base64 = "0.23.1"
getrandom = "0.4.3"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
