<!doctype html>
<!-- Open Graph card source (1200x630), rendered to assets/craft/og.png by `craft-site.ts og`; never served. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="craft.css">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { display: grid; grid-template-columns: 1fr 560px; align-items: center; gap: 48px; padding: 0 72px; box-sizing: border-box; }
    .brand { font-size: 40px; margin-bottom: 36px; }
    .brand img { width: 48px; height: 48px; }
    h1 { font-size: 76px; letter-spacing: -3px; margin: 0 0 24px; }
    .intro { font-size: 24px; line-height: 1.5; margin: 0; }
    .stack { position: relative; height: 420px; }
    .stack img { position: absolute; width: 440px; height: 275px; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); }
    .stack img:nth-child(1) { top: 0; left: 0; }
    .stack img:nth-child(2) { top: 72px; left: 60px; }
    .stack img:nth-child(3) { top: 144px; left: 120px; }
  </style>
</head>
<body>
  <div>
    <div class="brand"><img src="icon-192.png" alt="">craft<span class="brand-by">by Aphrody</span></div>
    <h1>A space for<br>your <em>next idea.</em></h1>
    <p class="intro">Fourteen focused studios for image, motion, sound and documents, right in your browser.</p>
  </div>
  <div class="stack"><img src="previews/word.jpg" alt=""><img src="previews/film.jpg" alt=""><img src="previews/photo.jpg" alt=""></div>
</body>
</html>
